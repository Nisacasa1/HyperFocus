/* ── Tracker view — the day as a calendar ─────────────────────────────────
   Drag on the grid to create an entry of ANY length (snapped to 5 min), like
   a calendar. On touch devices drag is left to scrolling — "New entry" opens
   the same form with free start/end times. */
const HOUR_PX = 48;         // one hour of the day, in pixels
const CAL_SNAP = 5;         // minutes
const MIN_BLOCK_PX = 14;    // a block never draws shorter than this, or its label is unreadable
const Tracker = ({ allEntries, sessions=[], breaks=[], countdown, enabled=true, onLogNow, onAddEntry, onDeleteEntry }) => {
  const fmtC=s=>`${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`;
  const now=new Date();
  const nowMin=now.getHours()*60+now.getMinutes();
  const today=todayStr();

  // The calendar is a real calendar: every logged day stays, and you can walk
  // back to it. Entries pin to their date forever; today is just the default.
  const [day, setDay] = useState(today);
  const isToday = day===today;
  const shiftDay = (n) => setDay(d=>{ const dt=new Date(d+"T12:00:00"); dt.setDate(dt.getDate()+n); const nd=localDate(dt); return nd>today?today:nd; });
  const entries = allEntries.filter(e=>e.date&&localDate(new Date(e.date))===day);
  const loggedDays = new Set(allEntries.filter(e=>e.date).map(e=>localDate(new Date(e.date))));

  /* Sessions and breaks are NOT tracker entries — they are never written into
     the log. They are drawn straight from the focus history, so the two systems
     complement each other instead of duplicating: the tracker answers "where did
     the day go", the sessions answer "when was I actually working". */
  const daySessions = sessions
    .filter(s=>s.date&&localDate(new Date(s.date))===day&&s.startTime&&s.time)
    .map(s=>({ id:"s"+s.id, kind:"session", text:s.task||"Focus session",
               startTime:s.startTime, endTime:s.time,
               duration:Math.round((s.dur||0)/60), quality:s.quality }));
  const dayBreaks = breaks
    .filter(b=>b.date&&localDate(new Date(b.date))===day&&b.startTime&&b.endTime)
    .map(b=>({ id:"b"+b.id, kind:"break", text:b.type==="real"?"Break — no input":b.type==="degenerate"?"Break — screens":"Break",
               startTime:b.startTime, endTime:b.endTime,
               duration:Math.round((b.dur||0)/60) }));

  const dStr=new Date(day+"T12:00:00").toLocaleDateString("en-US",{weekday:"long",month:"long",day:"numeric"});
  const totalMins=entries.reduce((a,e)=>a+(e.duration||0),0);
  const focusMins=daySessions.reduce((a,s)=>a+(s.duration||0),0);

  const [drag,  setDrag]  = useState(null);   // {a,b} minutes while dragging
  const [draft, setDraft] = useState(null);   // {start,end} → entry form open
  const gridRef   = useRef(null);
  const scrollRef = useRef(null);
  const dragRef   = useRef(null);
  useEffect(()=>{ dragRef.current=drag; },[drag]);

  // Land the viewport on the working part of the day, not on 00:00.
  useEffect(()=>{
    const el=scrollRef.current; if(!el) return;
    const target=Math.max(0,(Math.min(nowMin,20*60)-120)/60*HOUR_PX);
    el.scrollTop=target;
  },[]);

  const minToY = m => m/60*HOUR_PX;
  const snap   = m => Math.round(m/CAL_SNAP)*CAL_SNAP;
  const minAt  = (clientY) => {
    const r=gridRef.current.getBoundingClientRect();
    return Math.max(0,Math.min(24*60,(clientY-r.top)/HOUR_PX*60));
  };

  const onDown = (e) => {
    if(e.pointerType!=="mouse") return;               // touch scrolls; button covers mobile
    if(e.target.closest(".cal__block")) return;       // blocks are not a drawing surface
    const m=snap(minAt(e.clientY));
    setDrag({a:m,b:m});
    try { gridRef.current.setPointerCapture(e.pointerId); } catch(err) {}
  };
  const onMove = (e) => { if(dragRef.current) setDrag(d=>({...d,b:snap(minAt(e.clientY))})); };
  const onUp   = () => {
    const d=dragRef.current; if(!d) return;
    setDrag(null);
    const s=Math.min(d.a,d.b), en=Math.max(d.a,d.b);
    // a plain click (no real drag) proposes a 30-min block starting there
    setDraft(en-s>=CAL_SNAP ? {start:s,end:en} : {start:s,end:Math.min(s+30,24*60)});
  };

  const shaped = (list) => list
    .filter(e=>e.startTime&&e.endTime)
    .map(e=>{
      const s=minOfDay(e.startTime);
      return {...e, s, e:Math.max(minOfDay(e.endTime), s+1)};
    });

  /* One column, one activity at a time — the day is a strict partition, never a
     stack. Painter's algorithm: sessions and breaks go down first as the base
     layer, then each logged entry is painted over them in the order it was
     written, cutting out the stretch it covers.

     So a quick log made during a session doesn't sit on top of it: it splits it.
     The session becomes "before the interruption", the interruption, and "after
     the interruption" — which is what actually happened. A later entry also cuts
     into an earlier one, because the later one is the correction. */
  const partition = (base, overlays) => {
    let segs = base.map(b=>({...b}));
    overlays.forEach(o=>{
      const next=[];
      segs.forEach(seg=>{
        if(o.e<=seg.s || o.s>=seg.e){ next.push(seg); return; }   // untouched
        if(o.s>seg.s) next.push({...seg, e:o.s});                 // piece before
        if(o.e<seg.e) next.push({...seg, s:o.e, __cont:true});    // piece after
        // fully covered → the segment disappears
      });
      next.push({...o});
      segs=next;
    });
    return segs
      .filter(x=>x.e-x.s>=1)          // drop slivers left by an exact overlap
      .sort((a,b)=>a.s-b.s);
  };

  const segments = partition(
    shaped([...daySessions, ...dayBreaks]).sort((a,b)=>a.s-b.s),
    shaped(entries.map(e=>({...e,kind:"entry"}))),   // insertion order = paint order
  );

  /* A five-minute block is 4px tall at this scale, so short blocks are drawn at
     a floor of MIN_BLOCK_PX or their label is unreadable. That inflation would
     land on whatever comes next, so the run is pushed down by the overflow — a
     partition must never show two blocks on top of each other. Any gap in the
     day puts the run back on the true grid. */
  let flow=-Infinity;
  const blocks = segments.map(b=>{
    const h=Math.max(MIN_BLOCK_PX, minToY(b.e-b.s));
    const top=Math.max(minToY(b.s), flow);
    flow=top+h;
    return {...b, __top:top, __h:h};
  });

  return (
    <div className="page">
      <div style={{marginBottom:28}}>
        <div className="eyebrow">{dStr}{isToday?"":" · past day"}</div>
        <div style={{display:"flex",alignItems:"center",gap:12,flexWrap:"wrap"}}>
          <h1 className="h-serif" style={{fontSize:44,margin:"8px 0 0"}}>Time tracker</h1>
          <div style={{display:"flex",gap:4,alignItems:"center",marginTop:8}}>
            <button className="iconbtn" title="Previous day" aria-label="Previous day" onClick={()=>shiftDay(-1)} style={{transform:"rotate(180deg)"}}><Icon name="chevronRight" size={15}/></button>
            <button className="iconbtn" title="Next day" aria-label="Next day" onClick={()=>shiftDay(1)} disabled={isToday} style={isToday?{opacity:.3,cursor:"default"}:{}}><Icon name="chevronRight" size={15}/></button>
            {!isToday&&<button className="btn btn--ghost" style={{padding:"4px 10px",fontSize:12}} onClick={()=>setDay(today)}>Back to today</button>}
          </div>
        </div>
      </div>
      <div className="card-s" style={{marginBottom:28}}>
        <div className="tracker-summary">
          <div className="kpi"><div className="kpi__label">Next check-in</div><div className="kpi__value" style={{fontSize:32}}>{enabled?fmtC(countdown):<span style={{color:"var(--hf-fg-subtle)",fontSize:16}}>Off</span>}</div></div>
          <div className="kpi"><div className="kpi__label">Tracked</div><div className="kpi__value" style={{fontSize:32}}>{totalMins>0?<span>{fmtMins(totalMins)}</span>:<span style={{color:"var(--hf-fg-subtle)"}}>—</span>}</div><div className="kpi__sub">{entries.length} {entries.length===1?"entry":"entries"}</div></div>
          <div className="kpi"><div className="kpi__label">Focused</div><div className="kpi__value" style={{fontSize:32}}>{focusMins>0?<span>{fmtMins(focusMins)}</span>:<span style={{color:"var(--hf-fg-subtle)"}}>—</span>}</div><div className="kpi__sub">{daySessions.length} {daySessions.length===1?"session":"sessions"}</div></div>
        </div>
        <div style={{marginTop:20,display:"flex",gap:8,flexWrap:"wrap"}}>
          <button className="btn btn--primary" onClick={onLogNow}><Icon name="plus" size={14}/> Log now</button>
          <button className="btn btn--secondary" onClick={()=>setDraft({start:snap(Math.max(0,nowMin-60)),end:snap(nowMin)||30})}><Icon name="calendar" size={14}/> New entry</button>
        </div>
      </div>

      <div style={{display:"flex",justifyContent:"space-between",alignItems:"baseline",marginBottom:12}}>
        <h2 className="h-serif" style={{fontSize:24,margin:0}}>The day</h2>
        <span style={{fontSize:12,color:"var(--hf-fg-muted)"}}>Drag on the grid to log any stretch of time — down to 5 minutes.</span>
      </div>

      <div className="cal" ref={scrollRef}>
        <div className="cal__hours" style={{height:24*HOUR_PX}}>
          {Array.from({length:23},(_,i)=>i+1).map(h=>(
            <span key={h} className="cal__hourlabel" style={{top:minToY(h*60)}}>{String(h).padStart(2,"0")}:00</span>
          ))}
        </div>
        <div className="cal__grid" ref={gridRef} style={{height:24*HOUR_PX}}
          onPointerDown={onDown} onPointerMove={onMove} onPointerUp={onUp} onPointerCancel={()=>setDrag(null)}>
          {Array.from({length:47},(_,i)=>i+1).map(i=>(
            <div key={i} className={"cal__line"+(i%2?" cal__line--half":"")} style={{top:minToY(i*30)}}/>
          ))}
          {blocks.map(b=>{
            /* A split piece shows its own span, not the original's — the point
               is to read what actually happened between the interruptions. */
            const mins=b.e-b.s, from=hhmmOfMin(b.s), to=hhmmOfMin(b.e);
            return (
              <div key={`${b.id}-${b.s}`} className={"cal__block cal__block--"+b.kind+(b.__cont?" cal__block--cont":"")}
                style={{top:b.__top,height:b.__h}}
                title={`${from} — ${to} · ${fmtMins(mins)}\n${b.text}`}>
                <div className="cal__block__text">
                  {b.kind==="session"&&<Icon name="timer" size={10}/>}
                  {b.kind==="break"&&<Icon name="coffee" size={10}/>}
                  {b.__cont&&<span className="cal__block__cont" title="Resumed after the interruption">↳</span>}
                  {b.text}
                </div>
                {mins>=25&&(
                  <div className="cal__block__time">
                    {from} — {to} · {fmtMins(mins)}
                    {b.quality?` · ${"★".repeat(b.quality)}`:""}
                  </div>
                )}
                {/* Only manual entries can be deleted here. A session is history —
                    it is removed from Today, not from the calendar. */}
                {b.kind==="entry"&&(
                  <button className="cal__block__del" title="Delete entry" aria-label={`Delete entry: ${b.text}`}
                    onPointerDown={e=>e.stopPropagation()} onClick={()=>onDeleteEntry(b.id)}>
                    <Icon name="x" size={11}/>
                  </button>
                )}
              </div>
            );
          })}
          {drag&&(()=>{ const s=Math.min(drag.a,drag.b), en=Math.max(drag.a,drag.b); return (
            <div className="cal__ghost" style={{top:minToY(s),height:Math.max(10,minToY(en-s))}}>
              {hhmmOfMin(s)} — {hhmmOfMin(en)}{en>s?` · ${fmtMins(en-s)}`:""}
            </div>
          );})()}
          {isToday&&<div className="cal__now" style={{top:minToY(nowMin)}}/>}
        </div>
      </div>

      <div className="cal-key">
        <span className="cal-key__item"><span className="cal-key__swatch cal-key__swatch--entry"/>what you logged</span>
        <span className="cal-key__item"><span className="cal-key__swatch cal-key__swatch--session"/>focus sessions</span>
        <span className="cal-key__item"><span className="cal-key__swatch cal-key__swatch--break"/>breaks</span>
        <span className="cal-key__note">One activity at a time: anything you log during a session splits it, and the session resumes (↳) after the interruption.</span>
      </div>

      {entries.length===0&&(
        <p style={{fontSize:13,color:"var(--hf-fg-muted)",fontStyle:"italic",marginTop:14}}>
          {isToday
            ? <>Nothing logged yet. Drag on the grid, hit the <b>+</b> button, or wait for the check-in ({enabled?fmtC(countdown):"off"}).</>
            : <>Nothing was logged this day. You can still fill it in — drag on the grid.</>}
        </p>
      )}
      {loggedDays.size>1&&(
        <p style={{fontSize:12,color:"var(--hf-fg-subtle)",marginTop:8}}>
          {loggedDays.size} days logged so far — use the arrows to walk back through them.
        </p>
      )}

      {draft&&<TrackerEntryForm start={draft.start} end={draft.end}
        onSave={(text,s,en)=>{ onAddEntry(text,s,en,day); setDraft(null); }}
        onClose={()=>setDraft(null)}/>}
    </div>
  );
};

/* ── Daily Practices ── */
const DailyPractices = ({ practiceLog, onLogPractice }) => {
  const R=46, CIRC=2*Math.PI*R;
  const [timerPhase, setTimerPhase] = useState("idle"); // idle | running | complete
  const [activePractice, setActivePractice] = useState(null);
  const [remaining, setRemaining] = useState(0);

  const timerTsRef      = useRef(0);
  const timerTotalRef   = useRef(0);
  const timerElapsedRef = useRef(0);
  const timerPhaseRef   = useRef("idle");

  useEffect(()=>{ timerPhaseRef.current=timerPhase; },[timerPhase]);

  // Wall-clock timer tick
  useEffect(()=>{
    if(timerPhase!=="running") return;
    const tick=setInterval(()=>{
      const elapsed=timerElapsedRef.current+Math.floor((Date.now()-timerTsRef.current)/1000);
      setRemaining(Math.max(0,timerTotalRef.current-elapsed));
    },500);
    return ()=>clearInterval(tick);
  },[timerPhase]);

  // Visibility change catch-up
  useEffect(()=>{
    const onVis=()=>{
      if(document.hidden||timerPhaseRef.current!=="running") return;
      const elapsed=timerElapsedRef.current+Math.floor((Date.now()-timerTsRef.current)/1000);
      setRemaining(Math.max(0,timerTotalRef.current-elapsed));
    };
    document.addEventListener("visibilitychange",onVis);
    return ()=>document.removeEventListener("visibilitychange",onVis);
  },[]);

  // Practice complete
  useEffect(()=>{
    if(timerPhase==="running"&&remaining===0&&activePractice){
      const pr=PRACTICES.find(p=>p.id===activePractice);
      playChime();
      onLogPractice({ id:newId(), practiceId:activePractice, name:pr.name, date:new Date().toISOString(), duration:timerTotalRef.current });
      setTimerPhase("complete");
    }
  },[remaining,timerPhase]);

  const beginPractice=(pr)=>{
    timerTotalRef.current=pr.duration;
    timerTsRef.current=Date.now();
    timerElapsedRef.current=0;
    setRemaining(pr.duration);
    setActivePractice(pr.id);
    setTimerPhase("running");
  };
  const cancelTimer=()=>{ setTimerPhase("idle"); setActivePractice(null); setRemaining(0); };
  const pledgePractice=(pr)=>{
    onLogPractice({ id:newId(), practiceId:pr.id, name:pr.name, date:new Date().toISOString(), duration:null });
  };

  const today=todayStr();
  const todayLog=practiceLog.filter(e=>e.date&&localDate(new Date(e.date))===today);
  const doneIds=new Set(todayLog.map(e=>e.practiceId));

  // Timer stage
  if(timerPhase==="running"||timerPhase==="complete"){
    const pr=PRACTICES.find(p=>p.id===activePractice);
    const pct=timerTotalRef.current>0?(timerTotalRef.current-remaining)/timerTotalRef.current:1;
    const offset=CIRC*(1-pct);
    return (
      <div className="focus-stage">
        <div className="dp-timer__name">{pr.name}</div>
        <div className="dp-timer__desc">{pr.instruction}</div>
        <div className="ring ring--dp">
          <svg viewBox="0 0 100 100">
            <circle className="ring__bg" cx="50" cy="50" r={R}/>
            <circle className="ring__fg" cx="50" cy="50" r={R} strokeDasharray={CIRC} strokeDashoffset={offset}/>
          </svg>
          <div className="ring__inner">
            <div className="ring__timer" style={{fontSize:76}}>{fmt(remaining)}</div>
            <div className="ring__label">{timerPhase==="complete"?"Complete":"Practice"}</div>
          </div>
        </div>
        {timerPhase==="complete"?(
          <div style={{textAlign:"center",display:"flex",flexDirection:"column",alignItems:"center",gap:10}}>
            <div style={{fontSize:13,color:"var(--hf-fg-muted)"}}>Practice recorded for today.</div>
            <button className="btn btn--primary btn--lg" onClick={cancelTimer}><Icon name="check" size={14}/> Done</button>
          </div>
        ):(
          <div style={{display:"flex",gap:10}}>
            <button className="btn btn--ghost btn--lg" onClick={cancelTimer}><Icon name="x" size={14}/> Cancel</button>
          </div>
        )}
      </div>
    );
  }

  // Grouped history (last 14 days, excluding today)
  const historyLog=[...practiceLog].filter(e=>e.date&&localDate(new Date(e.date))!==today).sort((a,b)=>b.date.localeCompare(a.date));
  const histByDay={};
  historyLog.forEach(e=>{
    const d=localDate(new Date(e.date));
    if(!histByDay[d]) histByDay[d]=[];
    histByDay[d].push(e);
  });
  const histDays=Object.keys(histByDay).sort((a,b)=>b.localeCompare(a)).slice(0,7);

  return (
    <div className="page">
      <div style={{marginBottom:32}}>
        <div className="eyebrow">Practice</div>
        <h1 className="h-serif" style={{fontSize:44,margin:"8px 0 0"}}>Daily Practices</h1>
        <p style={{color:"var(--hf-fg-muted)",fontSize:13,marginTop:8,lineHeight:1.6}}>Stoic exercises made actionable. One session at a time.</p>
      </div>

      <div className="dp-grid">
        {PRACTICES.map(pr=>{
          const done=doneIds.has(pr.id);
          return (
            <div key={pr.id} className={"dp-card"+(done?" dp-card--done":"")}>
              <div className="dp-card__head">
                <div>
                  <div className="dp-card__name">{pr.name}</div>
                  <div className="dp-card__time">{pr.time}</div>
                </div>
                <Icon name={pr.icon} size={16}/>
              </div>
              <div className="dp-card__desc">{pr.desc}</div>
              {done?(
                <span className="badge badge--success"><span className="dot"/>Done today</span>
              ):pr.duration?(
                <button className="btn btn--primary" onClick={()=>beginPractice(pr)}>
                  <Icon name="play" size={14}/> Begin · {Math.floor(pr.duration/60)} min
                </button>
              ):(
                <button className="btn btn--secondary" onClick={()=>pledgePractice(pr)}>
                  <Icon name="check" size={14}/> Pledge for today
                </button>
              )}
            </div>
          );
        })}
      </div>

      {todayLog.length>0&&(
        <>
          <h2 className="h-serif" style={{fontSize:22,margin:"0 0 14px"}}>Completed today</h2>
          <div style={{marginBottom:32}}>
            {todayLog.map((e,i)=>(
              <div key={i} className="dp-log-entry">
                <span className="dp-log-entry__check"><Icon name="check" size={14}/></span>
                <span className="dp-log-entry__name">{e.name}</span>
                {e.duration&&<span className="dp-log-entry__dur">{fmtDur(e.duration)}</span>}
                <span className="dp-log-entry__time">{new Date(e.date).toLocaleTimeString("en-US",{hour:"2-digit",minute:"2-digit",hour12:false})}</span>
              </div>
            ))}
          </div>
        </>
      )}

      {histDays.length>0&&(
        <>
          <h2 className="h-serif" style={{fontSize:22,margin:"0 0 14px"}}>Recent history</h2>
          {histDays.map(d=>(
            <div key={d} style={{marginBottom:20}}>
              <div style={{fontSize:11,letterSpacing:".1em",textTransform:"uppercase",color:"var(--hf-fg-muted)",fontWeight:500,marginBottom:8}}>
                {new Date(d+"T12:00:00").toLocaleDateString("en-US",{weekday:"short",month:"short",day:"numeric"})}
              </div>
              {histByDay[d].map((e,i)=>(
                <div key={i} className="dp-log-entry">
                  <span className="dp-log-entry__check"><Icon name="check" size={14}/></span>
                  <span className="dp-log-entry__name">{e.name}</span>
                  {e.duration&&<span className="dp-log-entry__dur">{fmtDur(e.duration)}</span>}
                  <span className="dp-log-entry__time">{new Date(e.date).toLocaleTimeString("en-US",{hour:"2-digit",minute:"2-digit",hour12:false})}</span>
                </div>
              ))}
            </div>
          ))}
        </>
      )}

      {practiceLog.length===0&&todayLog.length===0&&(
        <div style={{color:"var(--hf-fg-muted)",fontSize:14,fontStyle:"italic",paddingTop:8}}>No practices recorded yet. Begin one above.</div>
      )}
    </div>
  );
};

/* ── The Day ── */
const TheDay = ({ rituals, setRituals, purpose, mits, setMits, sessions, practiceLog, streak, onEnterDay }) => {
  const today    = todayStr();
  const entry    = rituals[today] || {};
  const opened   = !!entry.openedAt;
  const hour     = new Date().getHours();
  const greeting = hour<5 ? "Still awake." : hour<12 ? "Good morning." : hour<19 ? "Good afternoon." : "Good evening.";

  const plan     = mits[today] || {tasks:["","",""],done:[false,false,false]};
  // Emptying a slot also clears its tick, or the next thing typed there arrives
  // already crossed out.
  const setTask  = (i,val) => setMits(m=>({...m,[today]:{
    ...plan,
    tasks: plan.tasks.map((t,j)=>j===i?val:t),
    done:  plan.done.map((d,j)=>j===i&&!val.trim()?false:d),
  }}));
  const toggle   = (i) => { if(!plan.tasks[i]) return; setMits(m=>({...m,[today]:{...plan,done:plan.done.map((d,j)=>j===i?!d:d)}})); };

  /* Tomorrow's three things, decided tonight. Same store, next key — so come
     morning they are already waiting at the top of this page and the day opens
     with the deciding done. Morning-you should not have to invent the day. */
  const tomorrow = (()=>{ const d=new Date(); d.setDate(d.getDate()+1); return localDate(d); })();
  const nextPlan = mits[tomorrow] || {tasks:["","",""],done:[false,false,false]};
  const setNextTask = (i,val) => setMits(m=>({...m,[tomorrow]:{...nextPlan,tasks:nextPlan.tasks.map((t,j)=>j===i?val:t)}}));
  const nextCount = nextPlan.tasks.filter(t=>t.trim()).length;
  const fmtTomorrow = new Date(tomorrow+"T12:00:00").toLocaleDateString("en-US",{weekday:"long",month:"long",day:"numeric"});

  const focusedSecs = sessions.reduce((a,s)=>a+(s.dur||0),0);
  const mitsDone    = plan.tasks.filter((t,i)=>t&&plan.done[i]).length;
  const mitsTotal   = plan.tasks.filter(t=>t).length;
  const practices   = practiceLog.filter(p=>p.date&&localDate(new Date(p.date))===today).length;
  const byKind      = kindSecs(sessions);

  const openDay  = () => { setRituals(r=>({...r,[today]:{...(r[today]||{}),openedAt:new Date().toISOString()}})); onEnterDay(); };
  // Past plans (absorbed from the old Planning page — one place to decide, one to review)
  // Strictly BEFORE today: tomorrow's plan is not history, it has its own section.
  const pastPlans = Object.entries(mits)
    .filter(([d,plan])=>d<today && (plan.tasks||[]).some(t=>t))
    .sort((a,b)=>b[0].localeCompare(a[0]))
    .slice(0,7);
  const fmtPlanDay = (d) => new Date(d+"T12:00:00").toLocaleDateString("en-US",{weekday:"short",month:"short",day:"numeric"});

  return (
    <div className="page">
      <div className="day-hero">
        <div className="eyebrow">{new Date().toLocaleDateString("en-US",{weekday:"long",month:"long",day:"numeric"})}</div>
        <h1 className="day-greet">{greeting}</h1>
        <div className="day-sub">
          {streak>0
            ? <>Day <b>{streak}</b> of your streak. {opened?"":"Don't break the chain."}</>
            : <>No streak yet — one session today starts it.</>}
        </div>
        {purpose.northStar
          ? <div className="day-star">{purpose.northStar}</div>
          : <div className="day-sub" style={{marginTop:20,fontStyle:"italic"}}>You haven't written a North Star yet. It belongs at the top of this page — set it on Purpose.</div>}
        {/* The other pole of the field of tension — what today is a vote against. */}
        {purpose.antiVision && (
          <div className="day-sub" style={{marginTop:14,maxWidth:620}}>
            <b style={{fontSize:10,letterSpacing:".14em",textTransform:"uppercase",color:"var(--hf-fg-subtle)",fontWeight:500}}>And what you refuse:</b>{" "}
            <span style={{fontStyle:"italic",color:"var(--hf-fg-muted)"}}>{purpose.antiVision.split("\n")[0]}</span>
          </div>
        )}
      </div>

      {/* ── Morning ── */}
      {!opened ? (
        <div className="day-section">
          <h2 className="day-section__title">Three things</h2>
          <p className="day-section__note">What would make today a success? Decide now, before the day decides for you.</p>
          <div className="card-s">
            {[0,1,2].map(i=>(
              <div key={i} className="mit-row">
                <input type="checkbox" className="mit-check" checked={plan.done[i]&&!!plan.tasks[i]} onChange={()=>toggle(i)}/>
                <input className={"mit-input"+(plan.done[i]&&plan.tasks[i]?" mit-input--done":"")}
                  placeholder={["Most important task…","Second priority…","Third priority…"][i]}
                  value={plan.tasks[i]} onChange={e=>setTask(i,e.target.value)}/>
              </div>
            ))}
            <button className="btn btn--primary btn--lg" style={{marginTop:20}} onClick={openDay}>
              <Icon name="play" size={14}/> Begin the day
            </button>
          </div>
        </div>
      ) : (
        <div className="day-section">
          <h2 className="day-section__title">Today so far</h2>
          <p className="day-section__note">Opened at {formatHHMM(new Date(entry.openedAt))}.</p>
          <div className="card-s">
            <div className="day-figures">
              <div><div className="day-figure__label">Focused</div><div className="day-figure__value">{focusedSecs?fmtDur(focusedSecs):"—"}</div></div>
              <div><div className="day-figure__label">Sessions</div><div className="day-figure__value">{sessions.length||"—"}</div></div>
              <div><div className="day-figure__label">Priorities</div><div className="day-figure__value">{mitsTotal?<>{mitsDone}<small>/{mitsTotal}</small></>:"—"}</div></div>
              <div><div className="day-figure__label">Practices</div><div className="day-figure__value">{practices||"—"}</div></div>
            </div>
            {/* Did the day have all three of its moments? */}
            <div style={{marginTop:24,paddingTop:20,borderTop:"1px solid var(--hf-border)"}}>
              <div className="eyebrow" style={{marginBottom:10}}>The shape of the day</div>
              <div className="shape">
                {KINDS.map(k=>{
                  const secs=byKind[k.id];
                  return (
                    <div className={"shape__item"+(secs>0?" shape__item--on":"")} key={k.id} title={k.blurb}>
                      <div className="shape__name">{k.label}</div>
                      <div className="shape__val">{secs?fmtDur(secs):"—"}</div>
                    </div>
                  );
                })}
              </div>
              <p style={{fontSize:12,color:"var(--hf-fg-subtle)",lineHeight:1.6,margin:"12px 0 0"}}>
                {byKind.use>0&&byKind.fill===0&&byKind.empty===0
                  ? "All output, no input and no emptying. That is the shape that burns out."
                  : "Create, learn, and let the mind idle. A day needs all three."}
              </p>
            </div>

            {/* All three rows, always. Rendering only the filled ones meant that
                clearing a task deleted the field you were typing in, and clearing
                all three removed the section with no way to get it back. */}
            <div style={{marginTop:24,borderTop:"1px solid var(--hf-border)",paddingTop:6}}>
              {[0,1,2].map(i=>(
                <div key={i} className="mit-row">
                  <input type="checkbox" className="mit-check" checked={!!(plan.done[i]&&plan.tasks[i])}
                    onChange={()=>toggle(i)} aria-label={`Mark priority ${i+1} done`}/>
                  <input className={"mit-input"+(plan.done[i]&&plan.tasks[i]?" mit-input--done":"")}
                    placeholder={["Most important task…","Second priority…","Third priority…"][i]}
                    value={plan.tasks[i]||""} onChange={e=>setTask(i,e.target.value)}/>
                </div>
              ))}
            </div>
          </div>
        </div>
      )}

      {/* ── Tomorrow ── */}
      {opened&&(
        <div className="day-section">
          <h2 className="day-section__title">Tomorrow</h2>
          <p className="day-section__note">
            Decide it tonight, while today is still fresh and you know what it cost.
            These three are waiting for you when you open {fmtTomorrow.split(",")[0]}.
          </p>
          <div className="card-s">
            {[0,1,2].map(i=>(
              <div key={i} className="mit-row">
                <span className="mit-num">{i+1}</span>
                <input className="mit-input"
                  placeholder={["Tomorrow's most important task…","Second priority…","Third priority…"][i]}
                  value={nextPlan.tasks[i]||""} onChange={e=>setNextTask(i,e.target.value)}/>
              </div>
            ))}
            <p style={{fontSize:12,color:"var(--hf-fg-subtle)",lineHeight:1.6,margin:"14px 0 0"}}>
              {nextCount===0
                ? <>Nothing set for {fmtTomorrow}. Leave it blank and morning-you decides instead.</>
                : <><b>{nextCount}</b> {nextCount===1?"thing":"things"} set for {fmtTomorrow}.</>}
            </p>
          </div>
        </div>
      )}

      {/* ── Recent plans ── */}
      {pastPlans.length>0&&(
        <div className="day-section">
          <h2 className="day-section__title">Recent plans</h2>
          <p className="day-section__note">The three things of previous days, and whether they happened.</p>
          <div className="card-s">
            <div className="plan-history">
              {pastPlans.map(([d,plan])=>{
                const tasks=plan.tasks||[]; const done=plan.done||[];
                return (
                  <div key={d} className="plan-day">
                    <div className="plan-day__date">{fmtPlanDay(d)}</div>
                    <div className="plan-day__tasks">
                      {tasks.map((t,i)=>t?(
                        <div key={i} className={"plan-day__task"+(done[i]?" plan-day__task--done":"")}>
                          <div className={"plan-day__dot"+(done[i]?" plan-day__dot--done":"")}/>
                          {t}
                        </div>
                      ):null)}
                    </div>
                  </div>
                );
              })}
            </div>
          </div>
        </div>
      )}
    </div>
  );
};

/* ── War Map ──────────────────────────────────────────────────────────────
   The year at war-room altitude: twelve months, every day colored by the focus
   it actually held. Unlike the spreadsheet it comes from, nothing is painted by
   hand — the color IS the data. Objectives per month and five standing rules. */
const WarMap = ({ warmap, setWarmap, sessions, rituals }) => {
  const year = new Date().getFullYear();
  const today = todayStr();
  const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];

  // minutes of focus per local day
  const dayMins = {};
  sessions.forEach(s=>{ if(s.date){ const d=localDate(new Date(s.date)); dayMins[d]=(dayMins[d]||0)+Math.floor((s.dur||0)/60); } });
  const level = (m) => m===0?0:m<20?1:m<45?2:m<90?3:4;

  const objectives = warmap.objectives||{};
  const rules = warmap.rules||["","","","",""];
  const setObjective = (key,v) => setWarmap(w=>({...w,objectives:{...(w.objectives||{}),[key]:v}}));
  const setRule = (i,v) => setWarmap(w=>{ const r=[...(w.rules||["","","","",""])]; r[i]=v; return {...w,rules:r}; });

  const monthCells = (mi) => {
    const first=new Date(year,mi,1);
    const pad=(first.getDay()+6)%7;                    // Monday-first offset
    const days=new Date(year,mi+1,0).getDate();
    const cells=[];
    for(let i=0;i<pad;i++) cells.push(null);
    for(let d=1;d<=days;d++){
      const key=`${year}-${String(mi+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
      // The dot marks a day you deliberately opened — the ritual, not the hours.
      cells.push({ d, key, mins:dayMins[key]||0, opened:!!rituals[key]?.openedAt });
    }
    return cells;
  };
  const monthHours = (mi) => {
    const pfx=`${year}-${String(mi+1).padStart(2,"0")}`;
    const mins=Object.entries(dayMins).filter(([k])=>k.startsWith(pfx)).reduce((a,[,m])=>a+m,0);
    return mins>=60?`${(mins/60).toFixed(0)}h`:mins>0?`${mins}m`:"";
  };
  const curMonth = new Date().getMonth();

  return (
    <div className="page">
      <div style={{marginBottom:20}}>
        <div className="eyebrow">{year}</div>
        <h1 className="h-serif" style={{fontSize:44,margin:"8px 0 0"}}>War Map</h1>
        <p style={{color:"var(--hf-fg-muted)",fontSize:13,marginTop:8,lineHeight:1.7,maxWidth:620}}>
          The whole year in one glance. Nothing here is painted by hand — every day carries the
          color of the focus it actually held. The map doesn't lie, so the only way to color it
          is to show up.
        </p>
      </div>

      <div className="wm-key">
        <span className="wm-key__item"><span className="wm-key__swatch" style={{background:"var(--hf-bone-100)",border:"1px solid var(--hf-border)"}}/>no focus</span>
        <span className="wm-key__item"><span className="wm-key__swatch wm-cell--l1"/>&lt;20m</span>
        <span className="wm-key__item"><span className="wm-key__swatch wm-cell--l2"/>&lt;45m</span>
        <span className="wm-key__item"><span className="wm-key__swatch wm-cell--l3"/>&lt;90m</span>
        <span className="wm-key__item"><span className="wm-key__swatch wm-cell--l4"/>90m+</span>
        <span className="wm-key__item"><span style={{width:5,height:5,borderRadius:"50%",background:"var(--hf-success)",display:"inline-block"}}/>day opened</span>
      </div>

      <div className="wm-grid">
        {MONTHS.map((name,mi)=>{
          const key=`${year}-${String(mi+1).padStart(2,"0")}`;
          return (
            <div key={mi} className={"wm-month"+(mi===curMonth?" wm-month--current":"")}>
              <div className="wm-month__name">{name}<span className="wm-month__hours">{monthHours(mi)}</span></div>
              <div className="wm-days">
                {monthCells(mi).map((c,i)=>c===null
                  ? <div key={i} className="wm-cell wm-cell--empty"/>
                  : <div key={i}
                      className={"wm-cell"
                        +(level(c.mins)>0?` wm-cell--l${level(c.mins)}`:"")
                        +(c.key===today?" wm-cell--today":"")
                        +(c.opened?" wm-cell--closed":"")
                        +(c.key>today?" wm-cell--future":"")}
                      title={`${c.key}${c.mins?` · ${fmtMins(c.mins)}`:""}${c.opened?" · opened":""}`}>
                      {c.d}
                    </div>
                )}
              </div>
              <AutoTextarea className="wm-obj" placeholder="Main objective…"
                value={objectives[key]||""} onChange={v=>setObjective(key,v)}/>
            </div>
          );
        })}
      </div>

      {/* ── Rules ── */}
      <div className="eyebrow" style={{margin:"32px 0 10px"}}>Rules of engagement</div>
      <div className="card-s">
        {[0,1,2,3,4].map(i=>(
          <div className="wm-rule" key={i}>
            <span className="wm-rule__n">{i+1} —</span>
            <AutoTextarea className="reflect__field" placeholder={i===0?"e.g. No phone during the deep block":"…"}
              value={rules[i]||""} onChange={v=>setRule(i,v)}/>
          </div>
        ))}
      </div>
      <p style={{fontSize:12,color:"var(--hf-fg-subtle)",lineHeight:1.65,margin:"8px 0 0",maxWidth:560}}>
        Five standing rules for the year. Rules you don't have to re-decide every day are the
        cheapest discipline there is.
      </p>
    </div>
  );
};

/* ── The Week ─────────────────────────────────────────────────────────────
   The vault's weekly protocol, composed from pieces the app already tracks:
   a review of accumulated evidence, a measurement backwards (never toward the
   ideal), a leak audit, and a check that the week had real emptiness in it.
   Closes with an export that seeds Claudian's weekly synthesis. */
const isoWeekOf = (dstr) => {
  const dt=new Date(dstr+"T12:00:00");
  dt.setDate(dt.getDate()+3-((dt.getDay()+6)%7));
  const w1=new Date(dt.getFullYear(),0,4);
  const wk=1+Math.round(((dt-w1)/86400000-3+((w1.getDay()+6)%7))/7);
  return `${dt.getFullYear()}-W${String(wk).padStart(2,"0")}`;
};

/* ── Where the week went ──────────────────────────────────────────────────
   The old leak audit asked you to name what was draining you. You already
   answer that every time you log a distraction, so this reads it off the
   tracker instead: the labels themselves, ranked by the hours they took.
   Nothing here is typed — a leak you can measure stops being a feeling. */
const leakStats = (entries, from, to) => {
  const inWeek = entries.filter(e=>{
    if(!e.date) return false;
    const d=localDate(new Date(e.date));
    return d>=from && (!to || d<to);
  });
  const mins = inWeek.reduce((a,e)=>a+(e.duration||0),0);

  // By label, case-insensitively, keeping the spelling you used most recently.
  const byLabel = new Map();
  inWeek.forEach(e=>{
    const raw=(e.text||"").trim(); if(!raw) return;
    const k=raw.toLowerCase();
    const cur=byLabel.get(k)||{label:raw,mins:0,n:0};
    cur.label=raw; cur.mins+=e.duration||0; cur.n+=1;
    byLabel.set(k,cur);
  });
  const labels=[...byLabel.values()].sort((a,b)=>b.mins-a.mins);

  const bySource = {quick:0, checkin:0, manual:0, other:0};
  inWeek.forEach(e=>{ bySource[e.source in bySource ? e.source : "other"]+=1; });

  // Short entries are the texture of a scattered week, not its total.
  const fragments = inWeek.filter(e=>(e.duration||0)<=15).length;

  const byDay = {};
  inWeek.forEach(e=>{ const d=localDate(new Date(e.date)); byDay[d]=(byDay[d]||0)+(e.duration||0); });
  const worstDay = Object.entries(byDay).sort((a,b)=>b[1]-a[1])[0] || null;

  return { n:inWeek.length, mins, labels, bySource, fragments, worstDay };
};

const TheWeek = ({ weekly, setWeekly, purpose, sessions, rituals, breaks, trackerEntries=[] }) => {
  const ws = getWeekStart();                          // Monday of this week
  const prevWs = (()=>{ const d=new Date(ws+"T12:00:00"); d.setDate(d.getDate()-7); return localDate(d); })();
  const saved = weekly[ws] || {};
  const [note,  setNote]  = useState(saved.note||"");
  const leaksNow  = leakStats(trackerEntries, ws, null);
  const leaksPrev = leakStats(trackerEntries, prevWs, ws);

  const inRange = (from,to) => sessions.filter(s=>{ if(!s.date) return false; const d=localDate(new Date(s.date)); return d>=from&&(!to||d<to); });
  const statsOf = (list) => {
    const rated=list.filter(s=>s.quality>0);
    return {
      hours:list.reduce((a,s)=>a+(s.dur||0),0)/3600,
      n:list.length,
      days:new Set(list.map(s=>localDate(new Date(s.date)))).size,
      q:rated.length?avg(rated.map(s=>s.quality)):null,
    };
  };
  const cur  = statsOf(inRange(ws,null));
  const prev = statsOf(inRange(prevWs,ws));
  const weekSessions = inRange(ws,null);
  const byKind = kindSecs(weekSessions);
  const deepBlocks = weekSessions.filter(s=>(s.dur||0)>=50*60).length;
  const weekBreaks = breaks.filter(b=>b.date&&localDate(new Date(b.date))>=ws&&b.type);
  const nReal = weekBreaks.filter(b=>b.type==="real").length;
  const nDeg  = weekBreaks.filter(b=>b.type==="degenerate").length;
  const emptySessions = weekSessions.filter(s=>s.kind==="empty").length;
  /* The days of this week that actually held focus, with their hours. Read from
     the sessions themselves — the evidence, not a self-report. */
  const daysPresent = (()=>{
    const by={};
    weekSessions.forEach(s=>{ if(s.date){ const d=localDate(new Date(s.date)); by[d]=(by[d]||0)+(s.dur||0); } });
    return Object.entries(by).sort((a,b)=>a[0].localeCompare(b[0]));
  })();

  const fmtD = (v,unit="") => v==null?"—":(typeof v==="number"&&!Number.isInteger(v)?v.toFixed(1):v)+unit;
  const rows = [
    { label:"Hours focused", then:fmtD(prev.hours,"h"), now:fmtD(cur.hours,"h"), up:cur.hours>prev.hours },
    { label:"Sessions",      then:fmtD(prev.n),         now:fmtD(cur.n),         up:cur.n>prev.n },
    { label:"Days shown up", then:fmtD(prev.days),      now:fmtD(cur.days),      up:cur.days>prev.days },
    { label:"Avg quality",   then:prev.q?prev.q.toFixed(1)+"★":"—", now:cur.q?cur.q.toFixed(1)+"★":"—", up:(cur.q||0)>(prev.q||0) },
  ];

  const closeWeek = () => {
    setWeekly(w=>({...w,[ws]:{note,closedAt:new Date().toISOString()}}));
  };

  const exportSeed = () => {
    const wk = isoWeekOf(ws);
    const dayLines = daysPresent.map(([d,secs])=>
      `- ${new Date(d+"T12:00:00").toLocaleDateString("en-US",{weekday:"short",day:"numeric"})}: ${fmtDur(secs)}`
    ).join("\n");
    const leakLines = leaksNow.labels.slice(0,8).map(l=>
      `- **${l.label}:** ${fmtMins(l.mins)} (${l.n}×)`
    ).join("\n");
    const md = `---
type: weekly-seed
week: ${wk}
generated: ${todayStr()}
tags: [hyperfocus, weekly-synthesis]
---

# Week ${wk} — Hyper Focus data

*Automatic seed for the weekly synthesis. It complements your own notes — it does not replace them.*

## Measured backwards (vs. last week)
- **Hours focused:** ${fmtD(prev.hours,"h")} → ${fmtD(cur.hours,"h")}
- **Sessions:** ${prev.n} → ${cur.n}
- **Days shown up:** ${prev.days} → ${cur.days}
- **Average quality:** ${prev.q?prev.q.toFixed(1)+"★":"—"} → ${cur.q?cur.q.toFixed(1)+"★":"—"}

## Accumulated evidence
- **Declared identity:** ${purpose.identity?`"${purpose.identity}"`:"—"}
- **Votes this week:** ${cur.n} ${cur.n===1?"session":"sessions"} (${fmtD(cur.hours,"h")})
- **Deep blocks (≥50 min):** ${deepBlocks}

## The shape of the week
- **Use:** ${byKind.use?fmtDur(byKind.use):"—"} · **Fill:** ${byKind.fill?fmtDur(byKind.fill):"—"} · **Empty:** ${byKind.empty?fmtDur(byKind.empty):"—"}
- **Breaks classified:** ${nReal} without input · ${nDeg} with screens
- **Deliberate emptiness sessions:** ${emptySessions}

## Days present
${dayLines||"- (none)"}

## Where the week went
- **Logged outside focus:** ${leaksNow.n?fmtMins(leaksNow.mins):"—"} across ${leaksNow.n} ${leaksNow.n===1?"entry":"entries"} (${leaksNow.fragments} under 15 min)
- **Captured as:** ${leaksNow.bySource.quick} quick logs · ${leaksNow.bySource.checkin} check-ins · ${leaksNow.bySource.manual} by hand
${leakLines||"- (nothing logged)"}

## Note for the week
${note||"—"}
`;
    const blob=new Blob([md],{type:"text/markdown"});
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");
    a.href=url; a.download=`${wk}-hyperfocus.md`; a.click();
    URL.revokeObjectURL(url);
  };

  return (
    <div className="page">
      <div style={{marginBottom:28}}>
        <div className="eyebrow">Week of {new Date(ws+"T12:00:00").toLocaleDateString("en-US",{month:"long",day:"numeric"})} · {isoWeekOf(ws)}</div>
        <h1 className="h-serif" style={{fontSize:44,margin:"8px 0 0"}}>The Week</h1>
        <p style={{color:"var(--hf-fg-muted)",fontSize:13,marginTop:8,lineHeight:1.7,maxWidth:620}}>
          Once a week, four moves: look at the evidence, measure backwards, see where the time went,
          and check that the week had real emptiness in it. Then send the seed to the second brain.
        </p>
      </div>

      {/* ── Measured backwards ── */}
      <div className="eyebrow" style={{marginBottom:10}}>Measured backwards</div>
      <div className="card-s" style={{marginBottom:28}}>
        <div className="gain-grid">
          {rows.map(g=>(
            <div className="gain" key={g.label}>
              <div className="gain__label">{g.label}</div>
              <div className="gain__row">
                <span className="gain__then">{g.then}</span>
                <span className="gain__arrow">→</span>
                <span className="gain__now">{g.now}</span>
              </div>
            </div>
          ))}
        </div>
        <p style={{fontSize:12.5,color:"var(--hf-fg-subtle)",margin:"16px 0 0",paddingTop:14,borderTop:"1px solid var(--hf-border)",fontStyle:"italic",lineHeight:1.6}}>
          Against last week — never against the ideal.
        </p>
      </div>

      {/* ── Accumulated evidence ── */}
      <div className="eyebrow" style={{marginBottom:10}}>Accumulated evidence</div>
      <div className="card-s" style={{marginBottom:28}}>
        {purpose.identity
          ? <p style={{fontSize:14,fontStyle:"italic",color:"var(--hf-fg-body)",margin:"0 0 12px",lineHeight:1.7}}>"{purpose.identity}"</p>
          : <p style={{fontSize:13,color:"var(--hf-fg-muted)",margin:"0 0 12px"}}>No identity statement yet — write one on Purpose.</p>}
        <div className="votes" style={{borderTop:0,paddingTop:0,marginTop:0}}>
          <span className="votes__n">{cur.n}</span>
          <span className="votes__label">{cur.n===1?"vote":"votes"} this week that the person you're becoming would cast — {fmtD(cur.hours,"h")} of focus, {deepBlocks} deep {deepBlocks===1?"block":"blocks"}.</span>
        </div>
        {daysPresent.length>0&&(
          <div style={{display:"flex",gap:8,flexWrap:"wrap",marginTop:14,paddingTop:14,borderTop:"1px solid var(--hf-border)"}}>
            {daysPresent.map(([d,secs])=>(
              <span key={d} className="badge badge--neutral" title={`${d} · ${fmtDur(secs)}`}>
                {new Date(d+"T12:00:00").toLocaleDateString("en-US",{weekday:"short"})}
                <span style={{fontFamily:"var(--hf-font-mono)",fontSize:10,opacity:.75}}>{fmtDur(secs)}</span>
              </span>
            ))}
          </div>
        )}
      </div>

      {/* ── Deliberate emptiness ── */}
      <div className="eyebrow" style={{marginBottom:10}}>Deliberate emptiness</div>
      <div className="card-s" style={{marginBottom:28}}>
        <p style={{fontSize:13.5,color:"var(--hf-fg-body)",margin:0,lineHeight:1.7}}>
          {emptySessions>0||byKind.empty>0
            ? <>The week held <b>{fmtDur(byKind.empty)}</b> of Empty and {nReal>0?<><b>{nReal}</b> {nReal===1?"break":"breaks"} without input</>:"no classified real rest"}. The mind processed.</>
            : <>No Empty sessions and {nReal>0?`${nReal} real ${nReal===1?"break":"breaks"}`:"no real rest"} this week. One block of deliberate boredom — a walk without headphones, sitting with nothing — is part of the protocol, not a luxury.</>}
        </p>
      </div>

      {/* ── Where the week went — measured, not confessed ── */}
      <div className="eyebrow" style={{marginBottom:10}}>Where the week went</div>
      <div className="card-s" style={{marginBottom:28}}>
        {leaksNow.n===0 ? (
          <p style={{fontSize:13.5,color:"var(--hf-fg-muted)",margin:0,lineHeight:1.7}}>
            Nothing logged outside your sessions this week. Either the week was unusually clean, or
            the tracker never caught it — the <b>+</b> button logs five minutes in two taps, and
            what it collects shows up here.
          </p>
        ) : (
          <>
            <div className="leak-figures">
              <div>
                <div className="day-figure__label">Logged outside focus</div>
                <div className="day-figure__value">{fmtMins(leaksNow.mins)}</div>
                {leaksPrev.n>0&&(
                  <div className={"gain__delta "+(leaksNow.mins<=leaksPrev.mins?"gain__delta--up":"gain__delta--flat")}>
                    {leaksNow.mins===leaksPrev.mins ? "same as last week"
                      : `${leaksNow.mins<leaksPrev.mins?"↓":"↑"} ${fmtMins(Math.abs(leaksNow.mins-leaksPrev.mins))} vs last week`}
                  </div>
                )}
              </div>
              <div>
                <div className="day-figure__label">Entries</div>
                <div className="day-figure__value">{leaksNow.n}</div>
                <div className="gain__delta gain__delta--flat">{leaksNow.fragments} under 15 min</div>
              </div>
              <div>
                <div className="day-figure__label">Heaviest day</div>
                <div className="day-figure__value" style={{fontSize:24}}>
                  {leaksNow.worstDay
                    ? new Date(leaksNow.worstDay[0]+"T12:00:00").toLocaleDateString("en-US",{weekday:"short"})
                    : "—"}
                </div>
                {leaksNow.worstDay&&<div className="gain__delta gain__delta--flat">{fmtMins(leaksNow.worstDay[1])}</div>}
              </div>
            </div>

            {/* The ranking IS the audit. Your own words, ordered by what they cost. */}
            <div style={{marginTop:24,paddingTop:20,borderTop:"1px solid var(--hf-border)"}}>
              <div className="eyebrow" style={{marginBottom:12}}>What took the time</div>
              {leaksNow.labels.slice(0,6).map(l=>{
                const pct=Math.round(l.mins/Math.max(1,leaksNow.mins)*100);
                return (
                  <div className="leak-row" key={l.label}>
                    <div className="leak-row__head">
                      <span className="leak-row__label" title={l.label}>{l.label}</span>
                      <span className="leak-row__mins">{fmtMins(l.mins)} <span style={{opacity:.6}}>· {l.n}×</span></span>
                    </div>
                    <div className="leak-row__bar"><div className="leak-row__fill" style={{width:pct+"%"}}/></div>
                  </div>
                );
              })}
              {leaksNow.labels.length>6&&(
                <p style={{fontSize:11.5,color:"var(--hf-fg-subtle)",margin:"10px 0 0"}}>
                  and {leaksNow.labels.length-6} more {leaksNow.labels.length-6===1?"label":"labels"}.
                </p>
              )}
              <p style={{fontSize:12,color:"var(--hf-fg-subtle)",lineHeight:1.65,margin:"14px 0 0",maxWidth:560}}>
                {leaksNow.labels[0] && leaksNow.labels[0].mins >= leaksNow.mins*0.4
                  ? <>Almost half of it went to one thing: <b>{leaksNow.labels[0].label}</b>. That is the leak worth an if-then protocol on Purpose.</>
                  : leaksNow.fragments >= leaksNow.n*0.6
                    ? <>Most of these are under fifteen minutes. The cost of a scattered week is rarely one big hole — it is a hundred small ones.</>
                    : <>Named and measured. A leak you can see stops being ambient.</>}
              </p>
            </div>

            {/* How the week was captured — the honesty check on the numbers above. */}
            <div style={{marginTop:24,paddingTop:20,borderTop:"1px solid var(--hf-border)"}}>
              <div className="eyebrow" style={{marginBottom:10}}>How it was captured</div>
              <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
                <span className="badge badge--neutral">{leaksNow.bySource.quick} quick {leaksNow.bySource.quick===1?"log":"logs"}</span>
                <span className="badge badge--neutral">{leaksNow.bySource.checkin} check-{leaksNow.bySource.checkin===1?"in":"ins"}</span>
                <span className="badge badge--neutral">{leaksNow.bySource.manual} by hand</span>
                {leaksNow.bySource.other>0&&<span className="badge badge--neutral">{leaksNow.bySource.other} untagged</span>}
              </div>
            </div>
          </>
        )}
      </div>

      {/* ── One line for the week ── */}
      <div className="eyebrow" style={{marginBottom:10}}>One line for the week</div>
      <div className="card-s" style={{marginBottom:28}}>
        <div className="reflect" style={{paddingTop:0,borderBottom:0}}>
          <div className="reflect__q">What did this week teach that last week's you didn't know?<span>One line. The synthesis happens in your second brain, not here.</span></div>
          <AutoTextarea className="reflect__field" placeholder="This week I learned…" value={note} onChange={setNote}/>
        </div>
      </div>

      <div style={{display:"flex",gap:10,flexWrap:"wrap",alignItems:"center"}}>
        <button className="btn btn--primary btn--lg" onClick={closeWeek}><Icon name="check" size={14}/> {saved.closedAt?"Update the week":"Close the week"}</button>
        <button className="btn btn--secondary btn--lg" onClick={()=>{ closeWeek(); exportSeed(); }}><Icon name="download" size={14}/> Send seed to second brain</button>
        {saved.closedAt&&<span style={{fontSize:12,color:"var(--hf-fg-subtle)"}}>Closed {formatHHMM(new Date(saved.closedAt))} · {localDate(new Date(saved.closedAt))}</span>}
      </div>
      <p style={{fontSize:11.5,color:"var(--hf-fg-subtle)",lineHeight:1.6,margin:"12px 0 0"}}>
        Downloads <code>{isoWeekOf(ws)}-hyperfocus.md</code> — drop it into <code>raw/pending/</code> so Claudian
        can use it when building the weekly synthesis.
      </p>
    </div>
  );
};

/* ── Purpose ── */
// Textarea that grows with its content — keeps the North Star readable as one block
// instead of a scrolling one-liner.
const AutoTextarea = ({ value, onChange, className, placeholder }) => {
  const ref = useRef(null);
  useEffect(()=>{
    const el=ref.current; if(!el) return;
    el.style.height="auto"; el.style.height=el.scrollHeight+"px";
  },[value]);
  return <textarea ref={ref} rows={1} className={className} placeholder={placeholder} value={value} onChange={e=>onChange(e.target.value)}/>;
};

const Purpose = ({ purpose, setPurpose, sessions }) => {
  const [newTitle, setNewTitle] = useState("");
  const [newHours, setNewHours] = useState("");
  const [protoTrigger, setProtoTrigger] = useState("session-end");
  const [protoIf, setProtoIf] = useState("");
  const [protoThen, setProtoThen] = useState("");
  const goals  = purpose.goals || [];
  const active = goals.filter(g=>!g.archived);
  const done   = goals.filter(g=>g.archived);
  const hoursFor = id => sessions.reduce((a,s)=>a+(s.goalId===id?(s.dur||0):0),0)/3600;

  const patch = p => setPurpose(prev=>({...prev,...p}));
  // Stamp the moment the identity was first declared — the votes counted below
  // are the ones cast since then, not a retroactive tally.
  const setIdentity = (v) => setPurpose(prev=>({
    ...prev, identity:v,
    identitySince: prev.identitySince || (v.trim() ? new Date().toISOString() : null),
  }));
  const since = purpose.identitySince ? new Date(purpose.identitySince) : null;
  const votes = since ? sessions.filter(s=>s.date&&new Date(s.date)>=since) : [];
  // Take the max date rather than the last element — history order is not guaranteed
  const lastVote = votes.length ? new Date(Math.max(...votes.map(s=>new Date(s.date)))) : null;
  const daysAgo = (d) => {
    const n=Math.floor((new Date(localDate()+"T12:00:00")-new Date(localDate(d)+"T12:00:00"))/86400000);
    return n===0?"today":n===1?"yesterday":`${n} days ago`;
  };

  const protocols = purpose.protocols || [];
  const addProto = () => {
    const t=protoIf.trim(), a=protoThen.trim();
    if(!t||!a) return;
    setPurpose(p=>({...p,protocols:[...(p.protocols||[]),{id:"p"+newId(),trigger:protoTrigger,when:t,then:a}]}));
    setProtoIf(""); setProtoThen("");
  };
  const removeProto = (id) => setPurpose(p=>({...p,protocols:(p.protocols||[]).filter(x=>x.id!==id)}));

  const avReviewed = purpose.antiVisionReviewedAt ? new Date(purpose.antiVisionReviewedAt) : null;
  const avStale = purpose.antiVision && (!avReviewed || (Date.now()-avReviewed)/86400000 >= 30);
  const addGoal = () => {
    const title=newTitle.trim(); if(!title) return;
    const target=Math.min(5000,Math.max(1,parseInt(newHours)||40));
    const g={id:"g"+newId(),title,target,archived:false,createdAt:new Date().toISOString()};
    setPurpose(p=>({...p,goals:[...(p.goals||[]),g],activeGoalId:p.activeGoalId||g.id}));
    setNewTitle(""); setNewHours("");
  };
  const updateGoal = (id,p) => setPurpose(prev=>({...prev,goals:prev.goals.map(g=>g.id===id?{...g,...p}:g)}));
  const removeGoal = (id) => setPurpose(prev=>({
    ...prev,
    goals: prev.goals.filter(g=>g.id!==id),
    activeGoalId: prev.activeGoalId===id ? null : prev.activeGoalId,
  }));

  const renderGoal = (g) => {
    const h=hoursFor(g.id), pct=Math.min(100,(h/g.target)*100), isActive=purpose.activeGoalId===g.id;
    return (
      <div className="goal" key={g.id}>
        <div className="goal__head">
          <div className={"goal__title"+(g.archived?" goal__title--dim":"")}>{g.title}</div>
          <div className="goal__nums"><b>{h.toFixed(1)}h</b> / {g.target}h</div>
        </div>
        <div className="goal__bar"><i style={{width:`${pct}%`}}/></div>
        <div className="goal__actions">
          {!g.archived && (isActive
            ? <span className="badge badge--accent"><span className="dot"/>Current focus</span>
            : <button className="btn btn--ghost" style={{padding:"4px 10px",fontSize:12}} onClick={()=>patch({activeGoalId:g.id})}>Make current</button>)}
          <button className="btn btn--ghost" style={{padding:"4px 10px",fontSize:12}}
            onClick={()=>updateGoal(g.id,{archived:!g.archived})}>
            {g.archived?"Reopen":"Archive"}
          </button>
          <button className="btn btn--danger" style={{padding:"4px 10px",fontSize:12}} onClick={()=>removeGoal(g.id)}>Delete</button>
        </div>
      </div>
    );
  };

  return (
    <div className="page">
      <div className="eyebrow">Compass</div>
      <h1 className="h-serif" style={{fontSize:44,margin:"8px 0 10px"}}>Purpose</h1>
      <p style={{fontSize:14,color:"var(--hf-fg-muted)",lineHeight:1.7,margin:"0 0 32px",maxWidth:620}}>
        Everything else in this app measures what you did. This page holds why. It is the only
        thing here you should reread more often than you edit.
      </p>

      <div className="eyebrow" style={{marginBottom:10}}>North Star</div>
      <div className="purpose-star">
        <AutoTextarea className="purpose-star__field" value={purpose.northStar||""}
          onChange={v=>patch({northStar:v})}
          placeholder="In one sentence — what are you actually building your life toward?"/>
      </div>
      <p style={{fontSize:12,color:"var(--hf-fg-subtle)",lineHeight:1.65,margin:"0 0 40px",maxWidth:560}}>
        This line follows you: it sits in the sidebar and above every session you start.
      </p>

      {/* ── Anti-vision ── */}
      <div className="eyebrow" style={{marginBottom:10}}>Anti-vision</div>
      <div className="card-s" style={{marginBottom:8,borderLeft:"3px solid var(--hf-bone-400)"}}>
        <AutoTextarea className="purpose-identity__field" value={purpose.antiVision||""}
          onChange={v=>patch({antiVision:v})}
          placeholder="What does your life have that you don't want? Where do you end up if you stay on this road?"/>
        {purpose.antiVision&&(
          <div style={{marginTop:16,paddingTop:14,borderTop:"1px solid var(--hf-border)",display:"flex",gap:10,alignItems:"center",flexWrap:"wrap"}}>
            <button className="btn btn--ghost" style={{padding:"4px 10px",fontSize:12}}
              onClick={()=>patch({antiVisionReviewedAt:new Date().toISOString()})}>
              <Icon name="check" size={13}/> Reviewed today
            </button>
            <span style={{fontSize:12,color:avStale?"var(--hf-sand-700)":"var(--hf-fg-subtle)"}}>
              {avReviewed ? `Last reviewed ${daysAgo(avReviewed)}.` : "Never reviewed."}
              {avStale&&" It's built from experience — it goes stale."}
            </span>
          </div>
        )}
      </div>
      <p style={{fontSize:12,color:"var(--hf-fg-subtle)",lineHeight:1.65,margin:"0 0 40px",maxWidth:560}}>
        Easier to write than a vision, because you have evidence for it. The two together make a
        field of tension where inaction costs more than action. Revisit it monthly.
      </p>

      {/* ── Identity as accumulated evidence ── */}
      <div className="eyebrow" style={{marginBottom:10}}>Identity</div>
      <div className="card-s" style={{marginBottom:8}}>
        <AutoTextarea className="purpose-identity__field" value={purpose.identity||""}
          onChange={setIdentity}
          placeholder="I am the kind of person who…"/>
        {purpose.identity&&since&&(
          <div className="votes">
            <span className="votes__n">{votes.length}</span>
            <span className="votes__label">
              {votes.length===1?"vote":"votes"} cast for this since you wrote it.
              {lastVote ? <> Last one <b>{daysAgo(lastVote)}</b>.</> : <> None yet — the first session is the first vote.</>}
            </span>
          </div>
        )}
      </div>
      <p style={{fontSize:12,color:"var(--hf-fg-subtle)",lineHeight:1.65,margin:"0 0 40px",maxWidth:560}}>
        Identity doesn't install through affirmation, it installs through accumulated evidence.
        Every session you finish is one vote. You don't need to win always — you need the pile to
        grow until believing it is the only rational conclusion left.
      </p>

      {/* ── If-then protocols ── */}
      <div className="eyebrow" style={{marginBottom:10}}>If-then protocols</div>
      <div className="card-s">
        {protocols.length===0 && (
          <p style={{fontSize:13,color:"var(--hf-fg-muted)",margin:"4px 0 16px",lineHeight:1.7}}>
            Nothing pre-committed yet. Decide the response now, while you're calm — the trigger
            moment is not when you'll be able to.
          </p>
        )}
        {protocols.map(p=>(
          <div className="proto" key={p.id}>
            <div className="proto__when">{TRIGGERS.find(t=>t.id===p.trigger)?.label||p.trigger}</div>
            <div style={{display:"flex",gap:12,alignItems:"flex-start"}}>
              <div className="proto__line" style={{flex:1}}>
                If <b>{p.when}</b>, then <b>{p.then}</b>.
              </div>
              <button className="btn btn--danger" style={{padding:"2px 8px",fontSize:11}} onClick={()=>removeProto(p.id)}>Remove</button>
            </div>
          </div>
        ))}
        <div style={{marginTop:protocols.length?18:0,paddingTop:protocols.length?16:0,borderTop:protocols.length?"1px solid var(--hf-border)":"none"}}>
          <div className="kinds" style={{justifyContent:"flex-start",marginBottom:10,flexWrap:"wrap"}}>
            {TRIGGERS.map(t=>(
              <button key={t.id} className={"kind"+(protoTrigger===t.id?" kind--on":"")} onClick={()=>setProtoTrigger(t.id)}>{t.label}</button>
            ))}
          </div>
          <div className="goal-new" style={{marginTop:0}}>
            <input className="input" placeholder="If… (e.g. I feel the pull to open Instagram)"
              value={protoIf} onChange={e=>setProtoIf(e.target.value)} onKeyDown={e=>{if(e.key==="Enter")addProto();}}/>
            <input className="input" placeholder="…then (e.g. I stand up and get a glass of water)"
              value={protoThen} onChange={e=>setProtoThen(e.target.value)} onKeyDown={e=>{if(e.key==="Enter")addProto();}}/>
            <button className="btn btn--primary" onClick={addProto}><Icon name="plus" size={14}/> Add</button>
          </div>
        </div>
      </div>
      <p style={{fontSize:12,color:"var(--hf-fg-subtle)",lineHeight:1.65,margin:"8px 0 40px",maxWidth:560}}>
        Willpower lives in the prefrontal cortex; the impulse fires in the limbic system, which is
        faster. Pre-deciding removes the deliberation from the moment you'd lose it. Hyper Focus
        knows exactly when a session ends — it will show you the right one there.
      </p>

      <div className="eyebrow" style={{marginBottom:10}}>Goals</div>
      <div className="card-s">
        {active.length===0 && <p style={{fontSize:13,color:"var(--hf-fg-muted)",margin:"4px 0 0",lineHeight:1.7}}>
          No goals yet. Add one and every session you run will count toward it.
        </p>}
        {active.map(renderGoal)}
        <div className="goal-new">
          <input className="input" placeholder="Goal — e.g. Ship the first version of the product"
            value={newTitle} onChange={e=>setNewTitle(e.target.value)}
            onKeyDown={e=>{ if(e.key==="Enter") addGoal(); }}/>
          <input className="input input--num" type="number" min="1" max="5000" placeholder="Hours"
            value={newHours} onChange={e=>setNewHours(e.target.value)}
            onKeyDown={e=>{ if(e.key==="Enter") addGoal(); }}/>
          <button className="btn btn--primary" onClick={addGoal}><Icon name="plus" size={14}/> Add</button>
        </div>
      </div>

      {done.length>0 && (<>
        <div className="eyebrow" style={{margin:"36px 0 10px"}}>Archived</div>
        <div className="card-s">{done.map(renderGoal)}</div>
      </>)}
    </div>
  );
};

          <button className="btn btn--secondary" onClick={()=>setTheme(t=>t==="light"?"dark":"light")}><Icon name={theme==="dark"?"sun":"moon"} size={14}/>{theme==="dark"?"Light":"Dark"}</button>

        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"12px 0",borderBottom:"1px solid var(--hf-border)"}}>

          <span className="badge badge--neutral" style={{fontFamily:"var(--hf-font-mono)"}}>Space · Ctrl K</span>
        </div>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"12px 0",borderBottom:"1px solid var(--hf-border)"}}>
          <div><div style={{fontSize:14,fontWeight:500}}>Pre-focus breath</div><div style={{fontSize:12,color:"var(--hf-fg-muted)",marginTop:2}}>1, 2, or 3 min. Available on the session page.</div></div>
          <span className="badge badge--success"><span className="dot"/>Active</span>
        </div>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"12px 0"}}>
          <div>
            <div style={{fontSize:14,fontWeight:500}}>Tracker check-ins</div>
            <div style={{fontSize:12,color:"var(--hf-fg-muted)",marginTop:2,lineHeight:1.6,maxWidth:460}}>
              <b>On</b> — at :00 and :30 the app asks what you have been doing since the last mark,
              and logs your answer as a block. It is the passive net that catches the hours you
              would otherwise never account for.<br/>
              <b>Off</b> — no prompt ever appears. The calendar still works: you drag on the grid,
              use the <b>+</b> button, or hit <b>Log now</b> whenever you decide to.<br/>
              Either way a session is never interrupted — a check-in that comes due while you are
              focusing waits until the session is over.
            </div>
          </div>
          <button className="btn btn--secondary" onClick={()=>setTrackerOn(v=>!v)}>{trackerOn?"On — every 30 min":"Off"}</button>
        </div>
      </div>

      <div className="card-s" style={{marginTop:24}}>
        <div className="eyebrow" style={{marginBottom:14}}>Data</div>
        <p style={{fontSize:13,color:"var(--hf-fg-body)",margin:"0 0 18px",lineHeight:1.65}}>
          Sessions, tracker entries, plans, and your Purpose are saved in this browser's local storage.
          Each device keeps its own copy — export here and import on the other one to carry your history across.
          Importing merges: nothing already saved is overwritten or lost.
        </p>
        <div style={{display:"flex",gap:8,alignItems:"center",flexWrap:"wrap"}}>
          <button className="btn btn--secondary" onClick={onExport}><Icon name="download" size={14}/> Export JSON</button>
          <button className="btn btn--secondary" onClick={()=>fileRef.current?.click()}><Icon name="upload" size={14}/> Import JSON</button>
          <input ref={fileRef} type="file" accept="application/json,.json" style={{display:"none"}}
            onChange={e=>{
              const f=e.target.files?.[0]; e.target.value="";
              if(!f) return;
              setImportMsg(null);
              onImport(f).then(m=>setImportMsg({ok:true,text:m})).catch(err=>setImportMsg({ok:false,text:err.message}));
            }}/>
          {confirmClear
            ? <>
                <button className="btn btn--danger" onClick={()=>{ onClearData(); setConfirmClear(false); }}>Confirm — erase all</button>
                <button className="btn btn--ghost" onClick={()=>setConfirmClear(false)}>Cancel</button>
              </>
            : <button className="btn btn--ghost" onClick={()=>setConfirmClear(true)}>Clear all data</button>
          }
        </div>
        {importMsg && (
          <p style={{fontSize:12,marginTop:14,marginBottom:0,color:importMsg.ok?"var(--hf-success)":"#C0392B"}}>{importMsg.text}</p>
        )}
        {nudge ? (
          <p style={{fontSize:12.5,marginTop:16,marginBottom:0,lineHeight:1.6,color:"var(--hf-sand-700)"}}>
            {daysSinceExport===null
              ? "You have never exported. One click now means a bad day later costs you nothing."
              : `Your last backup was ${daysSinceExport} days ago.`}
          </p>
        ) : daysSinceExport!==null && (
          <p style={{fontSize:12,marginTop:16,marginBottom:0,color:"var(--hf-fg-subtle)"}}>
            Last backup: {daysSinceExport===0?"today":`${daysSinceExport} day${daysSinceExport===1?"":"s"} ago`}.
          </p>
        )}
        <p style={{fontSize:12,color:"var(--hf-fg-subtle)",marginTop:14,marginBottom:0,lineHeight:1.6}}>
          Clearing erases sessions, tracker entries, plans, practices, closed days, breaks, and weekly reviews. Your Purpose page and War Map objectives/rules are kept.
        </p>
      </div>
      <p style={{fontSize:12,color:"var(--hf-fg-subtle)",marginTop:24,fontStyle:"italic"}}>
        Data lives only in this browser. No account, no sync, no servers.
      </p>
    </div>
  );
};

/* Persist on change only. Writing on mount would re-save the state we just
   loaded — and, worse, would overwrite the IndexedDB mirror with an empty array
   before the recovery check ever gets to read it. */
const usePersist = (key, value) => {
  const mounted = useRef(false);
  useEffect(()=>{
    if(!mounted.current){ mounted.current=true; return; }
    saveLS(key, value);
  },[value]);
};

  const [purpose,     setPurpose]     = useState(()=>({northStar:"",identity:"",goals:[],activeGoalId:null,...loadLS("hf_purpose",{})}));
