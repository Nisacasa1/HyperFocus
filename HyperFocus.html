            </div>
          </div>
          <div style={{display:"flex",gap:8}}>
            <button className="btn btn--primary" onClick={addSkill} disabled={!newSkill.name.trim()}>Add</button>
            <button className="btn btn--ghost" onClick={()=>setShowForm(false)}>Cancel</button>
          </div>
        </div>
      )}

      <div className="skills-grid">
        {filtered.map(sk=>(
          <div key={sk.id} className="skill-card">
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
              <div><div className="skill-card__cat">{sk.category}</div><div className="skill-card__name">{sk.name}</div></div>
              <button className="iconbtn btn--danger" style={{opacity:0.4}} onClick={()=>deleteSkill(sk.id)}><Icon name="x" size={12}/></button>
            </div>
            <div className="skill-level-dots">{[1,2,3,4,5].map(l=><div key={l} className={"skill-level-dot"+(l<=sk.level?" skill-level-dot--on":"")} title={LEVEL_NAMES[l-1]}/>)}</div>
            <div className="skill-card__footer">
              <span className="skill-card__last">{LEVEL_NAMES[sk.level-1]}</span>
              <button className="btn btn--ghost" style={{fontSize:11,padding:"3px 8px"}} onClick={()=>{setUpdateId(updateId===sk.id?null:sk.id);setUpdateLevel(sk.level);setUpdateNote("");}}>
                {updateId===sk.id?"Cancel":"Update"}
              </button>
            </div>
            {updateId===sk.id&&(
              <div className="skill-update-form">
                <div>
                  <div style={{fontSize:11,letterSpacing:".1em",textTransform:"uppercase",color:"var(--hf-fg-muted)",fontWeight:500,marginBottom:8}}>New level</div>
                  <div style={{display:"flex",gap:6,marginBottom:4}}>
                    {[1,2,3,4,5].map(l=>(
                      <button key={l} onClick={()=>setUpdateLevel(l)} title={LEVEL_NAMES[l-1]} style={{width:28,height:28,borderRadius:4,border:"1px solid",fontSize:12,borderColor:updateLevel===l?"var(--hf-sand-400)":"var(--hf-border)",background:updateLevel===l?"var(--hf-sand-50)":"transparent",color:updateLevel===l?"var(--hf-sand-700)":"var(--hf-fg-muted)",cursor:"pointer"}}>{l}</button>
                    ))}
                  </div>
                  <div style={{fontSize:11,color:"var(--hf-fg-muted)"}}>{LEVEL_NAMES[updateLevel-1]}</div>
                </div>
                <input className="input" placeholder="Note (optional)" style={{fontSize:13}} value={updateNote} onChange={e=>setUpdateNote(e.target.value)}/>
                <button className="btn btn--primary" style={{fontSize:12}} onClick={()=>saveUpdate(sk.id)}>Save</button>
              </div>
            )}
          </div>
        ))}
      </div>
      {filtered.length===0&&<div style={{padding:"32px 0",color:"var(--hf-fg-muted)",fontSize:14,fontStyle:"italic"}}>No skills yet. Add one above.</div>}
    </div>
  );
};


/* ── The Day ── */
const REFLECT_QS = [
  { id:"advanced", q:"What actually moved forward?",  hint:"Name the thing itself, not the hours you spent near it.", ph:"Today I moved…" },
  { id:"derailed", q:"What pulled you away?",         hint:"Without excuse and without self-punishment. You are calibrating, not confessing.", ph:"I lost the thread when…" },
  { id:"tomorrow", q:"One line for tomorrow.",        hint:"The first thing you will touch, decided now so morning-you doesn't have to.", ph:"Tomorrow I start with…" },
];

/* Optional questions that map 1:1 to sections of the vault's daily template.
   All optional — a 3-line entry counts the same as a 30-line one. */
const JOURNAL_QS = [
  { id:"freeform", q:"Captura libre",                          hint:"Whatever it is, unfiltered. Start with \"hoy fue…\" if nothing comes.", ph:"Hoy fue…" },
  { id:"repeated", q:"A thought that kept coming back",        hint:"The idea that returned all day, even if you don't know why.", ph:"No dejé de pensar en…" },
  { id:"surprised",q:"Something that surprised or unsettled you", hint:"Discomfort is information — don't filter it.", ph:"No esperaba…" },
  { id:"phrase",   q:"Phrase of the day",                      hint:"Yours or borrowed. If there is none, invent one — the day in one line.", ph:"…" },
];

/* Export the day's close as a markdown file matching journal/_template-diario.md
   in the vault, so the capture layer gets fed without opening Obsidian.
   Template sections carry ONLY the answers written for them — the app's own
   reflection questions (moved forward / pulled away / tomorrow) have different
   semantics and live in the Hyper Focus section below, never in the vault's. */
const journalMarkdown = ({ date, reflection, sessions, focusedSecs, mitsDone, mitsTotal, byKind, energy, deepDone, restVerdict }) => {
  const r = reflection || {};
  const bullets = sessions.map(s=>`- ${s.startTime||""} · ${s.task} (${fmtDur(s.dur||0)}${s.quality?` · ${"★".repeat(s.quality)}`:""})`).join("\n");
  return `---
type: journal-entry
date: ${date}
energia: ${energy}
tags: [hyperfocus]
---

# ${date}

## 🌀 Captura libre
${r.freeform || ""}

## 🔁 Un pensamiento que se repitió hoy
${r.repeated || ""}

## 💡 Algo que aprendí, confirmé o cuestioné


## ⚡ Una decisión o acción que tomé


## 😶 Algo que me sorprendió, incomodó o no esperaba
${r.surprised || ""}

## 🗣️ Frase del día

>${r.phrase ? " "+r.phrase : ""}

## 🔗 ¿Esto se parece a algo que ya tengo guardado?


---

## 📊 El día según Hyper Focus
*Generado automáticamente — no editar a mano.*

- **Foco total:** ${focusedSecs?fmtDur(focusedSecs):"—"} en ${sessions.length} ${sessions.length===1?"sesión":"sesiones"}
- **Prioridades:** ${mitsTotal?`${mitsDone}/${mitsTotal}`:"—"}
- **Forma del día:** Use ${byKind.use?fmtDur(byKind.use):"—"} · Fill ${byKind.fill?fmtDur(byKind.fill):"—"} · Empty ${byKind.empty?fmtDur(byKind.empty):"—"}
- **Valoración del día:** ${r.rating?`${"★".repeat(r.rating)} (${r.rating}/5)`:"—"}
- **¿Hice el bloque profundo?** ${deepDone?"Sí":"No"}
- **¿Descansé de verdad?** ${restVerdict}

### Reflexión del cierre
- **¿Qué avanzó?** ${r.advanced || "—"}
- **¿Qué me sacó?** ${r.derailed || "—"}
- **Mañana empiezo con:** ${r.tomorrow || "—"}

${sessions.length?`### Sesiones\n${bullets}`:""}
`;
};

const TheDay = ({ rituals, setRituals, purpose, mits, setMits, sessions, practiceLog, breaks=[], streak, onEnterDay }) => {
  const today    = todayStr();
  const entry    = rituals[today] || {};
  const opened   = !!entry.openedAt;
  const closed   = !!entry.closedAt;
  const [draft, setDraft]   = useState(()=>({advanced:"",derailed:"",tomorrow:"",freeform:"",repeated:"",surprised:"",phrase:"",rating:null, ...(rituals[todayStr()]?.reflection||{})}));
  const [editing, setEditing] = useState(false);
  const [journalOpen, setJournalOpen] = useState(false);
  const hour     = new Date().getHours();
  const greeting = hour<5 ? "Still awake." : hour<12 ? "Good morning." : hour<19 ? "Good afternoon." : "Good evening.";

  const plan     = mits[today] || {tasks:["","",""],done:[false,false,false]};
  const setTask  = (i,val) => setMits(m=>({...m,[today]:{...plan,tasks:plan.tasks.map((t,j)=>j===i?val:t)}}));
  const toggle   = (i) => { if(!plan.tasks[i]) return; setMits(m=>({...m,[today]:{...plan,done:plan.done.map((d,j)=>j===i?!d:d)}})); };

  const focusedSecs = sessions.reduce((a,s)=>a+(s.dur||0),0);
  const mitsDone    = plan.tasks.filter((t,i)=>t&&plan.done[i]).length;
  const mitsTotal   = plan.tasks.filter(t=>t).length;
  const practices   = practiceLog.filter(p=>p.date&&localDate(new Date(p.date))===today).length;
  const byKind      = kindSecs(sessions);

  /* The closing metric from the vault's operating protocol: did I do the deep
     block, and did I actually rest — or just stop working? Both are computed
     from data the app already has; neither is asked. */
  const deepDone    = sessions.some(s=>(s.dur||0)>=50*60);
  const todayBreaks = breaks.filter(b=>b.date&&localDate(new Date(b.date))===today&&b.type);
  const nReal       = todayBreaks.filter(b=>b.type==="real").length;
  const nDeg        = todayBreaks.filter(b=>b.type==="degenerate").length;
  const restVerdict = todayBreaks.length===0 ? "Sin datos — no clasificaste ningún descanso"
    : nDeg===0 ? "Sí — todo el descanso fue sin input"
    : nReal===0 ? "No — todos los descansos fueron con pantallas"
    : `Parcial — ${nReal} sin input, ${nDeg} con pantallas`;

  const openDay  = () => { setRituals(r=>({...r,[today]:{...(r[today]||{}),openedAt:new Date().toISOString()}})); onEnterDay(); };
  const closeDay = () => {
    setRituals(r=>({...r,[today]:{...(r[today]||{}),closedAt:new Date().toISOString(),reflection:{...draft}}}));
    setEditing(false);
  };

  const exportJournal = () => {
    const md = journalMarkdown({
      date: today, reflection: entry.reflection, sessions, focusedSecs, mitsDone, mitsTotal, byKind,
      energy: "🔋".repeat(Math.max(1,Math.min(3,Math.ceil((entry.reflection?.rating||3)/2)))),
      deepDone, restVerdict,
    });
    const blob=new Blob([md],{type:"text/markdown"});
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");
    a.href=url; a.download=`${today}.md`; a.click();
    URL.revokeObjectURL(url);
  };

  // Past closings, most recent first
  const pastDays = Object.entries(rituals)
    .filter(([d,v])=>d!==today && v.closedAt)
    .sort((a,b)=>b[0].localeCompare(a[0]))
    .slice(0,14);
  const fmtDay = (d) => new Date(d+"T12:00:00").toLocaleDateString("en-US",{weekday:"long",month:"long",day:"numeric"});

  // Past plans (absorbed from the old Planning page — one place to decide, one to review)
  const pastPlans = Object.entries(mits)
    .filter(([d,plan])=>d!==today && (plan.tasks||[]).some(t=>t))
    .sort((a,b)=>b[0].localeCompare(a[0]))
    .slice(0,7);
  const fmtPlanDay = (d) => new Date(d+"T12:00:00").toLocaleDateString("en-US",{weekday:"short",month:"short",day:"numeric"});

  const reflectFields = (
    <div className="card-s">
      {/* The closing metric — answered from data, not asked. */}
      <div style={{display:"flex",gap:8,flexWrap:"wrap",marginBottom:16}}>
        <span className={"badge "+(deepDone?"badge--success":"badge--neutral")}>
          <span className="dot"/>{deepDone?"Deep block done":"No deep block today"}
        </span>
        <span className={"badge "+(nDeg===0&&nReal>0?"badge--success":"badge--neutral")} title={restVerdict}>
          <span className="dot"/>{todayBreaks.length===0?"No breaks classified":nDeg===0?"Rest without input":nReal===0?"Rest was all screens":`Rest: ${nReal} real · ${nDeg} screens`}
        </span>
      </div>
      {REFLECT_QS.map(r=>(
        <div className="reflect" key={r.id}>
          <div className="reflect__q">{r.q}<span>{r.hint}</span></div>
          <AutoTextarea className="reflect__field" placeholder={r.ph}
            value={draft[r.id]||""} onChange={v=>setDraft(d=>({...d,[r.id]:v}))}/>
        </div>
      ))}
      {/* Optional journal capture — feeds journal/entries/ in the vault. */}
      <div className="reflect" style={{borderBottom:journalOpen?"":0}}>
        <button className="btn btn--ghost" style={{padding:"4px 0",fontSize:12.5}} onClick={()=>setJournalOpen(v=>!v)}>
          <Icon name={journalOpen?"chevronDown":"chevronRight"} size={13}/> For the second brain — optional
        </button>
      </div>
      {journalOpen && JOURNAL_QS.map(r=>(
        <div className="reflect" key={r.id}>
          <div className="reflect__q">{r.q}<span>{r.hint}</span></div>
          <AutoTextarea className="reflect__field" placeholder={r.ph}
            value={draft[r.id]||""} onChange={v=>setDraft(d=>({...d,[r.id]:v}))}/>
        </div>
      ))}
      <div className="reflect" style={{borderBottom:0}}>
        <div className="reflect__q">How was the day, as a whole?</div>
        <StarRating rated={draft.rating} onRate={v=>setDraft(d=>({...d,rating:v}))} label={null}
          captions={["","Survived it","Scattered","Steady","Strong","A day you'd repeat"]}/>
      </div>
      <div style={{display:"flex",gap:8,marginTop:18,flexWrap:"wrap"}}>
        <button className="btn btn--primary btn--lg" onClick={closeDay}><Icon name="check" size={14}/> Close the day</button>
        {editing&&<button className="btn btn--ghost btn--lg" onClick={()=>setEditing(false)}>Cancel</button>}
      </div>
    </div>
  );

  return (
    <div className="page">
      <div className="day-hero">
        <div className="eyebrow">{new Date().toLocaleDateString("en-US",{weekday:"long",month:"long",day:"numeric"})}</div>
        <h1 className="day-greet">{greeting}</h1>
        <div className="day-sub">
          {streak>0
            ? <>Day <b>{streak}</b> of your streak. {opened?"":"Don't break the chain."}</>
            : <>No streak yet — one session today starts it.</>}
        </div>
        {purpose.northStar
          ? <div className="day-star">{purpose.northStar}</div>
          : <div className="day-sub" style={{marginTop:20,fontStyle:"italic"}}>You haven't written a North Star yet. It belongs at the top of this page — set it on Purpose.</div>}
        {/* The other pole of the field of tension — what today is a vote against. */}
        {purpose.antiVision && (
          <div className="day-sub" style={{marginTop:14,maxWidth:620}}>
            <b style={{fontSize:10,letterSpacing:".14em",textTransform:"uppercase",color:"var(--hf-fg-subtle)",fontWeight:500}}>And what you refuse:</b>{" "}
            <span style={{fontStyle:"italic",color:"var(--hf-fg-muted)"}}>{purpose.antiVision.split("\n")[0]}</span>
          </div>
        )}
      </div>

      {/* ── Morning ── */}
      {!opened ? (
        <div className="day-section">
          <h2 className="day-section__title">Three things</h2>
          <p className="day-section__note">What would make today a success? Decide now, before the day decides for you.</p>
          <div className="card-s">
            {[0,1,2].map(i=>(
              <div key={i} className="mit-row">
                <input type="checkbox" className="mit-check" checked={plan.done[i]&&!!plan.tasks[i]} onChange={()=>toggle(i)}/>
                <input className={"mit-input"+(plan.done[i]&&plan.tasks[i]?" mit-input--done":"")}
                  placeholder={["Most important task…","Second priority…","Third priority…"][i]}
                  value={plan.tasks[i]} onChange={e=>setTask(i,e.target.value)}/>
              </div>
            ))}
            <button className="btn btn--primary btn--lg" style={{marginTop:20}} onClick={openDay}>
              <Icon name="play" size={14}/> Begin the day
            </button>
          </div>
        </div>
      ) : (
        <div className="day-section">
          <h2 className="day-section__title">Today so far</h2>
          <p className="day-section__note">Opened at {formatHHMM(new Date(entry.openedAt))}.</p>
          <div className="card-s">
            <div className="day-figures">
              <div><div className="day-figure__label">Focused</div><div className="day-figure__value">{focusedSecs?fmtDur(focusedSecs):"—"}</div></div>
              <div><div className="day-figure__label">Sessions</div><div className="day-figure__value">{sessions.length||"—"}</div></div>
              <div><div className="day-figure__label">Priorities</div><div className="day-figure__value">{mitsTotal?<>{mitsDone}<small>/{mitsTotal}</small></>:"—"}</div></div>
              <div><div className="day-figure__label">Practices</div><div className="day-figure__value">{practices||"—"}</div></div>
            </div>
            {/* Did the day have all three of its moments? */}
            <div style={{marginTop:24,paddingTop:20,borderTop:"1px solid var(--hf-border)"}}>
              <div className="eyebrow" style={{marginBottom:10}}>The shape of the day</div>
              <div className="shape">
                {KINDS.map(k=>{
                  const secs=byKind[k.id];
                  return (
                    <div className={"shape__item"+(secs>0?" shape__item--on":"")} key={k.id} title={k.blurb}>
                      <div className="shape__name">{k.label}</div>
                      <div className="shape__val">{secs?fmtDur(secs):"—"}</div>
                    </div>
                  );
                })}
              </div>
              <p style={{fontSize:12,color:"var(--hf-fg-subtle)",lineHeight:1.6,margin:"12px 0 0"}}>
                {byKind.use>0&&byKind.fill===0&&byKind.empty===0
                  ? "All output, no input and no emptying. That is the shape that burns out."
                  : "Create, learn, and let the mind idle. A day needs all three."}
              </p>
            </div>

            {mitsTotal>0&&(
              <div style={{marginTop:24,borderTop:"1px solid var(--hf-border)",paddingTop:6}}>
                {plan.tasks.map((t,i)=>t?(
                  <div key={i} className="mit-row">
                    <input type="checkbox" className="mit-check" checked={plan.done[i]} onChange={()=>toggle(i)}/>
                    <input className={"mit-input"+(plan.done[i]?" mit-input--done":"")} value={t} onChange={e=>setTask(i,e.target.value)}/>
                  </div>
                ):null)}
              </div>
            )}
          </div>
        </div>
      )}

      {/* ── Evening ── */}
      <div className="day-section">
        <h2 className="day-section__title">Close the day</h2>
        <p className="day-section__note">
          Seneca reviewed every evening — not to punish himself, but to calibrate. A day you never
          close is a day you cannot learn from.
        </p>
        {closed && !editing ? (
          <div className="card-s">
            <div className="day-done"><Icon name="check" size={15}/> Closed at {formatHHMM(new Date(entry.closedAt))}.</div>
            <div style={{marginTop:18}}>
              {REFLECT_QS.map(r=>entry.reflection?.[r.id]?(
                <div className="day-log__line" key={r.id}><b>{r.q}</b>{entry.reflection[r.id]}</div>
              ):null)}
              {entry.reflection?.rating&&<div className="quality-stars" style={{fontSize:14,marginTop:10}}>{"★".repeat(entry.reflection.rating)}</div>}
            </div>
            <div style={{display:"flex",gap:8,marginTop:16,flexWrap:"wrap",alignItems:"center"}}>
              <button className="btn btn--ghost" style={{padding:"4px 10px",fontSize:12}}
                onClick={()=>{ setDraft({advanced:"",derailed:"",tomorrow:"",freeform:"",repeated:"",surprised:"",phrase:"",rating:null,...(entry.reflection||{})}); setEditing(true); }}>
                Edit
              </button>
              <button className="btn btn--secondary" style={{padding:"4px 10px",fontSize:12}} onClick={exportJournal}>
                <Icon name="download" size={13}/> Send to second brain
              </button>
            </div>
            <p style={{fontSize:11.5,color:"var(--hf-fg-subtle)",lineHeight:1.6,margin:"10px 0 0"}}>
              Downloads <code>{today}.md</code> in your vault's daily format — drop it into <code>journal/entries/</code>.
            </p>
          </div>
        ) : reflectFields}
      </div>

      {/* ── History ── */}
      {pastDays.length>0&&(
        <div className="day-section">
          <h2 className="day-section__title">Previous days</h2>
          <p className="day-section__note">Read these back before you plan a week.</p>
          <div className="card-s">
            {pastDays.map(([d,v])=>(
              <div className="day-log" key={d}>
                <div className="day-log__head">
                  <div className="day-log__date">{fmtDay(d)}</div>
                  {v.reflection?.rating&&<div className="quality-stars">{"★".repeat(v.reflection.rating)}</div>}
                </div>
                {REFLECT_QS.map(r=>v.reflection?.[r.id]?(
                  <div className="day-log__line" key={r.id}><b>{r.q}</b>{v.reflection[r.id]}</div>
                ):null)}
              </div>
            ))}
          </div>
        </div>
      )}

      {/* ── Recent plans ── */}
      {pastPlans.length>0&&(
        <div className="day-section">
          <h2 className="day-section__title">Recent plans</h2>
          <p className="day-section__note">The three things of previous days, and whether they happened.</p>
          <div className="card-s">
            <div className="plan-history">
              {pastPlans.map(([d,plan])=>{
                const tasks=plan.tasks||[]; const done=plan.done||[];
                return (
                  <div key={d} className="plan-day">
                    <div className="plan-day__date">{fmtPlanDay(d)}</div>
                    <div className="plan-day__tasks">
                      {tasks.map((t,i)=>t?(
                        <div key={i} className={"plan-day__task"+(done[i]?" plan-day__task--done":"")}>
                          <div className={"plan-day__dot"+(done[i]?" plan-day__dot--done":"")}/>
                          {t}
                        </div>
                      ):null)}
                    </div>
                  </div>
                );
              })}
            </div>
          </div>
        </div>
      )}
    </div>
  );
};

/* ── The Week ─────────────────────────────────────────────────────────────
   The vault's weekly protocol, composed from pieces the app already tracks:
   a review of accumulated evidence, a measurement backwards (never toward the
   ideal), a leak audit, and a check that the week had real emptiness in it.
   Closes with an export that seeds Claudian's weekly synthesis. */
const isoWeekOf = (dstr) => {
  const dt=new Date(dstr+"T12:00:00");
  dt.setDate(dt.getDate()+3-((dt.getDay()+6)%7));
  const w1=new Date(dt.getFullYear(),0,4);
  const wk=1+Math.round(((dt-w1)/86400000-3+((w1.getDay()+6)%7))/7);
  return `${dt.getFullYear()}-W${String(wk).padStart(2,"0")}`;
};

const TheWeek = ({ weekly, setWeekly, purpose, sessions, rituals, breaks }) => {
  const ws = getWeekStart();                          // Monday of this week
  const prevWs = (()=>{ const d=new Date(ws+"T12:00:00"); d.setDate(d.getDate()-7); return localDate(d); })();
  const saved = weekly[ws] || {};
  const [fugas, setFugas] = useState(saved.fugas||"");
  const [note,  setNote]  = useState(saved.note||"");

  const inRange = (from,to) => sessions.filter(s=>{ if(!s.date) return false; const d=localDate(new Date(s.date)); return d>=from&&(!to||d<to); });
  const statsOf = (list) => {
    const rated=list.filter(s=>s.quality>0);
    return {
      hours:list.reduce((a,s)=>a+(s.dur||0),0)/3600,
      n:list.length,
      days:new Set(list.map(s=>localDate(new Date(s.date)))).size,
      q:rated.length?avg(rated.map(s=>s.quality)):null,
    };
  };
  const cur  = statsOf(inRange(ws,null));
  const prev = statsOf(inRange(prevWs,ws));
  const weekSessions = inRange(ws,null);
  const byKind = kindSecs(weekSessions);
  const deepBlocks = weekSessions.filter(s=>(s.dur||0)>=50*60).length;
  const weekBreaks = breaks.filter(b=>b.date&&localDate(new Date(b.date))>=ws&&b.type);
  const nReal = weekBreaks.filter(b=>b.type==="real").length;
  const nDeg  = weekBreaks.filter(b=>b.type==="degenerate").length;
  const emptySessions = weekSessions.filter(s=>s.kind==="empty").length;
  const closedDays = Object.entries(rituals)
    .filter(([d,v])=>d>=ws&&v.closedAt)
    .sort((a,b)=>a[0].localeCompare(b[0]));

  const fmtD = (v,unit="") => v==null?"—":(typeof v==="number"&&!Number.isInteger(v)?v.toFixed(1):v)+unit;
  const rows = [
    { label:"Hours focused", then:fmtD(prev.hours,"h"), now:fmtD(cur.hours,"h"), up:cur.hours>prev.hours },
    { label:"Sessions",      then:fmtD(prev.n),         now:fmtD(cur.n),         up:cur.n>prev.n },
    { label:"Days shown up", then:fmtD(prev.days),      now:fmtD(cur.days),      up:cur.days>prev.days },
    { label:"Avg quality",   then:prev.q?prev.q.toFixed(1)+"★":"—", now:cur.q?cur.q.toFixed(1)+"★":"—", up:(cur.q||0)>(prev.q||0) },
  ];

  const closeWeek = () => {
    setWeekly(w=>({...w,[ws]:{fugas,note,closedAt:new Date().toISOString()}}));
  };

  const exportSeed = () => {
    const wk = isoWeekOf(ws);
    const dayLines = closedDays.map(([d,v])=>{
      const r=v.reflection||{};
      return `- ${new Date(d+"T12:00:00").toLocaleDateString("es-CO",{weekday:"short",day:"numeric"})}: ${r.rating?"★".repeat(r.rating):"—"}${r.tomorrow?` · mañana: ${r.tomorrow}`:""}`;
    }).join("\n");
    const md = `---
type: weekly-seed
week: ${wk}
generated: ${todayStr()}
tags: [hyperfocus, sintesis-semanal]
---

# Semana ${wk} — datos de Hyper Focus

*Seed automático para la síntesis semanal. Complementa las entradas de journal/entries/ — no las reemplaza.*

## Medición hacia atrás (vs. semana anterior)
- **Horas de foco:** ${fmtD(prev.hours,"h")} → ${fmtD(cur.hours,"h")}
- **Sesiones:** ${prev.n} → ${cur.n}
- **Días presentes:** ${prev.days} → ${cur.days}
- **Calidad media:** ${prev.q?prev.q.toFixed(1)+"★":"—"} → ${cur.q?cur.q.toFixed(1)+"★":"—"}

## Evidencia acumulada
- **Identidad declarada:** ${purpose.identity?`"${purpose.identity}"`:"—"}
- **Votos esta semana:** ${cur.n} ${cur.n===1?"sesión":"sesiones"} (${fmtD(cur.hours,"h")})
- **Bloques profundos (≥50 min):** ${deepBlocks}

## La forma de la semana
- **Use:** ${byKind.use?fmtDur(byKind.use):"—"} · **Fill:** ${byKind.fill?fmtDur(byKind.fill):"—"} · **Empty:** ${byKind.empty?fmtDur(byKind.empty):"—"}
- **Descansos clasificados:** ${nReal} sin input · ${nDeg} con pantallas
- **Sesiones de vacío deliberado:** ${emptySessions}

## Días cerrados
${dayLines||"- (ninguno)"}

## Auditoría de fugas
${fugas||"—"}

## Nota de la semana
${note||"—"}
`;
    const blob=new Blob([md],{type:"text/markdown"});
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");
    a.href=url; a.download=`${wk}-hyperfocus.md`; a.click();
    URL.revokeObjectURL(url);
  };

  return (
    <div className="page">
      <div style={{marginBottom:28}}>
        <div className="eyebrow">Week of {new Date(ws+"T12:00:00").toLocaleDateString("en-US",{month:"long",day:"numeric"})} · {isoWeekOf(ws)}</div>
        <h1 className="h-serif" style={{fontSize:44,margin:"8px 0 0"}}>The Week</h1>
        <p style={{color:"var(--hf-fg-muted)",fontSize:13,marginTop:8,lineHeight:1.7,maxWidth:620}}>
          Once a week, four moves: look at the evidence, measure backwards, audit the leaks,
          and check that the week had real emptiness in it. Then send the seed to the second brain.
        </p>
      </div>

      {/* ── Measured backwards ── */}
      <div className="eyebrow" style={{marginBottom:10}}>Measured backwards</div>
      <div className="card-s" style={{marginBottom:28}}>
        <div className="gain-grid">
          {rows.map(g=>(
            <div className="gain" key={g.label}>
              <div className="gain__label">{g.label}</div>
              <div className="gain__row">
                <span className="gain__then">{g.then}</span>
                <span className="gain__arrow">→</span>
                <span className="gain__now">{g.now}</span>
              </div>
            </div>
          ))}
        </div>
        <p style={{fontSize:12.5,color:"var(--hf-fg-subtle)",margin:"16px 0 0",paddingTop:14,borderTop:"1px solid var(--hf-border)",fontStyle:"italic",lineHeight:1.6}}>
          Against last week — never against the ideal.
        </p>
      </div>

      {/* ── Accumulated evidence ── */}
      <div className="eyebrow" style={{marginBottom:10}}>Accumulated evidence</div>
      <div className="card-s" style={{marginBottom:28}}>
        {purpose.identity
          ? <p style={{fontSize:14,fontStyle:"italic",color:"var(--hf-fg-body)",margin:"0 0 12px",lineHeight:1.7}}>"{purpose.identity}"</p>
          : <p style={{fontSize:13,color:"var(--hf-fg-muted)",margin:"0 0 12px"}}>No identity statement yet — write one on Purpose.</p>}
        <div className="votes" style={{borderTop:0,paddingTop:0,marginTop:0}}>
          <span className="votes__n">{cur.n}</span>
          <span className="votes__label">{cur.n===1?"vote":"votes"} this week that the person you're becoming would cast — {fmtD(cur.hours,"h")} of focus, {deepBlocks} deep {deepBlocks===1?"block":"blocks"}.</span>
        </div>
        {closedDays.length>0&&(
          <div style={{display:"flex",gap:8,flexWrap:"wrap",marginTop:14,paddingTop:14,borderTop:"1px solid var(--hf-border)"}}>
            {closedDays.map(([d,v])=>(
              <span key={d} className="badge badge--neutral">
                {new Date(d+"T12:00:00").toLocaleDateString("en-US",{weekday:"short"})}
                {v.reflection?.rating&&<span className="quality-stars" style={{fontSize:10}}>{"★".repeat(v.reflection.rating)}</span>}
              </span>
            ))}
          </div>
        )}
      </div>

      {/* ── Deliberate emptiness ── */}
      <div className="eyebrow" style={{marginBottom:10}}>Deliberate emptiness</div>
      <div className="card-s" style={{marginBottom:28}}>
        <p style={{fontSize:13.5,color:"var(--hf-fg-body)",margin:0,lineHeight:1.7}}>
          {emptySessions>0||byKind.empty>0
            ? <>The week held <b>{fmtDur(byKind.empty)}</b> of Empty and {nReal>0?<><b>{nReal}</b> {nReal===1?"break":"breaks"} without input</>:"no classified real rest"}. The mind processed.</>
            : <>No Empty sessions and {nReal>0?`${nReal} real ${nReal===1?"break":"breaks"}`:"no real rest"} this week. One block of deliberate boredom — a walk without headphones, sitting with nothing — is part of the protocol, not a luxury.</>}
        </p>
      </div>

      {/* ── Leak audit ── */}
      <div className="eyebrow" style={{marginBottom:10}}>Leak audit</div>
      <div className="card-s" style={{marginBottom:28}}>
        <div className="reflect" style={{paddingTop:0}}>
          <div className="reflect__q">Open loops, sustained judgments, draining relations<span>Name them — a leak you can see stops being ambient.</span></div>
          <AutoTextarea className="reflect__field" placeholder="What is quietly draining energy…" value={fugas} onChange={setFugas}/>
        </div>
        <div className="reflect" style={{borderBottom:0}}>
          <div className="reflect__q">One line for the week<span>What did this week teach that last week's you didn't know?</span></div>
          <AutoTextarea className="reflect__field" placeholder="This week I learned…" value={note} onChange={setNote}/>
        </div>
      </div>

      <div style={{display:"flex",gap:10,flexWrap:"wrap",alignItems:"center"}}>
        <button className="btn btn--primary btn--lg" onClick={closeWeek}><Icon name="check" size={14}/> {saved.closedAt?"Update the week":"Close the week"}</button>
        <button className="btn btn--secondary btn--lg" onClick={()=>{ closeWeek(); exportSeed(); }}><Icon name="download" size={14}/> Send seed to second brain</button>
        {saved.closedAt&&<span style={{fontSize:12,color:"var(--hf-fg-subtle)"}}>Closed {formatHHMM(new Date(saved.closedAt))} · {localDate(new Date(saved.closedAt))}</span>}
      </div>
      <p style={{fontSize:11.5,color:"var(--hf-fg-subtle)",lineHeight:1.6,margin:"12px 0 0"}}>
        Downloads <code>{isoWeekOf(ws)}-hyperfocus.md</code> — drop it into <code>raw/pending/</code> so Claudian
        can use it when building the weekly synthesis.
      </p>
    </div>
  );
};

/* ── Purpose ── */
// Textarea that grows with its content — keeps the North Star readable as one block
// instead of a scrolling one-liner.
const AutoTextarea = ({ value, onChange, className, placeholder }) => {
  const ref = useRef(null);
  useEffect(()=>{
    const el=ref.current; if(!el) return;
    el.style.height="auto"; el.style.height=el.scrollHeight+"px";
  },[value]);
  return <textarea ref={ref} rows={1} className={className} placeholder={placeholder} value={value} onChange={e=>onChange(e.target.value)}/>;
};

const Purpose = ({ purpose, setPurpose, sessions }) => {
  const [newTitle, setNewTitle] = useState("");
  const [newHours, setNewHours] = useState("");
  const [protoTrigger, setProtoTrigger] = useState("session-end");
  const [protoIf, setProtoIf] = useState("");
  const [protoThen, setProtoThen] = useState("");
  const goals  = purpose.goals || [];
  const active = goals.filter(g=>!g.archived);
  const done   = goals.filter(g=>g.archived);
  const hoursFor = id => sessions.reduce((a,s)=>a+(s.goalId===id?(s.dur||0):0),0)/3600;

  const patch = p => setPurpose(prev=>({...prev,...p}));
  // Stamp the moment the identity was first declared — the votes counted below
  // are the ones cast since then, not a retroactive tally.
  const setIdentity = (v) => setPurpose(prev=>({
    ...prev, identity:v,
    identitySince: prev.identitySince || (v.trim() ? new Date().toISOString() : null),
  }));
  const since = purpose.identitySince ? new Date(purpose.identitySince) : null;
  const votes = since ? sessions.filter(s=>s.date&&new Date(s.date)>=since) : [];
  // Take the max date rather than the last element — history order is not guaranteed
  const lastVote = votes.length ? new Date(Math.max(...votes.map(s=>new Date(s.date)))) : null;
  const daysAgo = (d) => {
    const n=Math.floor((new Date(localDate()+"T12:00:00")-new Date(localDate(d)+"T12:00:00"))/86400000);
    return n===0?"today":n===1?"yesterday":`${n} days ago`;
  };

  const protocols = purpose.protocols || [];
  const addProto = () => {
    const t=protoIf.trim(), a=protoThen.trim();
    if(!t||!a) return;
    setPurpose(p=>({...p,protocols:[...(p.protocols||[]),{id:"p"+Date.now(),trigger:protoTrigger,when:t,then:a}]}));
    setProtoIf(""); setProtoThen("");
  };
  const removeProto = (id) => setPurpose(p=>({...p,protocols:(p.protocols||[]).filter(x=>x.id!==id)}));

  const avReviewed = purpose.antiVisionReviewedAt ? new Date(purpose.antiVisionReviewedAt) : null;
  const avStale = purpose.antiVision && (!avReviewed || (Date.now()-avReviewed)/86400000 >= 30);
  const addGoal = () => {
    const title=newTitle.trim(); if(!title) return;
    const target=Math.min(5000,Math.max(1,parseInt(newHours)||40));
    const g={id:"g"+Date.now(),title,target,archived:false,createdAt:new Date().toISOString()};
    setPurpose(p=>({...p,goals:[...(p.goals||[]),g],activeGoalId:p.activeGoalId||g.id}));
    setNewTitle(""); setNewHours("");
  };
  const updateGoal = (id,p) => setPurpose(prev=>({...prev,goals:prev.goals.map(g=>g.id===id?{...g,...p}:g)}));
  const removeGoal = (id) => setPurpose(prev=>({
    ...prev,
    goals: prev.goals.filter(g=>g.id!==id),
    activeGoalId: prev.activeGoalId===id ? null : prev.activeGoalId,
  }));

  const renderGoal = (g) => {
    const h=hoursFor(g.id), pct=Math.min(100,(h/g.target)*100), isActive=purpose.activeGoalId===g.id;
    return (
      <div className="goal" key={g.id}>
        <div className="goal__head">
          <div className={"goal__title"+(g.archived?" goal__title--dim":"")}>{g.title}</div>
          <div className="goal__nums"><b>{h.toFixed(1)}h</b> / {g.target}h</div>
        </div>
        <div className="goal__bar"><i style={{width:`${pct}%`}}/></div>
        <div className="goal__actions">
          {!g.archived && (isActive
            ? <span className="badge badge--accent"><span className="dot"/>Current focus</span>
            : <button className="btn btn--ghost" style={{padding:"4px 10px",fontSize:12}} onClick={()=>patch({activeGoalId:g.id})}>Make current</button>)}
          <button className="btn btn--ghost" style={{padding:"4px 10px",fontSize:12}}
            onClick={()=>updateGoal(g.id,{archived:!g.archived})}>
            {g.archived?"Reopen":"Archive"}
          </button>
          <button className="btn btn--danger" style={{padding:"4px 10px",fontSize:12}} onClick={()=>removeGoal(g.id)}>Delete</button>
        </div>
      </div>
    );
  };

  return (
    <div className="page">
      <div className="eyebrow">Compass</div>
      <h1 className="h-serif" style={{fontSize:44,margin:"8px 0 10px"}}>Purpose</h1>
      <p style={{fontSize:14,color:"var(--hf-fg-muted)",lineHeight:1.7,margin:"0 0 32px",maxWidth:620}}>
        Everything else in this app measures what you did. This page holds why. It is the only
        thing here you should reread more often than you edit.
      </p>

      <div className="eyebrow" style={{marginBottom:10}}>North Star</div>
      <div className="purpose-star">
        <AutoTextarea className="purpose-star__field" value={purpose.northStar||""}
          onChange={v=>patch({northStar:v})}
          placeholder="In one sentence — what are you actually building your life toward?"/>
      </div>
      <p style={{fontSize:12,color:"var(--hf-fg-subtle)",lineHeight:1.65,margin:"0 0 40px",maxWidth:560}}>
        This line follows you: it sits in the sidebar and above every session you start.
      </p>

      {/* ── Anti-vision ── */}
      <div className="eyebrow" style={{marginBottom:10}}>Anti-vision</div>
      <div className="card-s" style={{marginBottom:8,borderLeft:"3px solid var(--hf-bone-400)"}}>
        <AutoTextarea className="purpose-identity__field" value={purpose.antiVision||""}
          onChange={v=>patch({antiVision:v})}
          placeholder="What does your life have that you don't want? Where do you end up if you stay on this road?"/>
        {purpose.antiVision&&(
          <div style={{marginTop:16,paddingTop:14,borderTop:"1px solid var(--hf-border)",display:"flex",gap:10,alignItems:"center",flexWrap:"wrap"}}>
            <button className="btn btn--ghost" style={{padding:"4px 10px",fontSize:12}}
              onClick={()=>patch({antiVisionReviewedAt:new Date().toISOString()})}>
              <Icon name="check" size={13}/> Reviewed today
            </button>
            <span style={{fontSize:12,color:avStale?"var(--hf-sand-700)":"var(--hf-fg-subtle)"}}>
              {avReviewed ? `Last reviewed ${daysAgo(avReviewed)}.` : "Never reviewed."}
              {avStale&&" It's built from experience — it goes stale."}
            </span>
          </div>
        )}
      </div>
      <p style={{fontSize:12,color:"var(--hf-fg-subtle)",lineHeight:1.65,margin:"0 0 40px",maxWidth:560}}>
        Easier to write than a vision, because you have evidence for it. The two together make a
        field of tension where inaction costs more than action. Revisit it monthly.
      </p>

      {/* ── Identity as accumulated evidence ── */}
      <div className="eyebrow" style={{marginBottom:10}}>Identity</div>
      <div className="card-s" style={{marginBottom:8}}>
        <AutoTextarea className="purpose-identity__field" value={purpose.identity||""}
          onChange={setIdentity}
          placeholder="I am the kind of person who…"/>
        {purpose.identity&&since&&(
          <div className="votes">
            <span className="votes__n">{votes.length}</span>
            <span className="votes__label">
              {votes.length===1?"vote":"votes"} cast for this since you wrote it.
              {lastVote ? <> Last one <b>{daysAgo(lastVote)}</b>.</> : <> None yet — the first session is the first vote.</>}
            </span>
          </div>
        )}
      </div>
      <p style={{fontSize:12,color:"var(--hf-fg-subtle)",lineHeight:1.65,margin:"0 0 40px",maxWidth:560}}>
        Identity doesn't install through affirmation, it installs through accumulated evidence.
        Every session you finish is one vote. You don't need to win always — you need the pile to
        grow until believing it is the only rational conclusion left.
      </p>

      {/* ── If-then protocols ── */}
      <div className="eyebrow" style={{marginBottom:10}}>If-then protocols</div>
      <div className="card-s">
        {protocols.length===0 && (
          <p style={{fontSize:13,color:"var(--hf-fg-muted)",margin:"4px 0 16px",lineHeight:1.7}}>
            Nothing pre-committed yet. Decide the response now, while you're calm — the trigger
            moment is not when you'll be able to.
          </p>
        )}
        {protocols.map(p=>(
          <div className="proto" key={p.id}>
            <div className="proto__when">{TRIGGERS.find(t=>t.id===p.trigger)?.label||p.trigger}</div>
            <div style={{display:"flex",gap:12,alignItems:"flex-start"}}>
              <div className="proto__line" style={{flex:1}}>
                If <b>{p.when}</b>, then <b>{p.then}</b>.
              </div>
              <button className="btn btn--danger" style={{padding:"2px 8px",fontSize:11}} onClick={()=>removeProto(p.id)}>Remove</button>
            </div>
          </div>
        ))}
        <div style={{marginTop:protocols.length?18:0,paddingTop:protocols.length?16:0,borderTop:protocols.length?"1px solid var(--hf-border)":"none"}}>
          <div className="kinds" style={{justifyContent:"flex-start",marginBottom:10,flexWrap:"wrap"}}>
            {TRIGGERS.map(t=>(
              <button key={t.id} className={"kind"+(protoTrigger===t.id?" kind--on":"")} onClick={()=>setProtoTrigger(t.id)}>{t.label}</button>
            ))}
          </div>
          <div className="goal-new" style={{marginTop:0}}>
            <input className="input" placeholder="If… (e.g. I feel the pull to open Instagram)"
              value={protoIf} onChange={e=>setProtoIf(e.target.value)} onKeyDown={e=>{if(e.key==="Enter")addProto();}}/>
            <input className="input" placeholder="…then (e.g. I stand up and get a glass of water)"
              value={protoThen} onChange={e=>setProtoThen(e.target.value)} onKeyDown={e=>{if(e.key==="Enter")addProto();}}/>
            <button className="btn btn--primary" onClick={addProto}><Icon name="plus" size={14}/> Add</button>
          </div>
        </div>
      </div>
      <p style={{fontSize:12,color:"var(--hf-fg-subtle)",lineHeight:1.65,margin:"8px 0 40px",maxWidth:560}}>
        Willpower lives in the prefrontal cortex; the impulse fires in the limbic system, which is
        faster. Pre-deciding removes the deliberation from the moment you'd lose it. Hyper Focus
        knows exactly when a session ends — it will show you the right one there.
      </p>

      <div className="eyebrow" style={{marginBottom:10}}>Goals</div>
      <div className="card-s">
        {active.length===0 && <p style={{fontSize:13,color:"var(--hf-fg-muted)",margin:"4px 0 0",lineHeight:1.7}}>
          No goals yet. Add one and every session you run will count toward it.
        </p>}
        {active.map(renderGoal)}
        <div className="goal-new">
          <input className="input" placeholder="Goal — e.g. Ship the first version of the product"
            value={newTitle} onChange={e=>setNewTitle(e.target.value)}
            onKeyDown={e=>{ if(e.key==="Enter") addGoal(); }}/>
          <input className="input input--num" type="number" min="1" max="5000" placeholder="Hours"
            value={newHours} onChange={e=>setNewHours(e.target.value)}
            onKeyDown={e=>{ if(e.key==="Enter") addGoal(); }}/>
          <button className="btn btn--primary" onClick={addGoal}><Icon name="plus" size={14}/> Add</button>
        </div>
      </div>

      {done.length>0 && (<>
        <div className="eyebrow" style={{margin:"36px 0 10px"}}>Archived</div>
        <div className="card-s">{done.map(renderGoal)}</div>
      </>)}
    </div>
  );
};

const Settings = ({ theme, setTheme, onExport, onImport, onClearData, name, setName, lastExport, hasData, trackerOn, setTrackerOn }) => {
  const daysSinceExport = lastExport ? Math.floor((Date.now()-lastExport)/86400000) : null;
  const nudge = hasData && (daysSinceExport===null || daysSinceExport>=7);
  const [confirmClear, setConfirmClear] = useState(false);
  const [importMsg, setImportMsg] = useState(null);
  const fileRef = useRef(null);
  return (
    <div className="page">
      <div className="eyebrow">Preferences</div>
      <h1 className="h-serif" style={{fontSize:44,margin:"8px 0 32px"}}>Settings</h1>
      <div className="card-s">
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"12px 0",borderBottom:"1px solid var(--hf-border)"}}>
          <div><div style={{fontSize:14,fontWeight:500}}>Your name</div><div style={{fontSize:12,color:"var(--hf-fg-muted)",marginTop:2}}>Used in the Dashboard greeting.</div></div>
          <input className="input" style={{width:180,fontSize:13}} placeholder="e.g. Marcus" value={name||""} onChange={e=>setName(e.target.value)}/>
        </div>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"12px 0",borderBottom:"1px solid var(--hf-border)"}}>
          <div><div style={{fontSize:14,fontWeight:500}}>Theme</div><div style={{fontSize:12,color:"var(--hf-fg-muted)",marginTop:2}}>Light paper or deep charcoal.</div></div>
          <button className="btn btn--secondary" onClick={()=>setTheme(t=>t==="light"?"dark":"light")}><Icon name={theme==="dark"?"sun":"moon"} size={14}/>{theme==="dark"?"Light":"Dark"}</button>
        </div>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"12px 0",borderBottom:"1px solid var(--hf-border)"}}>
          <div><div style={{fontSize:14,fontWeight:500}}>Keyboard shortcuts</div><div style={{fontSize:12,color:"var(--hf-fg-muted)",marginTop:2}}>Space to begin or pause. Ctrl+K for commands.</div></div>
          <span className="badge badge--neutral" style={{fontFamily:"var(--hf-font-mono)"}}>Space · Ctrl K</span>
        </div>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"12px 0",borderBottom:"1px solid var(--hf-border)"}}>
          <div><div style={{fontSize:14,fontWeight:500}}>Pre-focus breath</div><div style={{fontSize:12,color:"var(--hf-fg-muted)",marginTop:2}}>1, 2, or 3 min. Available on the session page.</div></div>
          <span className="badge badge--success"><span className="dot"/>Active</span>
        </div>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"12px 0"}}>
          <div><div style={{fontSize:14,fontWeight:500}}>Tracker check-ins</div><div style={{fontSize:12,color:"var(--hf-fg-muted)",marginTop:2}}>Prompts at :00 and :30. Never interrupts a focus session — those blocks are logged automatically.</div></div>
          <button className="btn btn--secondary" onClick={()=>setTrackerOn(v=>!v)}>{trackerOn?"On — every 30 min":"Off"}</button>
        </div>
      </div>

      <div className="card-s" style={{marginTop:24}}>
        <div className="eyebrow" style={{marginBottom:14}}>Data</div>
        <p style={{fontSize:13,color:"var(--hf-fg-body)",margin:"0 0 18px",lineHeight:1.65}}>
          Sessions, tracker entries, plans, and your Purpose are saved in this browser's local storage.
          Each device keeps its own copy — export here and import on the other one to carry your history across.
          Importing merges: nothing already saved is overwritten or lost.
        </p>
        <div style={{display:"flex",gap:8,alignItems:"center",flexWrap:"wrap"}}>
          <button className="btn btn--secondary" onClick={onExport}><Icon name="download" size={14}/> Export JSON</button>
          <button className="btn btn--secondary" onClick={()=>fileRef.current?.click()}><Icon name="upload" size={14}/> Import JSON</button>
          <input ref={fileRef} type="file" accept="application/json,.json" style={{display:"none"}}
            onChange={e=>{
              const f=e.target.files?.[0]; e.target.value="";
              if(!f) return;
              setImportMsg(null);
              onImport(f).then(m=>setImportMsg({ok:true,text:m})).catch(err=>setImportMsg({ok:false,text:err.message}));
            }}/>
          {confirmClear
            ? <>
                <button className="btn btn--danger" onClick={()=>{ onClearData(); setConfirmClear(false); }}>Confirm — erase all</button>
                <button className="btn btn--ghost" onClick={()=>setConfirmClear(false)}>Cancel</button>
              </>
            : <button className="btn btn--ghost" onClick={()=>setConfirmClear(true)}>Clear all data</button>
          }
        </div>
        {importMsg && (
          <p style={{fontSize:12,marginTop:14,marginBottom:0,color:importMsg.ok?"var(--hf-success)":"#C0392B"}}>{importMsg.text}</p>
        )}
        {nudge ? (
          <p style={{fontSize:12.5,marginTop:16,marginBottom:0,lineHeight:1.6,color:"var(--hf-sand-700)"}}>
            {daysSinceExport===null
              ? "You have never exported. One click now means a bad day later costs you nothing."
              : `Your last backup was ${daysSinceExport} days ago.`}
          </p>
        ) : daysSinceExport!==null && (
          <p style={{fontSize:12,marginTop:16,marginBottom:0,color:"var(--hf-fg-subtle)"}}>
            Last backup: {daysSinceExport===0?"today":`${daysSinceExport} day${daysSinceExport===1?"":"s"} ago`}.
          </p>
        )}
        <p style={{fontSize:12,color:"var(--hf-fg-subtle)",marginTop:14,marginBottom:0,lineHeight:1.6}}>
          Clearing erases sessions, tracker entries, plans, practices, closed days, breaks, and weekly reviews. Your Purpose page is kept.
        </p>
      </div>
      <p style={{fontSize:12,color:"var(--hf-fg-subtle)",marginTop:24,fontStyle:"italic"}}>
        Data lives only in this browser. No account, no sync, no servers.
      </p>
    </div>
  );
};

/* Persist on change only. Writing on mount would re-save the state we just
   loaded — and, worse, would overwrite the IndexedDB mirror with an empty array
   before the recovery check ever gets to read it. */
const usePersist = (key, value) => {
  const mounted = useRef(false);
  useEffect(()=>{
    if(!mounted.current){ mounted.current=true; return; }
    saveLS(key, value);
  },[value]);
};

/* ── App ── */
const App = () => {
  // Land on the day's opening ritual until it has been done, then go straight to the dashboard.
  const [view,    setView]    = useState(()=>loadLS("hf_rituals",{})[todayStr()]?.openedAt ? "dashboard" : "day");
  const [theme,   setTheme]   = useState(()=>loadLS("hf_theme","light"));
  const [task,    setTask]    = useState("");
  const [sound,   setSound]   = useState(null);
  const [cmdk,    setCmdk]    = useState(false);
  const [menuOpen,setMenuOpen]= useState(false);
  const [phase,   setPhase]   = useState("idle");
  const [session, setSession] = useState({index:1, mode:"pomodoro", total:25*60, remaining:25*60});
  const [breakRem,setBreakRem]= useState(5*60);
  const [history,     setHistory]     = useState(()=>loadLS("hf_history",[]));
  const [quote,       setQuote]       = useState(()=>randQuote());
  const [mits,        setMits]        = useState(()=>loadLS("hf_mits",{}));
  const [practiceLog, setPracticeLog] = useState(()=>loadLS("hf_practices",[]));
  const [goals,       setGoals]       = useState(()=>loadLS("hf_goals",[]));
  const [todos,       setTodos]       = useState(()=>loadLS("hf_todos",[]));
  const [skills,      setSkills]      = useState(()=>loadLS("hf_skills",[]));
  const [name,        setName]        = useState(()=>loadLS("hf_name",""));
  const [breathDuration, setBreathDuration] = useState(60);
  const [preloadDuration, setPreloadDuration] = useState(10*60);
  const [lastDur, setLastDur] = useState(0); // seconds of the session the complete screen is showing
  const [lastExport, setLastExport] = useState(()=>loadLS("hf_lastExport",null));
  const [kind, setKind]     = useState("use");           // Fill / Empty / Use
  const [breaks, setBreaks] = useState(()=>loadLS("hf_breaks",[]));
  const [restAsk, setRestAsk] = useState(null);          // {id} of a break awaiting classification
  const [rituals,     setRituals]     = useState(()=>loadLS("hf_rituals",{}));
  const [weekly,      setWeekly]      = useState(()=>loadLS("hf_weekly",{}));
  const [trackerOn,   setTrackerOn]   = useState(()=>loadLS("hf_trackerOn",true));
  const [purpose,     setPurpose]     = useState(()=>({northStar:"",identity:"",goals:[],activeGoalId:null,...loadLS("hf_purpose",{})}));
  const activeGoalId = purpose.activeGoalId || null;
  const activeGoal   = (purpose.goals||[]).find(g=>g.id===activeGoalId) || null;

  // Wall-clock refs — these are never stale in callbacks
  const sessionStartRef     = useRef(null);   // HH:MM display string when Begin pressed
  const focusTsRef          = useRef(0);      // Date.now() when this focus period started
  const focusElapsedRef     = useRef(0);      // seconds elapsed in ALL prior focus periods (handles pause/resume)
  const breakTsRef          = useRef(0);      // Date.now() when break started
  const breakTotalRef       = useRef(5*60);   // total break seconds for current break
  const phaseRef            = useRef("idle"); // always-current phase (for visibilitychange)
  const taskRef             = useRef("");     // current task text, readable from timer closures
  const trackerOnRef        = useRef(true);   // tracker toggle, readable from timer closures
  const periodStartRef      = useRef(null);   // mirror of trackerPeriodStart for closures
  const lastSessionIdRef    = useRef(null);   // id of the session the rating screen belongs to
  const trackerTargetRef    = useRef(getNextHalfHourMs()); // abs ms of next :00/:30
  const trackerFiredRef     = useRef(false);  // prevents double-fire on same interval

  // Tracker
  const [trackerEntries,   setTrackerEntries]   = useState(()=>loadLS("hf_tracker",[]));
  const [trackerPrompt,    setTrackerPrompt]    = useState(false);
  const [manualEntry,      setManualEntry]      = useState(false);
  const [trackerCountdown, setTrackerCountdown] = useState(()=>Math.max(0,Math.round((getNextHalfHourMs()-Date.now())/1000)));
  const [trackerPeriodStart, setTrackerPeriodStart] = useState(()=>getLastHalfHourDate());

  /* Persistence */
  usePersist("hf_theme",     theme);
  usePersist("hf_history",   history);
  usePersist("hf_tracker",   trackerEntries);
  usePersist("hf_mits",      mits);
  usePersist("hf_practices", practiceLog);
  usePersist("hf_purpose",   purpose);
  usePersist("hf_rituals",   rituals);
  usePersist("hf_breaks",    breaks);
  usePersist("hf_weekly",    weekly);
  usePersist("hf_trackerOn", trackerOn);
  usePersist("hf_goals",     goals);
  usePersist("hf_todos",     todos);
  usePersist("hf_skills",    skills);
  usePersist("hf_name",      name);

  /* Storage health — runs after the persistence effects above, every render */
  const [storageWarn, setStorageWarn] = useState(false);
  useEffect(()=>{ if(hasSaveFailed()&&!storageWarn) setStorageWarn(true); });

  /* Recovery — if localStorage came back empty but the IndexedDB mirror still
     holds sessions, offer to restore rather than silently starting from zero. */
  const [recovery, setRecovery] = useState(null);
  useEffect(()=>{
    if(history.length||trackerEntries.length||practiceLog.length) return;
    let cancelled=false;
    IDB.get("hf_history").then(h=>{
      if(!cancelled && Array.isArray(h) && h.length) setRecovery(h.length);
    });
    return ()=>{ cancelled=true; };
  },[]);
  const restoreFromMirror = async () => {
    const [h,t,m,p,pu,r,b,w,g,td,sk,nm]=await Promise.all(DATA_KEYS.map(k=>IDB.get(k)));
    if(Array.isArray(h)) setHistory(h);
    if(Array.isArray(t)) setTrackerEntries(t);
    if(m&&typeof m==="object") setMits(m);
    if(Array.isArray(p)) setPracticeLog(p);
    if(pu&&typeof pu==="object") setPurpose(prev=>({...prev,...pu}));
    if(r&&typeof r==="object") setRituals(r);
    if(Array.isArray(b)) setBreaks(b);
    if(w&&typeof w==="object") setWeekly(w);
    if(Array.isArray(g)) setGoals(g);
    if(Array.isArray(td)) setTodos(td);
    if(Array.isArray(sk)) setSkills(sk);
    if(typeof nm==="string") setName(nm);
    setRecovery(null);
  };

  /* Theme */
  useEffect(()=>{ document.documentElement.setAttribute("data-theme",theme); },[theme]);

  /* Sound engine */
  useEffect(()=>{ if(sound) SoundEngine.play(sound); else SoundEngine.stop(); },[sound]);

  /* Keep phaseRef always current — used in callbacks/effects that can't take phase as dep */
  useEffect(()=>{ phaseRef.current=phase; },[phase]);
  useEffect(()=>{ taskRef.current=task; },[task]);
  useEffect(()=>{ trackerOnRef.current=trackerOn; },[trackerOn]);
  useEffect(()=>{ periodStartRef.current=trackerPeriodStart; },[trackerPeriodStart]);

  /* Request notification permission once on mount */
  useEffect(()=>{
    if("Notification" in window && Notification.permission==="default") Notification.requestPermission();
  },[]);

  /* Focus / break timer — wall-clock based so background throttling can't drift it */
  useEffect(()=>{
    if(phase!=="focusing"&&phase!=="break") return;
    const tick=setInterval(()=>{
      if(phaseRef.current==="focusing"){
        setSession(s=>{
          const elapsed=focusElapsedRef.current+Math.floor((Date.now()-focusTsRef.current)/1000);
          const rem=Math.max(0,s.total-elapsed);
          return rem===s.remaining?s:{...s,remaining:rem};
        });
      } else if(phaseRef.current==="break"){
        setBreakRem(()=>Math.max(0,breakTotalRef.current-Math.floor((Date.now()-breakTsRef.current)/1000)));
      }
    },500); // 500ms so we recover immediately when tab is refocused
    return ()=>clearInterval(tick);
  },[phase]);

  /* Session complete */
  useEffect(()=>{
    if(phase==="focusing"&&session.remaining===0){
      playChime();
      sendNotif("Hyper Focus · Session complete", task||"Session finished. Time for a break.");
      const id=Date.now();
      lastSessionIdRef.current=id;
      setLastDur(session.total);
      setHistory(h=>[...h,{id,startTime:sessionStartRef.current||nowTime(),time:nowTime(),date:new Date().toISOString(),task:task||"Untitled session.",mode:session.mode,dur:session.total,goalId:activeGoalId,kind}]);
      setPhase("complete");
    }
  },[session.remaining,phase]);

  /* Break complete */
  useEffect(()=>{
    if(phase==="break"&&breakRem===0){
      playChime();
      sendNotif("Hyper Focus · Break over","Ready for your next session.");
      // Log the break so its kind can later be correlated with the next session
      const bid=Date.now();
      setBreaks(bs=>[...bs,{id:bid,date:new Date().toISOString(),dur:breakTotalRef.current,type:null}]);
      setRestAsk({id:bid});
      setSession(s=>({...s,remaining:s.total,index:s.index+1}));
      setQuote(randQuote());
      setPhase("idle");
    }
  },[breakRem,phase]);

  /* Tracker tick — wall-clock based, fires OS notification when :00/:30 is reached.
     Two exceptions, both deliberate:
     - tracker switched off in Settings → the mark passes silently
     - a focus session is running → the block is logged automatically under the
       session's task. Interrupting deep work to ask what you're doing is the one
       thing this app must never do. */
  const doTrackerCheck = () => {
    const secs=Math.max(0,Math.round((trackerTargetRef.current-Date.now())/1000));
    setTrackerCountdown(secs);
    if(secs===0&&!trackerFiredRef.current){
      trackerFiredRef.current=true;
      trackerTargetRef.current=getNextHalfHourMs();
      setTimeout(()=>{ trackerFiredRef.current=false; },4000);
      if(!trackerOnRef.current){
        setTrackerPeriodStart(new Date());
      } else if(phaseRef.current==="focusing"||phaseRef.current==="break"){
        // Attribute the block to the running session — silently.
        const now=new Date(), start=periodStartRef.current||getLastHalfHourDate();
        const label=phaseRef.current==="break" ? "Break" : `Focus — ${taskRef.current||"untitled session"}`;
        setTrackerEntries(es=>[...es,{
          id:Date.now(), startTime:formatHHMM(start), endTime:formatHHMM(now),
          date:now.toISOString(), duration:Math.max(1,Math.round((now-start)/60000)), text:label,
        }]);
        setTrackerPeriodStart(now);
      } else {
        setTrackerPrompt(true);
        playChime();
        sendNotif("Hyper Focus · Check-in","What have you been working on?");
      }
    }
  };
  const doTrackerCheckRef = useRef(doTrackerCheck);
  doTrackerCheckRef.current = doTrackerCheck;
  useEffect(()=>{
    const doCheck=()=>doTrackerCheckRef.current();
    doCheck(); // check immediately in case page was hidden when it fired
    const t=setInterval(doCheck,1000);
    return ()=>clearInterval(t);
  },[]);

  /* Visibility change — recalculate all timers the instant the tab becomes active */
  useEffect(()=>{
    const onVis=()=>{
      if(document.hidden) return;
      // Focus timer catch-up
      if(phaseRef.current==="focusing"){
        setSession(s=>{
          const elapsed=focusElapsedRef.current+Math.floor((Date.now()-focusTsRef.current)/1000);
          return {...s,remaining:Math.max(0,s.total-elapsed)};
        });
      }
      // Break timer catch-up
      if(phaseRef.current==="break"){
        setBreakRem(Math.max(0,breakTotalRef.current-Math.floor((Date.now()-breakTsRef.current)/1000)));
      }
      // Tracker catch-up — same logic as the interval tick
      doTrackerCheckRef.current();
    };
    document.addEventListener("visibilitychange",onVis);
    return ()=>document.removeEventListener("visibilitychange",onVis);
  },[]);

  /* Document title */
  useEffect(()=>{
    if     (phase==="focusing") document.title=`${fmt(session.remaining)} · Hyper Focus`;
    else if(phase==="break")    document.title=`Break ${fmt(breakRem)} · Hyper Focus`;
    else if(phase==="complete") document.title=`Done · Hyper Focus`;
    else                        document.title="Hyper Focus";
  },[phase,session.remaining,breakRem]);

  /* Global keys */
  useEffect(()=>{
    const onKey=e=>{
      if((e.metaKey||e.ctrlKey)&&e.key==="k"){e.preventDefault();setCmdk(v=>!v);return;}
      if(e.key==="Escape"){setCmdk(false);setMenuOpen(false);return;}
      if(e.key===" "&&!["INPUT","TEXTAREA","SELECT"].includes(e.target.tagName)){
        e.preventDefault();
        if(view==="session"){
          // Must go through onBegin/onPause — setting phase directly leaves the
          // wall-clock refs unset and the session completes instantly.
          if     (phase==="idle")     onBegin();
          else if(phase==="focusing") onPause();
        }
      }
    };
    window.addEventListener("keydown",onKey);
    return ()=>window.removeEventListener("keydown",onKey);
  },[phase,view]);

  const onBegin = () => {
    // elapsed before this period = total − current remaining (handles resume after pause)
    focusElapsedRef.current = session.total - session.remaining;
    focusTsRef.current = Date.now();
    sessionStartRef.current = nowTime();
    setPhase("focusing");
  };
  const onPause = () => {
    // freeze elapsed so the resume can pick up exactly where we left off
    focusElapsedRef.current += Math.floor((Date.now()-focusTsRef.current)/1000);
    setPhase("idle");
  };
  const onEnd = () => {
    // Compute how many seconds were actually focused
    // If phase==="focusing" we're mid-period; if "idle" (paused) elapsed is already accumulated
    const elapsed = phase==="focusing"
      ? focusElapsedRef.current + Math.floor((Date.now()-focusTsRef.current)/1000)
      : focusElapsedRef.current;
    focusElapsedRef.current=0; focusTsRef.current=0;
    setSession(s=>({...s,remaining:s.total}));
    if(elapsed>=60){
      // Save with real elapsed duration and show the complete/rating screen
      const id=Date.now();
      lastSessionIdRef.current=id;
      setLastDur(elapsed);
      setHistory(h=>[...h,{
        id,
        startTime: sessionStartRef.current||nowTime(),
        time:      nowTime(),
        date:      new Date().toISOString(),
        task:      task||"Untitled session.",
        mode:      session.mode,
        dur:       elapsed,
        goalId:    activeGoalId,
        kind,
      }]);
      setPhase("complete");
    } else {
      // Too short to be worth saving (accidental click)
      setPhase("idle");
    }
  };
  const onStartBreak = () => {
    const mode=MODES.find(m=>m.id===session.mode);
    const dur=mode?.breakDur||5*60;
    breakTotalRef.current=dur; breakTsRef.current=Date.now();
    setBreakRem(dur); setPhase("break");
  };
  const onNewSession = () => {
    focusElapsedRef.current=0; focusTsRef.current=0;
    setSession(s=>({...s,remaining:s.total,index:s.index+1}));
    setQuote(randQuote()); setPhase("idle");
  };
  const onBreathe       = (mins) => { setBreathDuration(mins*60); setView("breath"); };
  // Rate by id, not by position — deleting a row in Today must not shift the target
  const rateSession     = (q)    => { const id=lastSessionIdRef.current; if(id==null) return; setHistory(h=>h.map(s=>s.id===id?{...s,quality:q}:s)); };
  const onMitClick      = (text) => { setTask(text); };
  const onRenameSession = (id,newTask) => { setHistory(h=>h.map(s=>s.id===id?{...s,task:newTask}:s)); };
  const onDeleteSession = (id) => { setHistory(h=>h.filter(s=>s.id!==id)); };
  const onAdd5min       = ()     => { setSession(s=>({...s,total:s.total+300,remaining:s.remaining+300})); };
  const onLogPractice   = (entry)=> { setPracticeLog(l=>[...l,entry]); };
  const classifyRest    = (type) => {
    const id=restAsk?.id; if(id==null) return;
    setBreaks(bs=>bs.map(b=>b.id===id?{...b,type}:b));
    setRestAsk(null);
  };
  const onManualEntry   = (text, slotStart, slotEnd) => {
    setTrackerEntries(es=>[...es,{
      id:        Date.now(),
      startTime: formatHHMM(slotStart),
      endTime:   formatHHMM(slotEnd),
      date:      slotEnd.toISOString(),
      duration:  30,
      text,
    }]);
  };

  const logEntry = (text) => {
    const now = new Date();
    setTrackerEntries(es=>[...es,{
      id:        Date.now(),
      startTime: formatHHMM(trackerPeriodStart),
      endTime:   formatHHMM(now),
      date:      now.toISOString(),
      duration:  Math.round((now-trackerPeriodStart)/60000),
      text,
    }]);
    setTrackerPeriodStart(new Date());
    trackerTargetRef.current = getNextHalfHourMs(); // re-align to the true next :00/:30
    setTrackerPrompt(false);
  };

  const exportData = () => {
    const data={version:4,history,trackerEntries,mits,practiceLog,purpose,rituals,breaks,weekly,goals,todos,skills,name,exportedAt:new Date().toISOString()};
    const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");
    a.href=url; a.download=`hyperfocus-${todayStr()}.json`; a.click();
    URL.revokeObjectURL(url);
    saveLS("hf_lastExport", Date.now());
    setLastExport(Date.now());
  };
  const clearData = () => {
    setHistory([]); setTrackerEntries([]); setMits({}); setPracticeLog([]); setRituals({}); setBreaks([]); setWeekly({});
    setGoals([]); setTodos([]); setSkills([]);
    saveLS("hf_history",[]); saveLS("hf_tracker",[]); saveLS("hf_mits",{}); saveLS("hf_practices",[]);
    saveLS("hf_rituals",{}); saveLS("hf_breaks",[]); saveLS("hf_weekly",{});
    saveLS("hf_goals",[]); saveLS("hf_todos",[]); saveLS("hf_skills",[]);
    // Purpose is deliberately preserved — clearing your logs should never
    // erase your North Star. Delete it by hand on the Purpose page.
  };

  /* Import — merges a previously exported file. Sessions and tracker entries are
     de-duplicated by id so importing the same backup twice is harmless. */
  const importData = (file) => new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=()=>{
      try {
        const d=JSON.parse(reader.result);
        if(!d || typeof d!=="object") throw new Error("Not a Hyper Focus export.");
        const mergeById=(a,b)=>{
          const seen=new Map();
          [...(a||[]),...(b||[])].forEach(x=>{ if(x&&x.id!=null) seen.set(x.id,x); });
          return [...seen.values()].sort((x,y)=>new Date(x.date||0)-new Date(y.date||0));
        };
        const added=mergeById(history,d.history).length-history.length;
        setHistory(h=>mergeById(h,d.history));
        setTrackerEntries(t=>mergeById(t,d.trackerEntries));
        setPracticeLog(p=>mergeById(p,d.practiceLog));
        if(d.mits && typeof d.mits==="object") setMits(m=>({...m,...d.mits}));
        if(d.rituals && typeof d.rituals==="object") setRituals(r=>({...r,...d.rituals}));
        if(Array.isArray(d.breaks)) setBreaks(b=>mergeById(b,d.breaks));
        if(d.weekly && typeof d.weekly==="object") setWeekly(w=>({...w,...d.weekly}));
        if(d.purpose && typeof d.purpose==="object") setPurpose(p=>({
          ...p, ...d.purpose,
          goals: mergeById(p.goals, d.purpose.goals),
        }));
        resolve(`Imported. ${added} new session${added===1?"":"s"} added.`);
      } catch(e){ reject(new Error("Could not read that file — is it a Hyper Focus export?")); }
    };
    reader.onerror=()=>reject(new Error("Could not read that file."));
    reader.readAsText(file);
  });

  const cmdAction = id => {
    if     (id==="begin")   { setView("session"); onBegin(); }
    else if(id==="pause")   { if(phase==="focusing") onPause(); }
    else if(id==="breath")  { setView("breath"); }
    else if(id==="preload") { setView("preload"); }
    else if(id==="lognow")  { setTrackerPrompt(true); }
    else if(["dashboard","day","week","purpose","today","stats","sounds","planning","stoic","tracker","goals","todos","skills","practices"].includes(id)) setView(id);
  };

  const sendTodoToMit = (text) => {
    setMits(m=>{
      const today2=todayStr();
      const todayPlan=m[today2]||{tasks:["","",""],done:[false,false,false]};
      const emptyIdx=todayPlan.tasks.findIndex(x=>!x);
      if(emptyIdx<0) return m;
      const newTasks=[...todayPlan.tasks]; newTasks[emptyIdx]=text;
      return {...m,[today2]:{...todayPlan,tasks:newTasks}};
    });
    setView("planning");
  };

  const today       = todayStr();
  const todayHistory = history.filter(s=>s.date&&localDate(new Date(s.date))===today);
  const todayTracker = trackerEntries.filter(e=>e.date&&localDate(new Date(e.date))===today);
  const todayMit     = mits[today] || {tasks:["","",""],done:[false,false,false]};

  const crumbs=({dashboard:"Dashboard",day:"The Day",week:"The Week",purpose:"Purpose",session:"Session",today:"Today",stats:"Stats",sounds:"Soundscapes",planning:"Planning",stoic:"Stoicism",practices:"Daily Practices",settings:"Settings",breath:"Begin",preload:"Preload",tracker:"Tracker",goals:"Goals",todos:"To-do",skills:"Skills"})[view];
  const section=view==="dashboard"?"Command":["purpose","day","week"].includes(view)?"Compass":["sounds","planning","stoic","practices"].includes(view)?"Practice":["goals","todos","skills"].includes(view)?"Build":"Focus";
  const crumbArr=view==="settings"?["Settings"]:view==="dashboard"?["Dashboard"]:[section,crumbs];
  const soundLabel=sound?({rain:"Soft rain",forest:"Old forest",waves:"Shoreline",cafe:"Quiet café",brown:"Brown noise",fire:"Fireplace"})[sound]:null;

  return (
    <div className="app">
      <Rail current={view} onNav={v=>{ setView(v); setMenuOpen(false); }} sounds={soundLabel} theme={theme} northStar={purpose.northStar} open={menuOpen}/>
      {menuOpen && <div className="rail-backdrop" onClick={()=>setMenuOpen(false)}/>}
      <main className="canvas">
        <Topbar crumbs={crumbArr} onCmdk={()=>setCmdk(true)} onTheme={()=>setTheme(t=>t==="light"?"dark":"light")} theme={theme} running={phase==="focusing"} timeStr={fmt(session.remaining)} onMenu={()=>setMenuOpen(true)}
          closePrompt={view!=="day"&&new Date().getHours()>=19&&!rituals[today]?.closedAt}
          onClosePrompt={()=>setView("day")}/>

        {recovery && (
          <div className="page" style={{paddingBottom:0}}>
            <div className="warn-banner" style={{background:"var(--hf-sand-50)",borderColor:"var(--hf-sand-300)",color:"var(--hf-sand-700)"}}>
              This browser's storage looks empty, but a local backup with <b>{recovery} sessions</b> is still here.
              <div style={{display:"flex",gap:8,marginTop:12}}>
                <button className="btn btn--primary" onClick={restoreFromMirror}>Restore it</button>
                <button className="btn btn--ghost" onClick={()=>setRecovery(null)}>Start fresh</button>
              </div>
            </div>
          </div>
        )}

        {storageWarn && (
          <div className="page" style={{paddingBottom:0}}>
            <div className="warn-banner">
              This browser refused to save — recent changes may be lost when you close the app.
              Private/incognito mode or a full storage quota are the usual causes. Export your data from Settings now.
            </div>
          </div>
        )}

        {view==="dashboard" && <Dashboard history={history} mits={mits} goals={goals} todos={todos} practiceLog={practiceLog} skills={skills} name={name}/>}
        {view==="session"  && <Session session={session} setSession={setSession} task={task} setTask={setTask} phase={phase} onBegin={onBegin} onPause={onPause} onEnd={onEnd} onAdd5min={onAdd5min} onStartBreak={onStartBreak} onNewSession={onNewSession} breakRemaining={breakRem} quote={quote} mits={todayMit} onBreathe={onBreathe} onRate={rateSession} onMitClick={onMitClick} northStar={purpose.northStar} activeGoal={activeGoal} onOpenPurpose={()=>setView("purpose")}
                                lastDur={lastDur} streak={calcStreak(history)} todaySecs={todayHistory.reduce((a,s)=>a+(s.dur||0),0)}
                                goalHours={activeGoalId?history.reduce((a,s)=>a+(s.goalId===activeGoalId?(s.dur||0):0),0)/3600:0}
                                protocols={purpose.protocols} kind={kind} setKind={setKind} onPreload={(mins)=>{ setPreloadDuration(mins*60); setView("preload"); }}/>}
        {view==="today"    && <Today sessions={todayHistory} streak={calcStreak(history)} onStart={()=>setView("session")} onRename={onRenameSession} onDelete={onDeleteSession}/>}
        {view==="stats"    && <Stats sessions={history} purpose={purpose} breaks={breaks}/>}
        {view==="tracker"  && <Tracker entries={todayTracker} countdown={trackerCountdown} enabled={trackerOn} onLogNow={()=>setTrackerPrompt(true)} onNewEntry={()=>setManualEntry(true)}/>}
        {view==="goals"    && <GoalsView goals={goals} setGoals={setGoals}/>}
        {view==="todos"    && <TodoView todos={todos} setTodos={setTodos} onSendToMit={sendTodoToMit}/>}
        {view==="planning" && <Planning mits={mits} setMits={setMits}/>}
        {view==="skills"   && <SkillsView skills={skills} setSkills={setSkills}/>}
        {view==="sounds"   && <Soundscapes active={sound} setActive={setSound}/>}
        {view==="practices" && <DailyPractices practiceLog={practiceLog} onLogPractice={onLogPractice}/>}
        {view==="stoic"     && <Stoic/>}
        {view==="breath"    && <Breath duration={breathDuration} onDone={()=>{ setView("session"); onBegin(); }}/>}
        {view==="preload"   && <Preload duration={preloadDuration} onDone={()=>setView("session")}/>}
        {view==="day"      && <TheDay rituals={rituals} setRituals={setRituals} purpose={purpose} mits={mits} setMits={setMits}
                                sessions={todayHistory} practiceLog={practiceLog} breaks={breaks} streak={calcStreak(history)} onEnterDay={()=>setView("session")}/>}
        {view==="week"     && <TheWeek weekly={weekly} setWeekly={setWeekly} purpose={purpose} sessions={history} rituals={rituals} breaks={breaks}/>}
        {view==="purpose"  && <Purpose purpose={purpose} setPurpose={setPurpose} sessions={history}/>}
        {view==="settings" && <Settings theme={theme} setTheme={setTheme} onExport={exportData} onImport={importData} onClearData={clearData} name={name} setName={setName}
                                lastExport={lastExport} hasData={history.length>0} trackerOn={trackerOn} setTrackerOn={setTrackerOn}/>}
      </main>
      {restAsk && (
        <div className="tracker-toast">
          <div className="tracker-toast__header">
            <span className="tracker-toast__label">That break</span>
            <button className="iconbtn" onClick={()=>setRestAsk(null)} aria-label="Dismiss"><Icon name="x" size={14}/></button>
          </div>
          <div style={{fontSize:14,lineHeight:1.6,color:"var(--hf-fg-body)"}}>
            Was there input coming in, or not? That — not whether it was pleasant — is what decides
            whether your nervous system actually recovered.
          </div>
          <div className="tracker-toast__actions">
            <button className="btn btn--primary" onClick={()=>classifyRest("real")}>No input — real rest</button>
            <button className="btn btn--secondary" onClick={()=>classifyRest("degenerate")}>Screens, feeds, noise</button>
          </div>
        </div>
      )}
      {trackerPrompt && <TrackerPrompt onSave={logEntry} onSkip={()=>setTrackerPrompt(false)} periodStart={trackerPeriodStart}/>}
      {manualEntry && <TrackerManualEntry onSave={(text,s,e)=>{ onManualEntry(text,s,e); setManualEntry(false); }} onClose={()=>setManualEntry(false)}/>}
      {cmdk && <CmdK onClose={()=>setCmdk(false)} onAction={cmdAction}/>}
    </div>
  );
};

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
