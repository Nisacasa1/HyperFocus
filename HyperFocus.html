/* ── Daily Practices ── */
const DailyPractices = ({ practiceLog, onLogPractice }) => {
  const R=46, CIRC=2*Math.PI*R;
  const [timerPhase, setTimerPhase] = useState("idle"); // idle | running | complete
  const [activePractice, setActivePractice] = useState(null);
  const [remaining, setRemaining] = useState(0);

  const timerTsRef      = useRef(0);
  const timerTotalRef   = useRef(0);
  const timerElapsedRef = useRef(0);
  const timerPhaseRef   = useRef("idle");

  useEffect(()=>{ timerPhaseRef.current=timerPhase; },[timerPhase]);

  // Wall-clock timer tick
  useEffect(()=>{
    if(timerPhase!=="running") return;
    const tick=setInterval(()=>{
      const elapsed=timerElapsedRef.current+Math.floor((Date.now()-timerTsRef.current)/1000);
      setRemaining(Math.max(0,timerTotalRef.current-elapsed));
    },500);
    return ()=>clearInterval(tick);
  },[timerPhase]);

  // Visibility change catch-up
  useEffect(()=>{
    const onVis=()=>{
      if(document.hidden||timerPhaseRef.current!=="running") return;
      const elapsed=timerElapsedRef.current+Math.floor((Date.now()-timerTsRef.current)/1000);
      setRemaining(Math.max(0,timerTotalRef.current-elapsed));
    };
    document.addEventListener("visibilitychange",onVis);
    return ()=>document.removeEventListener("visibilitychange",onVis);
  },[]);

  // Practice complete
  useEffect(()=>{
    if(timerPhase==="running"&&remaining===0&&activePractice){
      const pr=PRACTICES.find(p=>p.id===activePractice);
      playChime();
      onLogPractice({ id:Date.now(), practiceId:activePractice, name:pr.name, date:new Date().toISOString(), duration:timerTotalRef.current });
      setTimerPhase("complete");
    }
  },[remaining,timerPhase]);

  const beginPractice=(pr)=>{
    timerTotalRef.current=pr.duration;
    timerTsRef.current=Date.now();
    timerElapsedRef.current=0;
    setRemaining(pr.duration);
    setActivePractice(pr.id);
    setTimerPhase("running");
  };
  const cancelTimer=()=>{ setTimerPhase("idle"); setActivePractice(null); setRemaining(0); };
  const pledgePractice=(pr)=>{
    onLogPractice({ id:Date.now(), practiceId:pr.id, name:pr.name, date:new Date().toISOString(), duration:null });
  };

  const today=todayStr();
  const todayLog=practiceLog.filter(e=>e.date&&localDate(new Date(e.date))===today);
  const doneIds=new Set(todayLog.map(e=>e.practiceId));

  // Timer stage
  if(timerPhase==="running"||timerPhase==="complete"){
    const pr=PRACTICES.find(p=>p.id===activePractice);
    const pct=timerTotalRef.current>0?(timerTotalRef.current-remaining)/timerTotalRef.current:1;
    const offset=CIRC*(1-pct);
    return (
      <div className="focus-stage">
        <div className="dp-timer__name">{pr.name}</div>
        <div className="dp-timer__desc">{pr.instruction}</div>
        <div className="ring ring--dp">
          <svg viewBox="0 0 100 100">
            <circle className="ring__bg" cx="50" cy="50" r={R}/>
            <circle className="ring__fg" cx="50" cy="50" r={R} strokeDasharray={CIRC} strokeDashoffset={offset}/>
          </svg>
          <div className="ring__inner">
            <div className="ring__timer" style={{fontSize:76}}>{fmt(remaining)}</div>
            <div className="ring__label">{timerPhase==="complete"?"Complete":"Practice"}</div>
          </div>
        </div>
        {timerPhase==="complete"?(
          <div style={{textAlign:"center",display:"flex",flexDirection:"column",alignItems:"center",gap:10}}>
            <div style={{fontSize:13,color:"var(--hf-fg-muted)"}}>Practice recorded for today.</div>
            <button className="btn btn--primary btn--lg" onClick={cancelTimer}><Icon name="check" size={14}/> Done</button>
          </div>
        ):(
          <div style={{display:"flex",gap:10}}>
            <button className="btn btn--ghost btn--lg" onClick={cancelTimer}><Icon name="x" size={14}/> Cancel</button>
          </div>
        )}
      </div>
    );
  }

  // Grouped history (last 14 days, excluding today)
  const historyLog=[...practiceLog].filter(e=>e.date&&localDate(new Date(e.date))!==today).sort((a,b)=>b.date.localeCompare(a.date));
  const histByDay={};
  historyLog.forEach(e=>{
    const d=localDate(new Date(e.date));
    if(!histByDay[d]) histByDay[d]=[];
    histByDay[d].push(e);
  });
  const histDays=Object.keys(histByDay).sort((a,b)=>b.localeCompare(a)).slice(0,7);

  return (
    <div className="page">
      <div style={{marginBottom:32}}>
        <div className="eyebrow">Practice</div>
        <h1 className="h-serif" style={{fontSize:44,margin:"8px 0 0"}}>Daily Practices</h1>
        <p style={{color:"var(--hf-fg-muted)",fontSize:13,marginTop:8,lineHeight:1.6}}>Stoic exercises made actionable. One session at a time.</p>
      </div>

      <div className="dp-grid">
        {PRACTICES.map(pr=>{
          const done=doneIds.has(pr.id);
          return (
            <div key={pr.id} className={"dp-card"+(done?" dp-card--done":"")}>
              <div className="dp-card__head">
                <div>
                  <div className="dp-card__name">{pr.name}</div>
                  <div className="dp-card__time">{pr.time}</div>
                </div>
                <Icon name={pr.icon} size={16}/>
              </div>
              <div className="dp-card__desc">{pr.desc}</div>
              {done?(
                <span className="badge badge--success"><span className="dot"/>Done today</span>
              ):pr.duration?(
                <button className="btn btn--primary" onClick={()=>beginPractice(pr)}>
                  <Icon name="play" size={14}/> Begin · {Math.floor(pr.duration/60)} min
                </button>
              ):(
                <button className="btn btn--secondary" onClick={()=>pledgePractice(pr)}>
                  <Icon name="check" size={14}/> Pledge for today
                </button>
              )}
            </div>
          );
        })}
      </div>

      {todayLog.length>0&&(
        <>
          <h2 className="h-serif" style={{fontSize:22,margin:"0 0 14px"}}>Completed today</h2>
          <div style={{marginBottom:32}}>
            {todayLog.map((e,i)=>(
              <div key={i} className="dp-log-entry">
                <span className="dp-log-entry__check"><Icon name="check" size={14}/></span>
                <span className="dp-log-entry__name">{e.name}</span>
                {e.duration&&<span className="dp-log-entry__dur">{fmtDur(e.duration)}</span>}
                <span className="dp-log-entry__time">{new Date(e.date).toLocaleTimeString("en-US",{hour:"2-digit",minute:"2-digit",hour12:false})}</span>
              </div>
            ))}
          </div>
        </>
      )}

      {histDays.length>0&&(
        <>
          <h2 className="h-serif" style={{fontSize:22,margin:"0 0 14px"}}>Recent history</h2>
          {histDays.map(d=>(
            <div key={d} style={{marginBottom:20}}>
              <div style={{fontSize:11,letterSpacing:".1em",textTransform:"uppercase",color:"var(--hf-fg-muted)",fontWeight:500,marginBottom:8}}>
                {new Date(d+"T12:00:00").toLocaleDateString("en-US",{weekday:"short",month:"short",day:"numeric"})}
              </div>
              {histByDay[d].map((e,i)=>(
                <div key={i} className="dp-log-entry">
                  <span className="dp-log-entry__check"><Icon name="check" size={14}/></span>
                  <span className="dp-log-entry__name">{e.name}</span>
                  {e.duration&&<span className="dp-log-entry__dur">{fmtDur(e.duration)}</span>}
                  <span className="dp-log-entry__time">{new Date(e.date).toLocaleTimeString("en-US",{hour:"2-digit",minute:"2-digit",hour12:false})}</span>
                </div>
              ))}
            </div>
          ))}
        </>
      )}

      {practiceLog.length===0&&todayLog.length===0&&(
        <div style={{color:"var(--hf-fg-muted)",fontSize:14,fontStyle:"italic",paddingTop:8}}>No practices recorded yet. Begin one above.</div>
      )}
    </div>
  );
};

/* ── Dashboard ── */
const Dashboard = ({ history, mits, goals, todos, practiceLog, skills, name }) => {
  const today = todayStr();
  const dayOfYear = Math.floor((new Date()-new Date(new Date().getFullYear(),0,0))/86400000);
  const dailyQuote = STOIC_QUOTES[dayOfYear%STOIC_QUOTES.length];
  const hour = new Date().getHours();
  const greeting = hour<12?"Good morning":hour<17?"Good afternoon":"Good evening";

  const todayHistory = history.filter(s=>s.date&&localDate(new Date(s.date))===today);
  const todayMit = mits[today]||{tasks:["","",""],done:[false,false,false]};
  const todayFocusSecs = todayHistory.reduce((a,s)=>a+s.dur,0);

  const focusStreak    = calcStreak(history);
  const practiceStreak = calcPracticeStreak(practiceLog);

  const last7 = Array.from({length:7},(_,i)=>{ const d=new Date(); d.setDate(d.getDate()-6+i); return localDate(d); });
  const focusDays    = new Set(history.filter(s=>s.date).map(s=>localDate(new Date(s.date))));
  const practiceDays = new Set(practiceLog.filter(e=>e.date).map(e=>localDate(new Date(e.date))));

  const activeGoals   = goals.filter(g=>g.status!=="done").slice(0,3);
  const dueTodayTodos = todos.filter(t=>!t.done&&t.dueDate===today);
  const topSkills     = skills.slice(0,4);


  const ws = getWeekStart();
  const wsDate = new Date(ws+"T00:00:00");
  const days = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
  const todayDayIdx = (new Date().getDay()+6)%7;
  const weekMins = Array(7).fill(0);
  history.filter(s=>s.date&&localDate(new Date(s.date))>=ws).forEach(s=>{
    const diff=Math.floor((new Date(localDate(new Date(s.date))+"T00:00:00")-wsDate)/86400000);
    if(diff>=0&&diff<7) weekMins[diff]+=Math.floor(s.dur/60);
  });
  const maxMins = Math.max(...weekMins,1);

  return (
    <div className="page">
      <div style={{marginBottom:32}}>
        <div className="eyebrow">Overview</div>
        <h1 className="h-serif" style={{fontSize:44,margin:"8px 0 0"}}>{greeting}{name?`, ${name}`:""}</h1>
      </div>
      <div className="dash-grid">

        {/* Today's Focus */}
        <div className="dash-widget">
          <div className="dash-widget__label">Today's focus</div>
          <div style={{fontFamily:"var(--hf-font-mono)",fontSize:36,fontWeight:300,letterSpacing:"-0.02em",lineHeight:1}}>
            {todayFocusSecs?fmtDur(todayFocusSecs):<span style={{color:"var(--hf-fg-subtle)"}}>—</span>}
          </div>
          <div style={{fontSize:12,color:"var(--hf-fg-muted)",marginTop:5}}>{todayHistory.length} session{todayHistory.length!==1?"s":""}</div>
          {todayMit.tasks.some(t=>t)&&(
            <div style={{marginTop:14,display:"flex",flexDirection:"column",gap:6}}>
              {todayMit.tasks.map((t,i)=>t?(
                <div key={i} style={{display:"flex",alignItems:"center",gap:8,fontSize:12,color:todayMit.done[i]?"var(--hf-fg-subtle)":"var(--hf-fg-body)"}}>
                  <div style={{width:6,height:6,borderRadius:"50%",background:todayMit.done[i]?"var(--hf-fg-subtle)":"var(--hf-sand-400)",flexShrink:0}}/>
                  <span style={{textDecoration:todayMit.done[i]?"line-through":"none"}}>{t}</span>
                </div>
              ):null)}
            </div>
          )}
        </div>

        {/* Streaks */}
        <div className="dash-widget">
          <div className="dash-widget__label">Streaks · last 7 days</div>
          <div style={{display:"flex",flexDirection:"column",gap:14}}>
            {[{label:"Focus",streak:focusStreak,days:focusDays},{label:"Practice",streak:practiceStreak,days:practiceDays}].map(({label,streak,days:ds})=>(
              <div key={label}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:4}}>
                  <span style={{fontSize:12,color:"var(--hf-fg-muted)"}}>{label}</span>
                  <span style={{fontFamily:"var(--hf-font-mono)",fontSize:12,color:streak>0?"var(--hf-fg)":"var(--hf-fg-subtle)"}}>{streak>0?`${streak}d streak`:"—"}</span>
                </div>
                <div className="streak-dots">{last7.map(d=><div key={d} className={"streak-dot"+(ds.has(d)?" streak-dot--on":"")}/>)}</div>
              </div>
            ))}
          </div>
        </div>

        {/* Active Goals */}
        <div className="dash-widget">
          <div className="dash-widget__label">Active goals</div>
          {activeGoals.length===0
            ?<div style={{fontSize:13,color:"var(--hf-fg-muted)",fontStyle:"italic"}}>No goals yet.</div>
            :activeGoals.map(g=>{
              const pct=g.targetValue>0?Math.min(100,(g.currentValue||0)/g.targetValue*100):0;
              return (
                <div key={g.id} className="goal-bar-row">
                  <div className="goal-bar-row__label">
                    <span style={{overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",maxWidth:"60%"}}>{g.title}</span>
                    <span style={{color:"var(--hf-fg-muted)",flexShrink:0}}>{g.currentValue||0}/{g.targetValue||"?"} {g.unit}</span>
                  </div>
                  <div className="goal-bar-track"><div className="goal-bar-fill" style={{width:`${pct}%`}}/></div>
                </div>
              );
            })
          }
        </div>

        {/* This Week */}
        <div className="dash-widget">
          <div className="dash-widget__label">This week</div>
          <div className="chart" style={{height:80}}>
            {weekMins.map((m,i)=>(
              <div key={i} className={"chart__bar"+(i===todayDayIdx?" chart__bar--today":i>todayDayIdx?" chart__bar--dim":"")} style={{height:`${(m/maxMins)*100}%`}}/>
            ))}
          </div>
          <div className="chart__labels">{days.map(d=><span key={d}>{d}</span>)}</div>
        </div>

        {/* Skills Snapshot */}
        {topSkills.length>0&&(
          <div className="dash-widget">
            <div className="dash-widget__label">Skills snapshot</div>
            <div style={{display:"flex",flexDirection:"column",gap:12}}>
              {topSkills.map(sk=>(
                <div key={sk.id} style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                  <span style={{fontSize:13,color:"var(--hf-fg-body)"}}>{sk.name}</span>
                  <div className="skill-level-dots">{[1,2,3,4,5].map(l=><div key={l} className={"skill-level-dot"+(l<=sk.level?" skill-level-dot--on":"")}/>)}</div>
                </div>
              ))}
            </div>
          </div>
        )}

        {/* Due today */}
        {dueTodayTodos.length>0&&(
          <div className="dash-widget">
            <div className="dash-widget__label">Due today ({dueTodayTodos.length})</div>
            <div style={{display:"flex",flexDirection:"column",gap:8}}>
              {dueTodayTodos.slice(0,5).map(t=>(
                <div key={t.id} style={{display:"flex",alignItems:"center",gap:8,fontSize:13,color:"var(--hf-fg-body)"}}>
                  <div className={"todo-row__priority todo-row__priority--"+(t.priority||"medium")}/>
                  <span style={{overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{t.text}</span>
                </div>
              ))}
            </div>
          </div>
        )}

        {/* Stoic of the day */}
        <div className="dash-widget">
          <div className="dash-widget__label">Stoic of the day</div>
          <div className="dash-stoic">"{dailyQuote.text}"<cite>— {dailyQuote.author}</cite></div>
        </div>

      </div>
    </div>
  );
};

/* ── Goals ── */
const GoalsView = ({ goals, setGoals }) => {
  const [filter,   setFilter]   = useState("all");
  const [showForm, setShowForm] = useState(false);
  const [expandId, setExpandId] = useState(null);
  const [form, setForm] = useState({title:"",area:"mind",description:"",targetValue:"",unit:"",targetDate:"",milestones:["","",""]});

  const areas = ["all","mind","body","work","spirit","other"];
  const filtered  = goals.filter(g=>g.status!=="done"&&(filter==="all"||g.area===filter));
  const completed = goals.filter(g=>g.status==="done");

  const addGoal = () => {
    if(!form.title.trim()) return;
    const ms=form.milestones.filter(m=>m.trim()).map(t=>({id:Date.now()+Math.random(),text:t.trim(),done:false}));
    setGoals(gs=>[...gs,{id:Date.now(),title:form.title.trim(),area:form.area,description:form.description,targetValue:Number(form.targetValue)||0,currentValue:0,unit:form.unit,targetDate:form.targetDate,createdAt:new Date().toISOString(),completedAt:null,status:"active",milestones:ms}]);
    setForm({title:"",area:"mind",description:"",targetValue:"",unit:"",targetDate:"",milestones:["","",""]});
    setShowForm(false);
  };

  const toggleMilestone=(goalId,msId)=>setGoals(gs=>gs.map(g=>g.id===goalId?{...g,milestones:g.milestones.map(m=>m.id===msId?{...m,done:!m.done}:m)}:g));
  const updateProgress =(goalId,val)=>setGoals(gs=>gs.map(g=>g.id===goalId?{...g,currentValue:Math.max(0,Number(val)||0)}:g));
  const markDone       =(goalId)   =>setGoals(gs=>gs.map(g=>g.id===goalId?{...g,status:"done",completedAt:new Date().toISOString()}:g));
  const deleteGoal     =(goalId)   =>setGoals(gs=>gs.filter(g=>g.id!==goalId));

  return (
    <div className="page">
      <div style={{marginBottom:32}}>
        <div className="eyebrow">Build</div>
        <h1 className="h-serif" style={{fontSize:44,margin:"8px 0 0"}}>Goals</h1>
        <p style={{color:"var(--hf-fg-muted)",fontSize:13,marginTop:8}}>What you're working toward. Focus on process, measure progress.</p>
      </div>

      <div style={{display:"flex",gap:6,marginBottom:20,flexWrap:"wrap",alignItems:"center"}}>
        {areas.map(a=>(
          <button key={a} className={"stats-period"+(filter===a?" stats-period--active":"")} onClick={()=>setFilter(a)} style={{textTransform:"capitalize"}}>
            {a==="all"?"All":a.charAt(0).toUpperCase()+a.slice(1)}
          </button>
        ))}
        <button className="btn btn--primary" style={{marginLeft:"auto"}} onClick={()=>setShowForm(v=>!v)}>
          <Icon name="plus" size={14}/> New goal
        </button>
      </div>

      {showForm&&(
        <div className="goal-form">
          <div><label className="goal-form__label">Title</label><input className="input" placeholder="What do you want to achieve?" value={form.title} onChange={e=>setForm(f=>({...f,title:e.target.value}))}/></div>
          <div className="goal-form__row">
            <div><label className="goal-form__label">Area</label>
              <select className="input" value={form.area} onChange={e=>setForm(f=>({...f,area:e.target.value}))}>
                {["mind","body","work","spirit","other"].map(a=><option key={a} value={a}>{a.charAt(0).toUpperCase()+a.slice(1)}</option>)}
              </select>
            </div>
            <div><label className="goal-form__label">Target date</label><input type="date" className="input" value={form.targetDate} onChange={e=>setForm(f=>({...f,targetDate:e.target.value}))}/></div>
          </div>
          <div className="goal-form__row">
            <div><label className="goal-form__label">Target value</label><input type="number" className="input" placeholder="e.g. 24" value={form.targetValue} onChange={e=>setForm(f=>({...f,targetValue:e.target.value}))}/></div>
            <div><label className="goal-form__label">Unit</label><input className="input" placeholder="e.g. books, kg, sessions" value={form.unit} onChange={e=>setForm(f=>({...f,unit:e.target.value}))}/></div>
          </div>
          <div><label className="goal-form__label">Description (optional)</label><textarea className="journal-textarea" style={{minHeight:60}} placeholder="Why does this matter?" value={form.description} onChange={e=>setForm(f=>({...f,description:e.target.value}))}/></div>
          <div>
            <label className="goal-form__label">Milestones (optional)</label>
            {form.milestones.map((m,i)=>(
              <input key={i} className="input" style={{marginBottom:8}} placeholder={`Milestone ${i+1}`} value={m} onChange={e=>setForm(f=>({...f,milestones:f.milestones.map((x,j)=>j===i?e.target.value:x)}))}/>
            ))}
          </div>
          <div style={{display:"flex",gap:8}}>
            <button className="btn btn--primary" onClick={addGoal} disabled={!form.title.trim()}>Add goal</button>
            <button className="btn btn--ghost" onClick={()=>setShowForm(false)}>Cancel</button>
          </div>
        </div>
      )}

      <div className="goals-grid">
        {filtered.map(g=>{
          const pct=g.targetValue>0?Math.min(100,(g.currentValue||0)/g.targetValue*100):0;
          const open=expandId===g.id;
          return (
            <div key={g.id} className="goal-card" onClick={()=>setExpandId(open?null:g.id)}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
                <span className={"goal-card__area goal-card__area--"+g.area}>{g.area}</span>
                <button className="iconbtn btn--danger" style={{opacity:0.5,zIndex:1}} title="Delete" onClick={e=>{e.stopPropagation();deleteGoal(g.id);}}><Icon name="x" size={12}/></button>
              </div>
              <div className="goal-card__title">{g.title}</div>
              {g.targetValue>0&&(
                <div className="goal-card__progress">
                  <div className="goal-card__progress-label"><span>Progress</span><span>{g.currentValue||0}/{g.targetValue} {g.unit}</span></div>
                  <div className="goal-bar-track"><div className="goal-bar-fill" style={{width:`${pct}%`}}/></div>
                </div>
              )}
              {g.targetDate&&<div style={{fontSize:11,color:"var(--hf-fg-muted)",fontFamily:"var(--hf-font-mono)"}}>Target: {new Date(g.targetDate+"T12:00:00").toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"})}</div>}
              {open&&(
                <div onClick={e=>e.stopPropagation()}>
                  {g.description&&<div style={{fontSize:13,color:"var(--hf-fg-body)",lineHeight:1.65,paddingTop:4}}>{g.description}</div>}
                  {g.targetValue>0&&(
                    <div style={{display:"flex",alignItems:"center",gap:8,marginTop:10}}>
                      <span style={{fontSize:12,color:"var(--hf-fg-muted)"}}>Current:</span>
                      <input type="number" className="input" style={{width:80,fontSize:13,padding:"4px 8px"}} value={g.currentValue||0} onChange={e=>updateProgress(g.id,e.target.value)} onClick={e=>e.stopPropagation()}/>
                      <span style={{fontSize:12,color:"var(--hf-fg-muted)"}}>{g.unit}</span>
                    </div>
                  )}
                  {g.milestones.length>0&&(
                    <div className="goal-card__milestones">
                      {g.milestones.map(m=>(
                        <label key={m.id} className={"goal-milestone"+(m.done?" goal-milestone--done":"")} onClick={e=>e.stopPropagation()}>
                          <input type="checkbox" checked={m.done} onChange={()=>toggleMilestone(g.id,m.id)} style={{accentColor:"var(--hf-sand-400)",flexShrink:0}}/>{m.text}
                        </label>
                      ))}
                    </div>
                  )}
                  <div style={{display:"flex",gap:8,marginTop:12}}>
                    <button className="btn btn--secondary" style={{fontSize:12}} onClick={e=>{e.stopPropagation();markDone(g.id);}}><Icon name="check" size={12}/> Complete</button>
                  </div>
                </div>
              )}
            </div>
          );
        })}
      </div>

      {filtered.length===0&&!showForm&&(
        <div style={{padding:"32px 0",color:"var(--hf-fg-muted)",fontSize:14,fontStyle:"italic"}}>
          {filter==="all"?"No active goals. Add one above.":"No goals in this area."}
        </div>
      )}

      {completed.length>0&&(
        <div style={{marginTop:40}}>
          <h2 className="h-serif" style={{fontSize:22,margin:"0 0 16px",color:"var(--hf-fg-muted)"}}>Completed</h2>
          {completed.map(g=>(
            <div key={g.id} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"11px 0",borderBottom:"1px solid var(--hf-border)",fontSize:13}}>
              <div style={{display:"flex",alignItems:"center",gap:10}}>
                <span style={{textDecoration:"line-through",color:"var(--hf-fg-muted)"}}>{g.title}</span>
                <span className={"goal-card__area goal-card__area--"+g.area} style={{fontSize:10,padding:"2px 8px"}}>{g.area}</span>
              </div>
              <div style={{display:"flex",alignItems:"center",gap:10}}>
                {g.completedAt&&<span style={{fontSize:11,color:"var(--hf-fg-subtle)",fontFamily:"var(--hf-font-mono)"}}>{new Date(g.completedAt).toLocaleDateString("en-US",{month:"short",day:"numeric"})}</span>}
                <button className="iconbtn btn--danger" style={{opacity:0.5}} onClick={()=>deleteGoal(g.id)}><Icon name="x" size={12}/></button>
              </div>
            </div>
          ))}
        </div>
      )}
    </div>
  );
};

/* ── To-Do ── */
const TodoView = ({ todos, setTodos, onSendToMit }) => {
  const [input,         setInput]         = useState("");
  const [filter,        setFilter]        = useState("all");
  const [showCompleted, setShowCompleted] = useState(false);
  const inputRef = useRef(null);
  const today = todayStr();

  const addTodo = () => {
    const text=input.trim(); if(!text) return;
    setTodos(ts=>[...ts,{id:Date.now(),text,note:"",area:"",goalId:null,priority:"medium",dueDate:"",createdAt:new Date().toISOString(),completedAt:null,done:false}]);
    setInput("");
  };
  const toggleTodo  = (id)          => setTodos(ts=>ts.map(t=>t.id===id?{...t,done:!t.done,completedAt:!t.done?new Date().toISOString():null}:t));
  const deleteTodo  = (id)          => setTodos(ts=>ts.filter(t=>t.id!==id));
  const setPriority = (id,priority) => setTodos(ts=>ts.map(t=>t.id===id?{...t,priority}:t));

  const active    = todos.filter(t=>!t.done);
  const completed = todos.filter(t=>t.done);
  const filtered  = active.filter(t=>{
    if(filter==="high")  return t.priority==="high";
    if(filter==="today") return t.dueDate===today;
    return true;
  });

  return (
    <div className="page">
      <div style={{marginBottom:28}}>
        <div className="eyebrow">Build</div>
        <h1 className="h-serif" style={{fontSize:44,margin:"8px 0 0"}}>To-do</h1>
      </div>

      <div className="todo-quickadd">
        <Icon name="plus" size={16}/>
        <input ref={inputRef} placeholder="Add a task — press Enter" value={input} onChange={e=>setInput(e.target.value)} onKeyDown={e=>{if(e.key==="Enter")addTodo();}}/>
        <button className="btn btn--primary" style={{padding:"5px 12px",fontSize:12}} onClick={addTodo} disabled={!input.trim()}>Add</button>
      </div>

      <div style={{display:"flex",gap:6,marginBottom:16}}>
        {[{id:"all",label:`All (${active.length})`},{id:"high",label:"High priority"},{id:"today",label:"Due today"}].map(f=>(
          <button key={f.id} className={"stats-period"+(filter===f.id?" stats-period--active":"")} onClick={()=>setFilter(f.id)}>{f.label}</button>
        ))}
      </div>

      <div>
        {filtered.length===0&&<div style={{padding:"24px 0",color:"var(--hf-fg-muted)",fontSize:14,fontStyle:"italic"}}>{filter==="all"?"Nothing to do. Add a task above.":"Nothing matches this filter."}</div>}
        {filtered.map(t=>(
          <div key={t.id} className="todo-row">
            <div className={"todo-row__priority todo-row__priority--"+(t.priority||"medium")} title={`Priority: ${t.priority||"medium"} — click to cycle`} onClick={()=>setPriority(t.id,t.priority==="high"?"medium":t.priority==="medium"?"low":"high")}/>
            <input type="checkbox" className="mit-check" checked={false} onChange={()=>toggleTodo(t.id)}/>
            <span className="todo-row__text">{t.text}</span>
            {t.dueDate&&<span className={"todo-row__due"+(t.dueDate===today?" todo-row__due--today":"")}>
              {t.dueDate===today?"Today":new Date(t.dueDate+"T12:00:00").toLocaleDateString("en-US",{month:"short",day:"numeric"})}
            </span>}
            {onSendToMit&&(
              <button className="todo-row__mit" onClick={()=>onSendToMit(t.text)} title="Send to today's planning">→ MIT</button>
            )}
            <button className="iconbtn btn--danger todo-row__del" onClick={()=>deleteTodo(t.id)}><Icon name="x" size={13}/></button>
          </div>
        ))}
      </div>

      {completed.length>0&&(
        <div style={{marginTop:28}}>
          <button className="btn btn--ghost" style={{fontSize:12,padding:"4px 0",marginBottom:10}} onClick={()=>setShowCompleted(v=>!v)}>
            <Icon name={showCompleted?"chevronDown":"chevronRight"} size={12}/> Completed ({completed.length})
          </button>
          {showCompleted&&completed.map(t=>(
            <div key={t.id} className="todo-row" style={{opacity:0.5}}>
              <div className="todo-row__priority" style={{background:"var(--hf-fg-subtle)"}}/>
              <input type="checkbox" className="mit-check" checked={true} onChange={()=>toggleTodo(t.id)}/>
              <span className="todo-row__text todo-row__text--done">{t.text}</span>
              <button className="iconbtn btn--danger todo-row__del" onClick={()=>deleteTodo(t.id)}><Icon name="x" size={13}/></button>
            </div>
          ))}
        </div>
      )}
    </div>
  );
};
