<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hyper Focus</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><circle cx='32' cy='32' r='28' stroke='%2312110E' stroke-width='1.5' fill='none'/><circle cx='32' cy='32' r='16' stroke='%2312110E' stroke-width='1.5' fill='none'/><circle cx='32' cy='32' r='3' fill='%2312110E'/></svg>">
<meta name="description" content="A quiet, offline-first place to hold your focus and remember your purpose.">
<meta name="theme-color" content="#FBFAF7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#12110E" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Hyper Focus">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@300;400;500;600;700&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
/* ── Reset ── */
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; padding: 0; height: 100%; }
button { font: inherit; cursor: pointer; border: 0; background: none; color: inherit; }
input, textarea, select { font: inherit; color: inherit; }

/* ── Tokens ── */
:root {
  --hf-bone-50:  #FBFAF7; --hf-bone-100: #F5F3EE; --hf-bone-200: #EBE8E0;
  --hf-bone-300: #D9D5CA; --hf-bone-400: #A8A497; --hf-bone-500: #7A7668;
  --hf-bone-600: #55524A; --hf-bone-700: #3A3832; --hf-bone-800: #26251F; --hf-bone-900: #12110E;
  --hf-sand-50:  #F7F1E6; --hf-sand-200: #E0CDA8; --hf-sand-300: #D3B887;
  --hf-sand-400: #C8A97E; --hf-sand-500: #B08E5C; --hf-sand-600: #8F7247; --hf-sand-700: #6B5534;
  --hf-success:  #6B8E5A;
  --hf-bg:            #FBFAF7; --hf-bg-raised: #FFFFFF; --hf-bg-subtle: #F5F3EE;
  --hf-fg:            #12110E; --hf-fg-body:   #3A3832; --hf-fg-muted:  #7A7668; --hf-fg-subtle: #A8A497;
  --hf-border:        #EBE8E0; --hf-border-strong: #D9D5CA; --hf-accent: #C8A97E;
  --hf-font-serif: 'Instrument Serif', Georgia, serif;
  --hf-font-sans:  'Geist', -apple-system, 'Helvetica Neue', sans-serif;
  --hf-font-mono:  'JetBrains Mono', Menlo, Consolas, monospace;
  --hf-shadow-sm: 0 1px 2px rgba(26,24,18,.05), 0 1px 1px rgba(26,24,18,.03);
  --hf-shadow-md: 0 4px 12px -2px rgba(26,24,18,.06), 0 2px 4px -1px rgba(26,24,18,.04);
  --hf-shadow-xl: 0 24px 56px -12px rgba(26,24,18,.16), 0 8px 16px -4px rgba(26,24,18,.06);
  --hf-ease-out: cubic-bezier(0.22,0.61,0.36,1);
}
:root[data-theme="dark"] {
  --hf-bg:#12110E; --hf-bg-raised:#1A1814; --hf-bg-subtle:#16140F;
  --hf-fg:#F5F2EA; --hf-fg-body:#D9D4C6; --hf-fg-muted:#8B8676; --hf-fg-subtle:#5E5A4F;
  --hf-border:#2A2823; --hf-border-strong:#3A382F; --hf-accent:#D3B887;
  --hf-shadow-sm:0 1px 2px rgba(0,0,0,.4); --hf-shadow-md:0 4px 12px -2px rgba(0,0,0,.5);
  --hf-shadow-xl:0 24px 56px -12px rgba(0,0,0,.7);
}

/* ── Base ── */
body { font-family:var(--hf-font-sans); background:var(--hf-bg); color:var(--hf-fg); -webkit-font-smoothing:antialiased; overflow:hidden; font-feature-settings:"ss01"; }
#root { height:100vh; }

/* ── Shell ── */
.app { display:grid; grid-template-columns:220px 1fr; height:100vh; }
.canvas { overflow-y:auto; position:relative; background:var(--hf-bg); }

/* ── Rail ── */
.rail { background:var(--hf-bg-raised); border-right:1px solid var(--hf-border); padding:18px 14px; display:flex; flex-direction:column; gap:2px; overflow:hidden; }
.rail__brand { display:flex; align-items:center; gap:10px; padding:4px 6px 18px; }
.rail__brand-name { font-family:var(--hf-font-serif); font-size:20px; letter-spacing:-0.01em; white-space:nowrap; }
.rail__sec { font-size:10px; letter-spacing:0.18em; text-transform:uppercase; color:var(--hf-fg-muted); padding:14px 8px 6px; font-weight:500; }
.rail__item { display:flex; align-items:center; gap:10px; padding:7px 10px; border-radius:6px; font-size:13px; color:var(--hf-fg-body); transition:background 160ms var(--hf-ease-out); width:100%; text-align:left; }
.rail__item svg { width:15px; height:15px; stroke-width:1.5; color:var(--hf-fg-muted); flex-shrink:0; }
.rail__item:hover { background:var(--hf-bone-100); }
.rail__item--active { background:var(--hf-sand-50); color:var(--hf-sand-700); }
.rail__item--active svg { color:var(--hf-sand-600); }
.rail__spacer { flex:1; }
[data-theme="dark"] .rail__item:hover { background:#1A1814; }
[data-theme="dark"] .rail__item--active { background:rgba(211,184,135,.1); color:var(--hf-accent); }
[data-theme="dark"] .rail__item--active svg { color:var(--hf-accent); }

/* ── Topbar ── */
.topbar { height:44px; display:flex; align-items:center; justify-content:space-between; padding:0 24px; border-bottom:1px solid var(--hf-border); background:var(--hf-bg); position:sticky; top:0; z-index:5; }
.topbar__crumb { font-size:12px; color:var(--hf-fg-muted); letter-spacing:.04em; display:flex; align-items:center; gap:6px; }
.topbar__crumb svg { width:12px; height:12px; stroke-width:1.5; }
.topbar__crumb b { color:var(--hf-fg); font-weight:500; }
.topbar__actions { display:flex; gap:4px; align-items:center; }
.iconbtn { width:30px; height:30px; border-radius:6px; display:flex; align-items:center; justify-content:center; color:var(--hf-fg-muted); transition:all 160ms var(--hf-ease-out); }
.iconbtn:hover { background:var(--hf-bone-100); color:var(--hf-fg); }
.iconbtn svg { width:15px; height:15px; stroke-width:1.5; }
[data-theme="dark"] .iconbtn:hover { background:#2A2823; }

/* ── Page ── */
.page { padding:48px 64px 64px; max-width:1100px; margin:0 auto; }
.eyebrow { font-size:10px; letter-spacing:0.18em; text-transform:uppercase; color:var(--hf-fg-muted); font-weight:500; }
.h-serif { font-family:var(--hf-font-serif); font-weight:400; letter-spacing:-0.01em; line-height:1.1; }

/* ── Buttons ── */
.btn { font-size:13px; font-weight:500; padding:8px 16px; border-radius:6px; display:inline-flex; align-items:center; gap:6px; line-height:1; transition:all 160ms var(--hf-ease-out); border:1px solid transparent; }
.btn svg { width:14px; height:14px; stroke-width:1.5; }
.btn--primary { background:var(--hf-sand-400); color:#FBFAF7; }
.btn--primary:hover { background:var(--hf-sand-500); }
.btn--primary:active { background:var(--hf-sand-600); transform:translateY(1px); }
.btn--secondary { background:var(--hf-bg-raised); color:var(--hf-fg); border-color:var(--hf-border-strong); }
.btn--secondary:hover { border-color:var(--hf-bone-400); }
.btn--ghost { color:var(--hf-fg-body); }
.btn--ghost:hover { background:var(--hf-bone-100); }
.btn--danger { color:#C0392B; }
.btn--danger:hover { background:rgba(192,57,43,.08); }
.btn--lg { padding:12px 22px; font-size:14px; }
.btn--xl { padding:16px 32px; font-size:15px; border-radius:8px; }
[data-theme="dark"] .btn--ghost:hover { background:#2A2823; }
[data-theme="dark"] .btn--secondary { background:var(--hf-bg-raised); }

/* ── Input ── */
.input { font-size:14px; padding:9px 12px; border:1px solid var(--hf-border-strong); border-radius:6px; background:var(--hf-bg-raised); color:var(--hf-fg); transition:all 160ms var(--hf-ease-out); width:100%; }
.input:focus { outline:none; border-color:var(--hf-sand-400); box-shadow:0 0 0 3px rgba(200,169,126,.35); }
.input::placeholder { color:var(--hf-fg-subtle); }

/* ── Card ── */
.card-s { background:var(--hf-bg-raised); border:1px solid var(--hf-border); border-radius:10px; box-shadow:var(--hf-shadow-sm); padding:20px 22px; }

/* ── Badge ── */
.badge { font-size:11px; font-weight:500; padding:3px 10px; border-radius:9999px; letter-spacing:.02em; display:inline-flex; align-items:center; gap:5px; }
.badge .dot { width:5px; height:5px; border-radius:50%; background:currentColor; }
.badge--neutral { background:var(--hf-bone-100); color:var(--hf-fg-body); border:1px solid var(--hf-border); }
.badge--accent  { background:var(--hf-sand-50);  color:var(--hf-sand-700); border:1px solid var(--hf-sand-200); }
.badge--success { background:#ECEFE5; color:#3F5C30; border:1px solid #C8D1B8; }
[data-theme="dark"] .badge--neutral { background:var(--hf-bg-raised); border-color:var(--hf-border); }

/* ── Focus stage ── */
.focus-stage { min-height:calc(100vh - 44px); display:flex; flex-direction:column; align-items:center; justify-content:center; padding:40px 64px; position:relative; }
.focus-meta { position:absolute; top:32px; left:50%; transform:translateX(-50%); display:flex; gap:22px; align-items:center; font-family:var(--hf-font-mono); font-size:11px; color:var(--hf-fg-muted); letter-spacing:.04em; white-space:nowrap; }
.focus-meta b { color:var(--hf-fg); font-weight:400; }
.dur-edit { background:transparent; border:0; border-bottom:1px solid var(--hf-sand-400); color:var(--hf-fg); font-family:var(--hf-font-mono); font-size:11px; width:44px; text-align:center; outline:none; padding:0 2px; }
.dur-target { cursor:pointer; border-bottom:1px dashed var(--hf-fg-subtle); }
.focus-task { font-family:var(--hf-font-serif); font-size:34px; font-weight:400; letter-spacing:-0.01em; line-height:1.15; max-width:640px; text-align:center; color:var(--hf-fg); margin-bottom:40px; border:0; background:transparent; width:100%; outline:none; }
.focus-task::placeholder { color:var(--hf-fg-subtle); font-style:italic; }

/* ── Session MITs ── */
.session-mits { display:flex; gap:7px; flex-wrap:wrap; justify-content:center; margin:-16px 0 20px; }
.session-mit { font-size:11px; color:var(--hf-fg-muted); padding:3px 12px; border:1px solid var(--hf-border); border-radius:9999px; font-family:var(--hf-font-sans); }
.session-mit--done { text-decoration:line-through; opacity:0.4; }

/* ── Breath options (inline in session) ── */
.breath-opts { display:flex; gap:6px; align-items:center; margin-top:14px; }
.breath-opts__label { font-size:11px; color:var(--hf-fg-subtle); text-transform:uppercase; letter-spacing:.12em; margin-right:2px; }
.breath-opt { font-size:12px; padding:4px 12px; border-radius:9999px; color:var(--hf-fg-muted); border:1px solid var(--hf-border); transition:all 140ms; }
.breath-opt:hover { border-color:var(--hf-sand-400); color:var(--hf-sand-600); background:var(--hf-sand-50); }

/* ── Ring ── */
.ring { position:relative; width:380px; height:380px; display:flex; align-items:center; justify-content:center; }
.ring--breathing { animation:hf-breath 4s ease-in-out infinite; }
.ring--dp { width:min(320px,78vw); height:min(320px,78vw); margin:28px 0; }
@keyframes hf-breath { 0%,100%{transform:scale(1);}50%{transform:scale(1.035);} }
.ring svg { width:100%; height:100%; transform:rotate(-90deg); }
.ring__bg { stroke:var(--hf-bone-200); fill:none; stroke-width:1.5; }
.ring__fg { stroke:var(--hf-sand-400); fill:none; stroke-width:1.5; stroke-linecap:round; transition:stroke-dashoffset 980ms linear; }
.ring__fg--break { stroke:var(--hf-success); }
.ring__inner { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px; }
.ring__timer { font-family:var(--hf-font-mono); font-weight:300; font-size:96px; letter-spacing:-0.02em; color:var(--hf-fg); font-feature-settings:"tnum","zero"; line-height:1; }
.ring__label { font-size:11px; letter-spacing:0.24em; text-transform:uppercase; color:var(--hf-fg-muted); font-weight:500; }
[data-theme="dark"] .ring__bg { stroke:#2A2823; }
.focus-actions { margin-top:40px; display:flex; gap:10px; align-items:center; flex-wrap:wrap; justify-content:center; }

/* ── Quote ── */
.session-quote { margin-top:28px; text-align:center; max-width:480px; font-family:var(--hf-font-serif); font-style:italic; font-size:14px; color:var(--hf-fg-subtle); line-height:1.65; }
.session-quote cite { display:block; margin-top:4px; font-style:normal; font-family:var(--hf-font-sans); font-size:10px; letter-spacing:0.1em; text-transform:uppercase; }

/* ── Session complete ── */
.session-complete { display:flex; flex-direction:column; align-items:center; gap:12px; text-align:center; padding:0 40px; }
.session-complete__label { font-size:11px; letter-spacing:0.24em; text-transform:uppercase; color:var(--hf-fg-muted); font-weight:500; }
.session-complete__task { font-family:var(--hf-font-serif); font-size:30px; color:var(--hf-fg); letter-spacing:-0.01em; line-height:1.2; max-width:500px; }

/* ── KPIs ── */
.kpi-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:14px; }
.kpi { display:flex; flex-direction:column; gap:6px; }
.kpi__label { font-size:10px; letter-spacing:0.18em; text-transform:uppercase; color:var(--hf-fg-muted); font-weight:500; }
.kpi__value { font-family:var(--hf-font-mono); font-weight:300; font-size:38px; letter-spacing:-0.02em; color:var(--hf-fg); line-height:1; font-feature-settings:"tnum"; }
.kpi__value small { font-size:16px; color:var(--hf-fg-muted); margin-left:3px; }

/* ── Session list ── */
.session-list { display:flex; flex-direction:column; }
.session-row { display:grid; grid-template-columns:112px 1fr auto auto auto; gap:18px; align-items:center; padding:14px 0; border-bottom:1px solid var(--hf-border); font-size:13px; }
.session-row__del { opacity:0; transition:opacity 140ms; }
.session-row:hover .session-row__del { opacity:1; }
.session-row__time { font-family:var(--hf-font-mono); color:var(--hf-fg-muted); font-size:11px; white-space:nowrap; }
.session-row__task { color:var(--hf-fg); cursor:text; }
.session-row__task:hover { color:var(--hf-fg); }
.session-row__edit { border:0; background:transparent; font-size:13px; color:var(--hf-fg); outline:none; width:100%; padding:0; border-bottom:1px solid var(--hf-sand-400); font-family:var(--hf-font-sans); }
.session-row__dur  { font-family:var(--hf-font-mono); font-size:12px; color:var(--hf-fg-body); }

/* ── Stats ── */
.stats-periods { display:flex; gap:4px; margin-bottom:28px; }
.stats-period { font-size:12px; padding:6px 14px; border-radius:6px; color:var(--hf-fg-muted); transition:all 120ms; }
.stats-period:hover { background:var(--hf-bone-100); }
.stats-period--active { background:var(--hf-sand-50); color:var(--hf-sand-700); font-weight:500; }
[data-theme="dark"] .stats-period:hover { background:#2A2823; }
[data-theme="dark"] .stats-period--active { background:rgba(211,184,135,.1); color:var(--hf-accent); }
.chart { height:160px; display:flex; align-items:flex-end; gap:6px; padding:0 4px; }
.chart__bar { flex:1; background:var(--hf-sand-400); border-radius:2px 2px 0 0; min-height:2px; }
.chart__bar--dim { background:var(--hf-bone-200); }
.chart__bar--today { background:var(--hf-sand-500); }
.chart__labels { display:flex; gap:6px; margin-top:8px; padding:0 4px; }
.chart__labels span { flex:1; text-align:center; font-size:10px; color:var(--hf-fg-muted); letter-spacing:.08em; text-transform:uppercase; font-family:var(--hf-font-mono); }
[data-theme="dark"] .chart__bar--dim { background:#2A2823; }

/* ── Soundscapes ── */
.sound-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; }
.sound { padding:18px; border-radius:10px; background:var(--hf-bg-raised); border:1px solid var(--hf-border); transition:all 160ms var(--hf-ease-out); text-align:left; }
.sound:hover { border-color:var(--hf-border-strong); }
.sound--active { background:var(--hf-sand-50); border-color:var(--hf-sand-300); }
[data-theme="dark"] .sound--active { background:rgba(211,184,135,.08); border-color:rgba(211,184,135,.3); }
.sound__name { font-family:var(--hf-font-serif); font-size:22px; color:var(--hf-fg); line-height:1.1; }
.sound__desc { font-size:12px; color:var(--hf-fg-muted); margin-top:6px; line-height:1.5; }
.sound__bars { display:flex; gap:2px; margin-top:14px; align-items:flex-end; height:14px; }
.sound__bars i { display:block; width:2px; background:var(--hf-fg-subtle); border-radius:1px; }
.sound--active .sound__bars i { background:var(--hf-sand-400); animation:soundbar 1.2s ease-in-out infinite; }
.sound--active .sound__bars i:nth-child(2){animation-delay:.15s;}
.sound--active .sound__bars i:nth-child(3){animation-delay:.3s;}
.sound--active .sound__bars i:nth-child(4){animation-delay:.45s;}
.sound--active .sound__bars i:nth-child(5){animation-delay:.6s;}
@keyframes soundbar{0%,100%{height:4px;}50%{height:14px;}}
[data-theme="dark"] .sound__bars i { background:var(--hf-fg-subtle); }

/* ── Planning ── */
.mit-row { display:flex; align-items:center; gap:12px; padding:11px 0; border-bottom:1px solid var(--hf-border); }
.mit-check { width:16px; height:16px; flex-shrink:0; cursor:pointer; accent-color:var(--hf-sand-400); }
.mit-input { border:0; background:transparent; font-size:15px; color:var(--hf-fg); outline:none; flex:1; line-height:1.4; padding:0; }
.mit-input::placeholder { color:var(--hf-fg-subtle); font-style:italic; }
.mit-input--done { text-decoration:line-through; color:var(--hf-fg-subtle); }
.plan-history { display:flex; flex-direction:column; gap:0; }
.plan-day { padding:16px 0; border-bottom:1px solid var(--hf-border); }
.plan-day__date { font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--hf-fg-muted); font-weight:500; margin-bottom:8px; }
.plan-day__tasks { display:flex; flex-direction:column; gap:5px; }
.plan-day__task { font-size:13px; color:var(--hf-fg-body); display:flex; align-items:center; gap:8px; }
.plan-day__task--done { text-decoration:line-through; color:var(--hf-fg-subtle); }
.plan-day__dot { width:4px; height:4px; border-radius:50%; background:var(--hf-sand-400); flex-shrink:0; }
.plan-day__dot--done { background:var(--hf-fg-subtle); }

/* ── Stoic ── */
.stoic-daily { background:var(--hf-bg-raised); border:1px solid var(--hf-border); border-left:3px solid var(--hf-sand-400); border-radius:10px; padding:28px 32px; margin-bottom:36px; }
.stoic-daily__eyebrow { font-size:10px; letter-spacing:0.18em; text-transform:uppercase; color:var(--hf-fg-muted); font-weight:500; margin-bottom:14px; }
.stoic-daily__quote { font-family:var(--hf-font-serif); font-size:22px; font-style:italic; color:var(--hf-fg); line-height:1.55; letter-spacing:-0.01em; }
.stoic-daily__author { margin-top:14px; font-size:11px; letter-spacing:0.16em; text-transform:uppercase; color:var(--hf-fg-muted); font-weight:500; }
.stoic-phil-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:14px; margin-bottom:36px; }
.stoic-phil-grid--2 { grid-template-columns:repeat(2,1fr); }
.grid-2 { display:grid; grid-template-columns:repeat(2,1fr); gap:16px; }
.stoic-phil { background:var(--hf-bg-raised); border:1px solid var(--hf-border); border-radius:10px; overflow:hidden; transition:border-color 160ms var(--hf-ease-out); }
.stoic-phil--open { border-color:var(--hf-sand-300); }
[data-theme="dark"] .stoic-phil--open { border-color:rgba(211,184,135,.4); }
.stoic-phil__head { padding:20px 20px 18px; cursor:pointer; display:flex; justify-content:space-between; align-items:flex-start; user-select:none; }
.stoic-phil__head:hover { background:var(--hf-bg-subtle); }
[data-theme="dark"] .stoic-phil__head:hover { background:rgba(255,255,255,.03); }
.stoic-phil__name { font-family:var(--hf-font-serif); font-size:21px; color:var(--hf-fg); letter-spacing:-0.01em; line-height:1.1; }
.stoic-phil__dates { font-family:var(--hf-font-mono); font-size:11px; color:var(--hf-fg-muted); margin-top:5px; }
.stoic-phil__role { font-size:11px; color:var(--hf-fg-subtle); margin-top:3px; }
.stoic-phil__body { padding:0 20px 22px; border-top:1px solid var(--hf-border); }
.stoic-phil__bio { font-size:13px; color:var(--hf-fg-body); line-height:1.7; margin:16px 0 14px; }
.stoic-phil__story { font-size:13px; color:var(--hf-fg-body); line-height:1.7; font-style:italic; margin-bottom:16px; }
.stoic-phil__quote { font-family:var(--hf-font-serif); font-style:italic; font-size:15px; color:var(--hf-fg); border-left:2px solid var(--hf-sand-400); padding:4px 0 4px 14px; margin:8px 0; line-height:1.6; }
.stoic-principles { display:grid; grid-template-columns:repeat(2,1fr); gap:14px; }
.stoic-principle { background:var(--hf-bg-raised); border:1px solid var(--hf-border); border-radius:10px; padding:22px 24px; }
.stoic-principle__name { font-family:var(--hf-font-serif); font-size:20px; color:var(--hf-fg); letter-spacing:-0.01em; margin-bottom:10px; }
.stoic-principle__desc { font-size:13px; color:var(--hf-fg-body); line-height:1.7; }

/* ── Stoic practices ── */
.stoic-practices { display:grid; grid-template-columns:repeat(2,1fr); gap:14px; }
.stoic-practice { background:var(--hf-bg-raised); border:1px solid var(--hf-border); border-radius:10px; padding:22px 24px; }
.stoic-practice__head { display:flex; align-items:flex-start; justify-content:space-between; margin-bottom:12px; }
.stoic-practice__name { font-family:var(--hf-font-serif); font-size:19px; color:var(--hf-fg); letter-spacing:-0.01em; line-height:1.2; }
.stoic-practice__time { font-family:var(--hf-font-mono); font-size:10px; color:var(--hf-fg-subtle); letter-spacing:.04em; margin-top:4px; white-space:nowrap; }
.stoic-practice__desc { font-size:13px; color:var(--hf-fg-body); line-height:1.7; }

/* ── Breath ── */
.breath-stage { min-height:calc(100vh - 44px); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:32px; padding:40px; background:var(--hf-bg); }
.breath-prompt { font-family:var(--hf-font-serif); font-size:40px; color:var(--hf-fg); }
.breath-cue { font-size:12px; letter-spacing:0.24em; text-transform:uppercase; color:var(--hf-fg-muted); font-weight:500; }
.breath-circle { width:200px; height:200px; border-radius:50%; border:1.5px solid var(--hf-sand-400); display:flex; align-items:center; justify-content:center; animation:hf-breath-big 6s ease-in-out infinite; }
.breath-dot { width:8px; height:8px; border-radius:50%; background:var(--hf-sand-400); }
@keyframes hf-breath-big{0%,100%{transform:scale(.9);opacity:.7;}50%{transform:scale(1.1);opacity:1;}}

/* ── CmdK ── */
.cmdk-backdrop { position:fixed; inset:0; background:rgba(18,17,14,.35); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); display:flex; align-items:flex-start; justify-content:center; padding-top:120px; z-index:40; animation:fadeIn 160ms var(--hf-ease-out); }
@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
.cmdk { width:560px; background:var(--hf-bg-raised); border:1px solid var(--hf-border); border-radius:10px; box-shadow:var(--hf-shadow-xl); overflow:hidden; }
.cmdk__search { display:flex; align-items:center; gap:10px; padding:14px 16px; border-bottom:1px solid var(--hf-border); }
.cmdk__search svg { width:16px; height:16px; stroke-width:1.5; color:var(--hf-fg-muted); }
.cmdk__search input { flex:1; border:0; outline:none; background:transparent; font-size:15px; }
.cmdk__search input::placeholder { color:var(--hf-fg-subtle); }
.cmdk__hint { font-family:var(--hf-font-mono); font-size:10px; color:var(--hf-fg-muted); letter-spacing:.04em; text-transform:uppercase; }
.cmdk__list { padding:6px; max-height:320px; overflow-y:auto; }
.cmdk__item { display:flex; align-items:center; gap:10px; padding:9px 10px; border-radius:6px; font-size:13px; width:100%; text-align:left; transition:background 80ms; }
.cmdk__item svg { width:15px; height:15px; stroke-width:1.5; color:var(--hf-fg-muted); }
.cmdk__item:hover,.cmdk__item--sel{background:var(--hf-bone-100);}
[data-theme="dark"] .cmdk__item:hover,[data-theme="dark"] .cmdk__item--sel{background:#2A2823;}
.cmdk__item .kbd{margin-left:auto;font-family:var(--hf-font-mono);font-size:10px;color:var(--hf-fg-muted);}

/* ── Tracker toast ── */
.tracker-toast { position:fixed; bottom:28px; left:50%; transform:translateX(-50%); background:var(--hf-bg-raised); border:1px solid var(--hf-border-strong); border-radius:12px; box-shadow:var(--hf-shadow-xl); padding:22px 26px; width:480px; z-index:50; animation:slideUp 200ms var(--hf-ease-out); }
@keyframes slideUp{from{opacity:0;transform:translateX(-50%) translateY(14px);}to{opacity:1;transform:translateX(-50%) translateY(0);}}
.tracker-toast__header { display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; }
.tracker-toast__label { font-size:10px; letter-spacing:.18em; text-transform:uppercase; color:var(--hf-fg-muted); font-weight:500; }
.tracker-toast__period { font-family:var(--hf-font-mono); font-size:12px; color:var(--hf-fg-muted); }
.tracker-toast__input { width:100%; border:0; border-bottom:1px solid var(--hf-border-strong); background:transparent; font-family:var(--hf-font-serif); font-size:22px; color:var(--hf-fg); padding:6px 0; outline:none; letter-spacing:-0.01em; transition:border-color 160ms var(--hf-ease-out); }
.tracker-toast__input:focus { border-bottom-color:var(--hf-sand-400); }
.tracker-toast__input::placeholder { color:var(--hf-fg-subtle); font-style:italic; }
.tracker-toast__actions { display:flex; gap:8px; margin-top:18px; }

/* ── Tracker view ── */
.tracker-timeline { display:flex; flex-direction:column; }
.tracker-entry { display:grid; grid-template-columns:134px 1fr 40px; gap:16px; padding:14px 0; border-bottom:1px solid var(--hf-border); align-items:start; }
.tracker-entry__time { font-family:var(--hf-font-mono); font-size:11px; color:var(--hf-fg-muted); padding-top:2px; white-space:nowrap; }
.tracker-entry__text { font-size:14px; color:var(--hf-fg); line-height:1.5; }
.tracker-entry__dur  { font-family:var(--hf-font-mono); font-size:11px; color:var(--hf-fg-subtle); text-align:right; padding-top:2px; }
.tracker-summary { display:grid; grid-template-columns:repeat(3,1fr); gap:14px; }

/* ── Star rating ── */
.star-rate { margin-top:24px; text-align:center; }
.star-rate__label { font-size:11px; letter-spacing:0.18em; text-transform:uppercase; color:var(--hf-fg-muted); font-weight:500; margin-bottom:14px; }
.star-rate__stars { display:flex; gap:4px; justify-content:center; margin-top:12px; }
.star-btn { padding:4px; color:var(--hf-bone-300); transition:all 140ms var(--hf-ease-out); line-height:0; }
.star-btn:hover { color:var(--hf-sand-400); transform:scale(1.15); }
.star-btn--filled { color:var(--hf-sand-400); }
[data-theme="dark"] .star-btn { color:var(--hf-fg-subtle); }
[data-theme="dark"] .star-btn--filled { color:var(--hf-accent); }
.quality-stars { color:var(--hf-sand-400); font-size:11px; letter-spacing:-1px; line-height:1; flex-shrink:0; }
[data-theme="dark"] .quality-stars { color:var(--hf-accent); }

/* ── Daily Practices ── */
.dp-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:14px; margin-bottom:32px; }
.dp-card { background:var(--hf-bg-raised); border:1px solid var(--hf-border); border-radius:10px; padding:22px 24px; transition:border-color 160ms var(--hf-ease-out); }
.dp-card__head { display:flex; align-items:flex-start; justify-content:space-between; margin-bottom:10px; }
.dp-card__name { font-family:var(--hf-font-serif); font-size:19px; color:var(--hf-fg); letter-spacing:-0.01em; line-height:1.2; }
.dp-card__time { font-family:var(--hf-font-mono); font-size:10px; color:var(--hf-fg-subtle); letter-spacing:.04em; margin-top:4px; }
.dp-card__desc { font-size:13px; color:var(--hf-fg-body); line-height:1.7; margin-bottom:16px; }
.dp-card--done { border-color:var(--hf-success) !important; }
.dp-card--done .dp-card__name { color:var(--hf-fg-muted); }
.dp-timer__name { font-family:var(--hf-font-serif); font-size:28px; color:var(--hf-fg); letter-spacing:-0.01em; text-align:center; margin-bottom:8px; }
.dp-timer__desc { font-size:13px; color:var(--hf-fg-muted); max-width:420px; text-align:center; line-height:1.65; margin-bottom:4px; }
.dp-log-entry { display:flex; align-items:center; gap:12px; padding:11px 0; border-bottom:1px solid var(--hf-border); font-size:13px; }
.dp-log-entry__check { color:var(--hf-success); flex-shrink:0; }
.dp-log-entry__name { color:var(--hf-fg); flex:1; }
.dp-log-entry__time { font-family:var(--hf-font-mono); font-size:11px; color:var(--hf-fg-muted); white-space:nowrap; }
.dp-log-entry__dur { font-family:var(--hf-font-mono); font-size:11px; color:var(--hf-fg-subtle); white-space:nowrap; }

/* ── Session MIT clickable ── */
.session-mit--clickable { cursor:pointer; transition:all 140ms; }
.session-mit--clickable:hover { border-color:var(--hf-sand-400); color:var(--hf-sand-600); background:var(--hf-sand-50); }

/* ── Heatmap ── */
.heatmap { margin-top:8px; }
.heatmap__grid { display:flex; gap:3px; }
.heatmap__col { display:flex; flex-direction:column; gap:3px; }
.heatmap__cell { width:13px; height:13px; border-radius:2px; background:var(--hf-bone-200); flex-shrink:0; }
.heatmap__cell--l1 { background:rgba(200,169,126,.35); }
.heatmap__cell--l2 { background:rgba(200,169,126,.6); }
.heatmap__cell--l3 { background:rgba(200,169,126,.85); }
.heatmap__cell--l4 { background:var(--hf-sand-500); }
[data-theme="dark"] .heatmap__cell { background:#2A2823; }
[data-theme="dark"] .heatmap__cell--l1 { background:rgba(211,184,135,.25); }
[data-theme="dark"] .heatmap__cell--l2 { background:rgba(211,184,135,.45); }
[data-theme="dark"] .heatmap__cell--l3 { background:rgba(211,184,135,.65); }
[data-theme="dark"] .heatmap__cell--l4 { background:var(--hf-accent); }
.heatmap__months { display:flex; gap:3px; margin-bottom:6px; }
.heatmap__months span { font-size:9px; color:var(--hf-fg-subtle); letter-spacing:.06em; text-transform:uppercase; font-family:var(--hf-font-mono); }

/* ── Purpose ── */
.rail__star { font-family:var(--hf-font-serif); font-style:italic; font-size:12.5px; line-height:1.45; color:var(--hf-fg-muted); padding:0 8px 14px; margin-top:-8px; border-bottom:1px solid var(--hf-border); margin-bottom:4px; white-space:normal; }
.rail__star:empty { display:none; }
.purpose-star { background:var(--hf-bg-raised); border:1px solid var(--hf-border); border-left:3px solid var(--hf-sand-400); border-radius:10px; padding:28px 32px; margin-bottom:20px; }
.purpose-star__field { font-family:var(--hf-font-serif); font-size:28px; line-height:1.35; color:var(--hf-fg); letter-spacing:-0.01em; width:100%; border:0; background:transparent; outline:none; resize:none; overflow:hidden; display:block; padding:0; }
.purpose-star__field::placeholder { color:var(--hf-fg-subtle); font-style:italic; }
.purpose-identity__field { font-size:14px; line-height:1.75; color:var(--hf-fg-body); width:100%; border:0; background:transparent; outline:none; resize:none; overflow:hidden; display:block; padding:0; font-family:var(--hf-font-sans); }
.purpose-identity__field::placeholder { color:var(--hf-fg-subtle); font-style:italic; }
.goal { padding:18px 0; border-bottom:1px solid var(--hf-border); }
.goal:last-child { border-bottom:0; }
.goal__head { display:flex; align-items:baseline; justify-content:space-between; gap:14px; }
.goal__title { font-family:var(--hf-font-serif); font-size:19px; color:var(--hf-fg); letter-spacing:-0.01em; line-height:1.25; flex:1; }
.goal__title--dim { color:var(--hf-fg-muted); }
.goal__nums { font-family:var(--hf-font-mono); font-size:11px; color:var(--hf-fg-muted); white-space:nowrap; }
.goal__nums b { color:var(--hf-fg); font-weight:400; }
.goal__bar { height:4px; border-radius:2px; background:var(--hf-bone-200); margin-top:12px; overflow:hidden; }
.goal__bar i { display:block; height:100%; background:var(--hf-sand-400); border-radius:2px; transition:width 400ms var(--hf-ease-out); }
[data-theme="dark"] .goal__bar { background:#2A2823; }
.goal__actions { display:flex; gap:6px; margin-top:12px; align-items:center; flex-wrap:wrap; }
.goal-new { display:flex; gap:8px; margin-top:18px; flex-wrap:wrap; }
.goal-new .input { flex:1; min-width:180px; }
.goal-new .input--num { flex:0 0 110px; min-width:110px; }
.session-star { font-family:var(--hf-font-serif); font-style:italic; font-size:15px; color:var(--hf-fg-muted); text-align:center; max-width:560px; line-height:1.6; margin-bottom:18px; }
.session-goal { display:flex; justify-content:center; margin:-8px 0 22px; }
.warn-banner { background:rgba(192,57,43,.08); border:1px solid rgba(192,57,43,.3); color:#C0392B; border-radius:8px; padding:12px 16px; font-size:13px; line-height:1.5; margin-bottom:20px; }

/* ── Insights card ── */
.insights { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:20px; }
.insight-chip { font-size:12px; padding:5px 12px 5px 10px; border-radius:9999px; background:var(--hf-bg-subtle); border:1px solid var(--hf-border); color:var(--hf-fg-body); font-family:var(--hf-font-mono); display:inline-flex; align-items:center; gap:6px; }
.insight-chip svg { color:var(--hf-fg-muted); flex-shrink:0; }
.insight-chip b { color:var(--hf-fg); font-weight:500; }

/* ── Mobile drawer trigger (hidden on desktop) ── */
.rail-backdrop { display:none; }
.iconbtn--menu { display:none; }

/* ── Responsive ────────────────────────────────────────────────────────────
   Below 860px the rail becomes an off-canvas drawer and every fixed grid
   collapses. Uses dvh so mobile browser chrome can't clip the timer. */
@media (max-width: 860px) {
  #root { height:100dvh; }
  .app { grid-template-columns:1fr; height:100dvh; }

  .rail {
    position:fixed; top:0; left:0; bottom:0; width:264px; max-width:82vw; z-index:60;
    transform:translateX(-100%); transition:transform 220ms var(--hf-ease-out);
    box-shadow:var(--hf-shadow-xl); overflow-y:auto;
    padding-top:calc(18px + env(safe-area-inset-top));
    padding-bottom:calc(18px + env(safe-area-inset-bottom));
  }
  .rail--open { transform:translateX(0); }
  .rail-backdrop { display:block; position:fixed; inset:0; z-index:55; background:rgba(18,17,14,.4); backdrop-filter:blur(2px); animation:fadeIn 160ms var(--hf-ease-out); }
  .rail__item { padding:11px 10px; font-size:14px; }

  .iconbtn--menu { display:flex; }
  .topbar { padding:0 12px; padding-top:env(safe-area-inset-top); height:calc(52px + env(safe-area-inset-top)); gap:8px; }
  .topbar__crumb { font-size:11px; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .topbar__crumb span:not(.badge) { display:none; }
  .topbar__crumb svg { display:none; }

  .page { padding:28px 20px calc(48px + env(safe-area-inset-bottom)); }
  .h-serif { font-size:32px !important; }

  .focus-stage { min-height:auto; padding:76px 20px calc(48px + env(safe-area-inset-bottom)); justify-content:flex-start; }
  .focus-meta { position:static; transform:none; flex-wrap:wrap; justify-content:center; gap:10px; margin-bottom:22px; white-space:normal; }
  .focus-task { font-size:24px; margin-bottom:26px; }
  .session-star { font-size:14px; margin-bottom:14px; }
  .ring { width:min(300px,78vw); height:min(300px,78vw); }
  .ring__timer { font-size:clamp(56px,17vw,84px); }
  .focus-actions { margin-top:28px; width:100%; }
  .focus-actions > div { flex-wrap:wrap; justify-content:center; }
  .btn--xl { padding:14px 28px; }
  .session-complete { padding:0; }
  .session-complete__task { font-size:24px; }

  /* Every fixed multi-column grid collapses */
  .kpi-grid { grid-template-columns:repeat(2,1fr); gap:22px 14px; }
  .kpi__value { font-size:30px; }
  .sound-grid,
  .stoic-phil-grid,
  .stoic-phil-grid--2,
  .grid-2,
  .stoic-principles,
  .stoic-practices,
  .dp-grid,
  .tracker-summary { grid-template-columns:1fr; }

  .session-row { grid-template-columns:1fr auto; gap:4px 12px; padding:12px 0; }
  .session-row__time { grid-column:1/-1; }
  .session-row__del { opacity:1; }
  .tracker-entry { grid-template-columns:1fr auto; gap:4px 12px; }
  .tracker-entry__time { grid-column:1/-1; }

  .tracker-toast { width:auto; left:12px; right:12px; transform:none; bottom:calc(16px + env(safe-area-inset-bottom)); }
  @keyframes slideUp { from{opacity:0;transform:translateY(14px);} to{opacity:1;transform:translateY(0);} }
  .tracker-toast__actions { flex-wrap:wrap; }

  .cmdk-backdrop { padding:16px; align-items:flex-start; padding-top:80px; }
  .cmdk { width:100%; }

  .stoic-daily { padding:22px 20px; }
  .stoic-daily__quote { font-size:19px; }
  .purpose-star { padding:22px 20px; }
  .purpose-star__field { font-size:22px; }
  .breath-prompt { font-size:30px; }
  .heatmap { overflow-x:auto; padding-bottom:6px; }
  .stats-periods { flex-wrap:wrap; }
}

/* Touch devices: hover styles that latch on tap are worse than none */
@media (hover: none) {
  .session-row__del { opacity:1; }
  .btn:active { transform:translateY(1px); }
}

const localDate  = (d) => { const dt=d?(d instanceof Date?d:new Date(d)):new Date(); return `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,"0")}-${String(dt.getDate()).padStart(2,"0")}`; };

const quoteOfDay = () => STOIC_QUOTES[dayNumber()%STOIC_QUOTES.length];

// Fixed 30-min clock intervals (:00 and :30 of each hour)
const getSecsToNextHalfHour = () => {
  const now = new Date();
  const mins = now.getMinutes(), secs = now.getSeconds();
  const minsToNext = mins < 30 ? (30-mins) : (60-mins);
  return Math.max(1, minsToNext*60 - secs);
};
const getLastHalfHourDate = () => {
  const now = new Date();
  const d = new Date(now);
  d.setSeconds(0); d.setMilliseconds(0);
  d.setMinutes(now.getMinutes() < 30 ? 0 : 30);
  return d;
};
// All complete 30-min slots from 00:00 up to (not including) the current slot — most recent first
const getPastSlots = () => {
  const now = new Date();
  const curSlotStart = new Date(now);
  curSlotStart.setSeconds(0, 0);
  curSlotStart.setMinutes(now.getMinutes() < 30 ? 0 : 30);
  const slots = [];
  const dayStart = new Date(now); dayStart.setHours(0, 0, 0, 0);
  let s = new Date(dayStart);
  while (s < curSlotStart) {
    const e = new Date(s); e.setMinutes(e.getMinutes() + 30);
    slots.push({ start: new Date(s), end: new Date(e), label: `${formatHHMM(s)} — ${formatHHMM(e)}` });
    s.setMinutes(s.getMinutes() + 30);
  }
  return slots.reverse();
};
const getWeekStart = () => {
  const d = new Date(); const day = (d.getDay()+6)%7;
  const monday = new Date(d); monday.setDate(d.getDate()-day);
  return localDate(monday);
};
const fmtMins = (m) => m>=60?`${Math.floor(m/60)}h${m%60?` ${m%60}m`:""}`:`${m}m`;
const fmtDur  = (s) => { const h=Math.floor(s/3600),m=Math.floor((s%3600)/60); return h?`${h}h ${m}m`:`${m}m`; };
// Returns the absolute ms timestamp of the next :00 or :30 mark
const getNextHalfHourMs = () => {
  const now=new Date(), next=new Date(now);
  next.setSeconds(0); next.setMilliseconds(0);
  if(now.getMinutes()<30) next.setMinutes(30);
  else { next.setMinutes(0); next.setHours(next.getHours()+1); }
  return next.getTime();
};

/* ── Sound Engine ── */
const SoundEngine = (() => {
  let ctx=null, master=null, active=[];
  const init = () => {
    if(ctx) return;
    ctx = new (window.AudioContext||window.webkitAudioContext)();
    master = ctx.createGain(); master.gain.value=0.75; master.connect(ctx.destination);
  };
  const cleanup = () => { active.forEach(n=>{ try{n.stop();}catch(e){} }); active=[]; };
  const mkNoise = (type,secs=10) => {
    const len=ctx.sampleRate*secs, buf=ctx.createBuffer(1,len,ctx.sampleRate), d=buf.getChannelData(0);
    if(type==="white")  { for(let i=0;i<len;i++) d[i]=Math.random()*2-1; }
    else if(type==="brown") { let last=0; for(let i=0;i<len;i++){ const w=Math.random()*2-1; d[i]=(last+0.02*w)/1.02; last=d[i]; d[i]*=3.5; } }
    else if(type==="pink")  { let b0=0,b1=0,b2=0,b3=0,b4=0,b5=0,b6=0; for(let i=0;i<len;i++){ const w=Math.random()*2-1; b0=0.99886*b0+w*0.0555179; b1=0.99332*b1+w*0.0750759; b2=0.96900*b2+w*0.1538520; b3=0.86650*b3+w*0.3104856; b4=0.55000*b4+w*0.5329522; b5=-0.7616*b5-w*0.0168980; d[i]=(b0+b1+b2+b3+b4+b5+b6+w*0.5362)*0.11; b6=w*0.115926; } }
    return buf;
  };
  const src = (type,secs=10) => { const s=ctx.createBufferSource(); s.buffer=mkNoise(type,secs); s.loop=true; active.push(s); return s; };
  const flt = (type,freq,Q=1) => { const f=ctx.createBiquadFilter(); f.type=type; f.frequency.value=freq; f.Q.value=Q; return f; };
  const gn  = (v) => { const g=ctx.createGain(); g.gain.value=v; return g; };
  const lfo = (freq,depth,tgt) => { const osc=ctx.createOscillator(), mod=ctx.createGain(); osc.frequency.value=freq; mod.gain.value=depth; osc.connect(mod); mod.connect(tgt.gain); osc.start(); active.push(osc); };
  const chain = (...ns) => { for(let i=0;i<ns.length-1;i++) ns[i].connect(ns[i+1]); ns[ns.length-1].connect(master); ns.forEach(n=>{ if(typeof n.start==="function") n.start(); }); };
  const profiles = {
    rain()  { chain(src("white"), flt("highpass",350), flt("lowpass",7000), gn(0.22)); },
    forest(){ chain(src("brown"), flt("lowpass",650), gn(0.28)); chain(src("white"), flt("highpass",4000), flt("lowpass",9500), gn(0.07)); },
    waves() { const g=gn(0.32); lfo(0.09,0.22,g); chain(src("brown"), flt("lowpass",700), g); },
    cafe()  { chain(src("pink"), flt("bandpass",750,0.6), gn(0.20)); },
    brown() { chain(src("brown"), flt("lowpass",1100), gn(0.30)); },
    fire()  { const g=gn(0.26); lfo(2.4,0.14,g); chain(src("brown"), flt("lowpass",480), g); chain(src("white"), flt("highpass",1800), flt("lowpass",5500), gn(0.035)); },
  };
  return {
    play(id){ try{ init(); cleanup(); if(ctx.state==="suspended") ctx.resume(); profiles[id]?.(); } catch(e){ console.warn("SoundEngine:",e); } },
    stop(){ cleanup(); },
  };
})();

function playChime() {
  try {
    const ctx=new (window.AudioContext||window.webkitAudioContext)();
    const play=(freq,t0,dur,vol=0.10)=>{
      const osc=ctx.createOscillator(), g=ctx.createGain();
      osc.connect(g); g.connect(ctx.destination); osc.type="sine"; osc.frequency.value=freq;
      g.gain.setValueAtTime(0,t0); g.gain.linearRampToValueAtTime(vol,t0+0.06); g.gain.exponentialRampToValueAtTime(0.001,t0+dur);
      osc.start(t0); osc.stop(t0+dur);
    };
    const t=ctx.currentTime; play(523.25,t,0.9); play(659.25,t+0.35,1.0); play(783.99,t+0.70,1.4);
  } catch(e){}
}

const Session = ({ session, setSession, task, setTask, phase, onBegin, onPause, onEnd, onAdd5min, onStartBreak, onNewSession, breakRemaining, quote, mits, onBreathe, onRate, onMitClick, northStar, activeGoal, onOpenPurpose }) => {
  const R=46, CIRC=2*Math.PI*R;
  const [editDur, setEditDur] = useState(false);
  const [durVal,  setDurVal]  = useState("");
  const [rated,   setRated]   = useState(null);
  const isIdle=phase==="idle", isFocusing=phase==="focusing", isBreak=phase==="break";
  const isPaused=isIdle&&session.remaining<session.total;
  const ringRemaining=isBreak?breakRemaining:session.remaining;
  const ringTotal=isBreak?(MODES.find(m=>m.id===session.mode)?.breakDur||300):session.total;
  const ringPct=ringTotal>0?(ringTotal-ringRemaining)/ringTotal:0;
  const ringOffset=CIRC*(1-ringPct);
  const applyDur=()=>{ const mins=parseInt(durVal); if(mins>=1&&mins<=480) setSession(s=>({...s,total:mins*60,remaining:mins*60})); setEditDur(false); };
  const hasMits = mits && mits.tasks && mits.tasks.some(t=>t);

  // Reset rating when we exit complete phase
  useEffect(()=>{ if(phase!=="complete") setRated(null); },[phase]);

  if (phase==="complete") {
    const mode=MODES.find(m=>m.id===session.mode);
    const breakMins=Math.round((mode?.breakDur||300)/60);
    return (
      <div className="focus-stage">
        <div className="session-complete">
          <div className="session-complete__label">Session recorded.</div>
          <div className="session-complete__task">{task||"Untitled session."}</div>
          <StarRating rated={rated} onRate={v=>{ setRated(v); onRate(v); }}/>
          <div style={{display:"flex",gap:10,marginTop:24,flexWrap:"wrap",justifyContent:"center"}}>
            <button className="btn btn--primary btn--lg" onClick={onStartBreak}><Icon name="coffee" size={14}/> Start break · {breakMins}m</button>
            <button className="btn btn--secondary btn--lg" onClick={onNewSession}><Icon name="play" size={14}/> New session</button>
          </div>
        </div>
      </div>
    );
  }

  return (
    <div className="focus-stage">
      <div className="focus-meta">
        <span>SESSION <b>{String(session.index).padStart(2,"0")}</b></span>
        <span>·</span>
        <span>MODE <b>{MODES.find(m=>m.id===session.mode)?.label}</b></span>
        <span>·</span>
        <span>TARGET{" "}
          {editDur
            ? <input className="dur-edit" type="number" min="1" max="480" value={durVal} onChange={e=>setDurVal(e.target.value)} onKeyDown={e=>{if(e.key==="Enter"||e.key==="Escape")applyDur();}} onBlur={applyDur} autoFocus/>
            : <b className={isIdle&&!isPaused?"dur-target":""} onClick={()=>{if(isIdle&&!isPaused){setDurVal(String(Math.floor(session.total/60)));setEditDur(true);}}}>{fmt(session.total)}</b>
          }
        </span>
      </div>

      {/* Why you're here, before what you're doing */}
      {isIdle && !isPaused && northStar && <div className="session-star">{northStar}</div>}

      {isIdle&&!isPaused
        ? <input className="focus-task" style={{width:"100%",maxWidth:640}} placeholder="What are you working on?" value={task} onChange={e=>setTask(e.target.value)}/>
        : <div className="focus-task" style={{fontStyle:"normal"}}>{task||"Untitled session."}</div>
      }

      {/* Which goal this session will count toward */}
      {isIdle && !isPaused && (
        <div className="session-goal">
          {activeGoal
            ? <button className="badge badge--accent" onClick={onOpenPurpose} title="Change on the Purpose page">
                <span className="dot"/>Counts toward · {activeGoal.title}
              </button>
            : <button className="badge badge--neutral" onClick={onOpenPurpose}>
                <Icon name="compass" size={12}/> No goal set — this time won't be attributed
              </button>}
        </div>
      )}

      {/* Today's priorities reminder — click to pre-fill task */}
      {isIdle && !isPaused && hasMits && (
        <div className="session-mits">
          {mits.tasks.map((t,i)=>t?(
            <span key={i}
              className={"session-mit session-mit--clickable"+(mits.done[i]?" session-mit--done":"")}
              title="Click to set as task"
              onClick={()=>{ if(!mits.done[i]) onMitClick(t); }}>
              {t}
            </span>
          ):null)}
        </div>
      )}

      <div className={"ring"+(isFocusing?" ring--breathing":"")}>
        <svg viewBox="0 0 100 100">
          <circle className="ring__bg" cx="50" cy="50" r={R}/>
          <circle className={"ring__fg"+(isBreak?" ring__fg--break":"")} cx="50" cy="50" r={R} strokeDasharray={CIRC} strokeDashoffset={ringOffset}/>
        </svg>
        <div className="ring__inner">
          <div className="ring__timer">{fmt(ringRemaining)}</div>
          <div className="ring__label">{isBreak?"Break":isFocusing?"Focusing":isPaused?"Paused":"Ready"}</div>
        </div>
      </div>

      <div className="focus-actions">
        {isIdle&&!isPaused&&(
          <>
            <div style={{display:"flex",gap:6}}>
              {MODES.map(m=>(
                <button key={m.id} className={"btn "+(session.mode===m.id?"btn--secondary":"btn--ghost")} style={session.mode===m.id?{borderColor:"var(--hf-sand-400)"}:{}} onClick={()=>setSession(s=>({...s,mode:m.id,total:m.dur,remaining:m.dur}))}>
                  {m.label}
                </button>
              ))}
            </div>
            <button className="btn btn--primary btn--xl" onClick={onBegin}><Icon name="play" size={14}/> Begin</button>
          </>
        )}
        {isFocusing&&(<>
          <button className="btn btn--secondary btn--lg" onClick={onPause}><Icon name="pause" size={14}/> Pause</button>
          <button className="btn btn--ghost btn--lg" onClick={onAdd5min}><Icon name="plus" size={14}/> +5 min</button>
          <button className="btn btn--ghost btn--lg" onClick={onEnd}><Icon name="stop" size={14}/> End session</button>
        </>)}
        {isPaused&&(<>
          <button className="btn btn--primary btn--lg" onClick={onBegin}><Icon name="play" size={14}/> Return</button>
          <button className="btn btn--ghost btn--lg" onClick={onEnd}><Icon name="stop" size={14}/> End session</button>
        </>)}
        {isBreak&&<button className="btn btn--ghost btn--lg" onClick={onNewSession}>Skip break</button>}
      </div>

      {/* Pre-focus breath options */}
      {isIdle && !isPaused && (
        <div className="breath-opts">
          <span className="breath-opts__label">Breathe</span>
          {[1,2,3].map(m=>(
            <button key={m} className="breath-opt" onClick={()=>onBreathe(m)}>{m} min</button>
          ))}
        </div>
      )}

      {isIdle&&!isPaused&&(
        <div className="session-quote">{quote.text}<cite>— {quote.author}</cite></div>
      )}
    </div>
  );
};

/* ── Heatmap ── */
const Heatmap = ({ sessions }) => {
  const dayMap = {};
  sessions.forEach(s=>{ if(s.date){ const d=localDate(new Date(s.date)); dayMap[d]=(dayMap[d]||0)+Math.floor(s.dur/60); } });
  const today = new Date(); today.setHours(12,0,0,0);
  // Build 91 days (13 complete weeks), starting from the Monday 13 weeks ago
  const startDay = new Date(today);
  startDay.setDate(today.getDate() - today.getDay() + 1 - 12*7); // Monday 13 weeks ago
  const cells = []; // array of 91 dates in order
  for(let i=0;i<91;i++){
    const d=new Date(startDay); d.setDate(startDay.getDate()+i);
    const key=localDate(d);
    cells.push({key,mins:dayMap[key]||0,d:new Date(d)});
  }
  // Group into 13 columns of 7
  const weeks=[]; for(let w=0;w<13;w++) weeks.push(cells.slice(w*7,w*7+7));
  const getLevel=(mins)=>{ if(mins===0)return 0; if(mins<20)return 1; if(mins<45)return 2; if(mins<90)return 3; return 4; };
  // Month labels: one per week-column based on which month the Monday falls in
  const monthLabels = weeks.map((wk,i)=>{
    if(i===0) return wk[0].d.toLocaleDateString("en-US",{month:"short"});
    const prev=weeks[i-1][0].d.getMonth();
    const cur=wk[0].d.getMonth();
    return cur!==prev ? wk[0].d.toLocaleDateString("en-US",{month:"short"}) : "";
  });
  const todayStr2 = localDate();
  return (
    <div className="heatmap">
      <div className="heatmap__months">
        {monthLabels.map((label,i)=>(
          <div key={i} style={{width:13+3,flexShrink:0,overflow:"visible"}}>
            <span>{label}</span>
          </div>
        ))}
      </div>
      <div className="heatmap__grid">
        {weeks.map((wk,wi)=>(
          <div key={wi} className="heatmap__col">
            {wk.map((cell,di)=>(
              <div key={di}
                className={"heatmap__cell"+(getLevel(cell.mins)>0?` heatmap__cell--l${getLevel(cell.mins)}`:"")}
                title={`${cell.key}${cell.mins>0?` · ${fmtMins(cell.mins)}`:""}`}
                style={cell.key===todayStr2?{outline:"1.5px solid var(--hf-sand-500)",outlineOffset:"1px"}:{}}
              />
            ))}
          </div>
        ))}
      </div>
      <div style={{display:"flex",gap:6,alignItems:"center",marginTop:10,justifyContent:"flex-end"}}>
        <span style={{fontSize:10,color:"var(--hf-fg-subtle)"}}>Less</span>
        {[0,1,2,3,4].map(l=><div key={l} className={"heatmap__cell"+(l>0?` heatmap__cell--l${l}`:"")} style={{width:11,height:11}}/>)}
        <span style={{fontSize:10,color:"var(--hf-fg-subtle)"}}>More</span>
      </div>
    </div>
  );
};

/* ── calcStreak / insights ── */
const calcStreak = (sessions) => {
  const days=[...new Set(sessions.map(s=>s.date?localDate(new Date(s.date)):null).filter(Boolean))].sort();
  if(!days.length) return 0;
  const today=localDate();
  const yest=new Date(); yest.setDate(yest.getDate()-1);
  const ystStr=localDate(yest);
  if(days[days.length-1]!==today&&days[days.length-1]!==ystStr) return 0;
  let streak=1;
  for(let i=days.length-2;i>=0;i--){
    const diff=Math.round((new Date(days[i+1]+"T12:00:00")-new Date(days[i]+"T12:00:00"))/(86400000));
    if(diff===1) streak++; else break;
  }
  return streak;
};
const getBestDay = (sessions) => {
  const dayNames=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
  const byDay=Array(7).fill(0);
  sessions.forEach(s=>{ if(s.date){ const d=new Date(s.date); byDay[d.getDay()]+=Math.floor(s.dur/60); } });
  const max=Math.max(...byDay);
  if(max===0) return null;
  return dayNames[byDay.indexOf(max)];
};
const getAvgLen = (sessions) => {
  if(!sessions.length) return null;
  return Math.floor(sessions.reduce((a,s)=>a+s.dur,0)/sessions.length/60);
};

/* ── Stats ── */

  const [period, setPeriod] = useState("week");
  const today   = todayStr();
  const ws      = getWeekStart();
  const monthPfx= localDate().slice(0,7);
  const filtered = sessions.filter(s=>{
    if(!s.date) return false;
    const d=localDate(new Date(s.date));
    if(period==="today") return d===today;
    if(period==="week")  return d>=ws;
    if(period==="month") return d.startsWith(monthPfx);
    return true;
  });
  const totalSecs=filtered.reduce((a,s)=>a+s.dur,0);
  const modeMap={};
  filtered.forEach(s=>{ modeMap[s.mode]=(modeMap[s.mode]||0)+s.dur; });
  const todayDayIdx=(new Date().getDay()+6)%7;
  const days=["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
  const weekMins=Array(7).fill(0);
  const wsDate=new Date(ws+"T00:00:00");
  sessions.filter(s=>s.date&&localDate(new Date(s.date))>=ws).forEach(s=>{
    const sLocal=localDate(new Date(s.date));
    const diff=Math.floor((new Date(sLocal+"T00:00:00")-wsDate)/86400000);
    if(diff>=0&&diff<7) weekMins[diff]+=Math.floor(s.dur/60);
  });
  const maxMins=Math.max(...weekMins,1);
  const showChart=period==="week"||period==="today";
  const byMonth={};
  sessions.forEach(s=>{ if(s.date){ const m=localDate(new Date(s.date)).slice(0,7); byMonth[m]=(byMonth[m]||0)+s.dur; } });

  const streak   = calcStreak(sessions);

  const flowSessions = sessions.filter(s=>s.quality>=4).length;

        </div>

      <div className="stats-periods">
        {[{id:"today",label:"Today"},{id:"week",label:"This week"},{id:"month",label:"This month"},{id:"all",label:"All time"}].map(p=>(
          <button key={p.id} className={"stats-period"+(period===p.id?" stats-period--active":"")} onClick={()=>setPeriod(p.id)}>{p.label}</button>
        ))}
      </div>
      <div className="card-s" style={{marginBottom:24}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"baseline",marginBottom:24}}>
          <div>
            <div className="eyebrow">Total focused</div>
            <div style={{fontFamily:"var(--hf-font-mono)",fontSize:52,fontWeight:300,letterSpacing:"-0.02em",lineHeight:1,marginTop:8}}>
              {totalSecs?fmtDur(totalSecs):<span style={{color:"var(--hf-fg-subtle)"}}>—</span>}

          </div>
          <div style={{display:"flex",gap:32,textAlign:"right"}}>
            <div><div className="eyebrow">Sessions</div><div style={{fontFamily:"var(--hf-font-mono)",fontSize:22,fontWeight:400,marginTop:8,color:"var(--hf-fg-body)"}}>{filtered.length}</div></div>

        ):(
          <>
            <div className="chart">
              {weekMins.map((m,i)=>(

      </div>

  );
};

/* ── Planning ── */
const Planning = ({ mits, setMits }) => {
  const today = todayStr();
  const todayPlan = mits[today] || { tasks:["","",""], done:[false,false,false] };
  const setTask = (i,val) => setMits(m=>({ ...m, [today]:{ ...todayPlan, tasks:todayPlan.tasks.map((t,j)=>j===i?val:t) } }));
  const toggleDone = (i) => {
    if (!todayPlan.tasks[i]) return;
    setMits(m=>({ ...m, [today]:{ ...todayPlan, done:todayPlan.done.map((d,j)=>j===i?!d:d) } }));
  };
  const pastDays = Object.entries(mits)
    .filter(([d])=>d!==today)
    .sort((a,b)=>b[0].localeCompare(a[0]))
    .slice(0,7);
  const fmtDay = (d) => new Date(d+"T12:00:00").toLocaleDateString("en-US",{weekday:"short",month:"short",day:"numeric"});
  const completedToday = todayPlan.tasks.filter((t,i)=>t&&todayPlan.done[i]).length;
  const totalToday     = todayPlan.tasks.filter(t=>t).length;

  return (
    <div className="page">
      <div style={{marginBottom:32}}>
        <div className="eyebrow">Practice</div>
        <h1 className="h-serif" style={{fontSize:44,margin:"8px 0 0"}}>Daily planning</h1>
        <p style={{color:"var(--hf-fg-muted)",fontSize:13,marginTop:8,lineHeight:1.6}}>Three things that would make today a success. No more.</p>
      </div>

      <div className="card-s" style={{marginBottom:10}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}>
          <div className="eyebrow">{new Date().toLocaleDateString("en-US",{weekday:"long",month:"long",day:"numeric"})}</div>
          {totalToday>0&&<span className="badge badge--neutral">{completedToday}/{totalToday} done</span>}
        </div>
        {[0,1,2].map(i=>(
          <div key={i} className="mit-row">
            <input type="checkbox" className="mit-check" checked={todayPlan.done[i]&&!!todayPlan.tasks[i]} onChange={()=>toggleDone(i)}/>
            <input className={"mit-input"+(todayPlan.done[i]&&todayPlan.tasks[i]?" mit-input--done":"")}
              placeholder={["Most important task…","Second priority…","Third priority…"][i]}
              value={todayPlan.tasks[i]}
              onChange={e=>setTask(i,e.target.value)}/>
          </div>
        ))}
        <p style={{fontSize:12,color:"var(--hf-fg-subtle)",marginTop:16,fontStyle:"italic",lineHeight:1.6}}>
          "It is not that we have a short time to live, but that we waste a great deal of it." — Seneca
        </p>
      </div>

      {pastDays.length>0&&(
        <>
          <h2 className="h-serif" style={{fontSize:22,margin:"32px 0 14px"}}>Recent plans</h2>
          <div className="plan-history">
            {pastDays.map(([d,plan])=>{
              const tasks=plan.tasks||[]; const done=plan.done||[];
              const nonEmpty=tasks.filter(t=>t);
              if(nonEmpty.length===0) return null;
              return (
                <div key={d} className="plan-day">
                  <div className="plan-day__date">{fmtDay(d)}</div>
                  <div className="plan-day__tasks">
                    {tasks.map((t,i)=>t?(
                      <div key={i} className={"plan-day__task"+(done[i]?" plan-day__task--done":"")}>
                        <div className={"plan-day__dot"+(done[i]?" plan-day__dot--done":"")}/>
                        {t}
                      </div>
                    ):null)}
                  </div>
                </div>
              );
            })}
          </div>
        </>
      )}
    </div>
  );
};

/* ── Breath ── */
const Breath = ({ onDone, duration=60 }) => {
  const seq=["Inhale","Hold","Exhale","Hold"];
  const [i, setI] = useState(0);
  const [remaining, setRemaining] = useState(duration);
  useEffect(()=>{
    const t=setInterval(()=>setI(v=>(v+1)%seq.length),3500);
    const end=setTimeout(onDone, duration*1000);
    return ()=>{ clearInterval(t); clearTimeout(end); };
  },[duration]);
  useEffect(()=>{
    const t=setInterval(()=>setRemaining(r=>Math.max(0,r-1)),1000);
    return ()=>clearInterval(t);
  },[]);
  const mins=Math.floor(remaining/60), secs=remaining%60;
  const timeStr=mins>0?`${mins}:${String(secs).padStart(2,"0")}`:`${secs}s`;
  return (
    <div className="breath-stage">
      <div className="breath-prompt">Take a breath.</div>
      <div className="breath-circle"><div className="breath-dot"/></div>
      <div className="breath-cue">{seq[i]}</div>
      <div style={{fontFamily:"var(--hf-font-mono)",fontSize:14,color:"var(--hf-fg-muted)"}}>{timeStr}</div>
      <button className="btn btn--ghost" onClick={onDone}>Skip</button>
    </div>
  );
};

const CmdK = ({ onClose, onAction }) => {
  const items=[
    {id:"begin",   label:"Begin session",   icon:"play",   kbd:"Space"},
    {id:"pause",   label:"Pause session",   icon:"pause",  kbd:"Space"},
    {id:"purpose", label:"Purpose & goals",  icon:"compass"},
    {id:"today",   label:"Go to today",     icon:"calendar"},
    {id:"stats",   label:"Go to stats",     icon:"stats"},
    {id:"sounds",  label:"Soundscapes",     icon:"mic"},
    {id:"planning",label:"Planning",        icon:"flag"},
    {id:"stoic",   label:"Stoicism",        icon:"book"},
    {id:"breath",  label:"Pre-focus breath",icon:"coffee"},
    {id:"tracker", label:"Time tracker",    icon:"blocks"},
    {id:"lognow",  label:"Log now",         icon:"plus"},
  ];
  const [q,setQ]=useState("");
  const [sel,setSel]=useState(0);
  const filtered=items.filter(it=>it.label.toLowerCase().includes(q.toLowerCase()));
  const handleKey=e=>{
    if(e.key==="ArrowDown"){e.preventDefault();setSel(v=>Math.min(v+1,filtered.length-1));}
    if(e.key==="ArrowUp")  {e.preventDefault();setSel(v=>Math.max(v-1,0));}
    if(e.key==="Enter"&&filtered[sel]){onAction(filtered[sel].id);onClose();}
  };
  return (
    <div className="cmdk-backdrop" onClick={onClose}>
      <div className="cmdk" onClick={e=>e.stopPropagation()}>
        <div className="cmdk__search"><Icon name="search" size={16}/><input autoFocus placeholder="Type a command…" value={q} onChange={e=>{setQ(e.target.value);setSel(0);}} onKeyDown={handleKey}/><span className="cmdk__hint">ESC</span></div>
        <div className="cmdk__list">
          {filtered.map((it,idx)=>(
            <button key={it.id} className={"cmdk__item"+(idx===sel?" cmdk__item--sel":"")} onMouseEnter={()=>setSel(idx)} onClick={()=>{onAction(it.id);onClose();}}>
              <Icon name={it.icon} size={15}/>{it.label}{it.kbd&&<span className="kbd">{it.kbd}</span>}
            </button>
          ))}
          {filtered.length===0&&<div style={{padding:16,color:"var(--hf-fg-muted)",fontSize:13,textAlign:"center"}}>Nothing matches.</div>}
        </div>
      </div>
    </div>
  );
};

/* ── Daily Practices ── */
const DailyPractices = ({ practiceLog, onLogPractice }) => {
  const R=46, CIRC=2*Math.PI*R;
  const [timerPhase, setTimerPhase] = useState("idle"); // idle | running | complete
  const [activePractice, setActivePractice] = useState(null);
  const [remaining, setRemaining] = useState(0);

  const timerTsRef      = useRef(0);
  const timerTotalRef   = useRef(0);
  const timerElapsedRef = useRef(0);
  const timerPhaseRef   = useRef("idle");

  useEffect(()=>{ timerPhaseRef.current=timerPhase; },[timerPhase]);

  // Wall-clock timer tick
  useEffect(()=>{
    if(timerPhase!=="running") return;
    const tick=setInterval(()=>{
      const elapsed=timerElapsedRef.current+Math.floor((Date.now()-timerTsRef.current)/1000);
      setRemaining(Math.max(0,timerTotalRef.current-elapsed));
    },500);
    return ()=>clearInterval(tick);
  },[timerPhase]);

  // Visibility change catch-up
  useEffect(()=>{
    const onVis=()=>{
      if(document.hidden||timerPhaseRef.current!=="running") return;
      const elapsed=timerElapsedRef.current+Math.floor((Date.now()-timerTsRef.current)/1000);
      setRemaining(Math.max(0,timerTotalRef.current-elapsed));
    };
    document.addEventListener("visibilitychange",onVis);
    return ()=>document.removeEventListener("visibilitychange",onVis);
  },[]);

  // Practice complete
  useEffect(()=>{
    if(timerPhase==="running"&&remaining===0&&activePractice){
      const pr=PRACTICES.find(p=>p.id===activePractice);
      playChime();
      onLogPractice({ id:Date.now(), practiceId:activePractice, name:pr.name, date:new Date().toISOString(), duration:timerTotalRef.current });
      setTimerPhase("complete");
    }
  },[remaining,timerPhase]);

  const beginPractice=(pr)=>{
    timerTotalRef.current=pr.duration;
    timerTsRef.current=Date.now();
    timerElapsedRef.current=0;
    setRemaining(pr.duration);
    setActivePractice(pr.id);
    setTimerPhase("running");
  };
  const cancelTimer=()=>{ setTimerPhase("idle"); setActivePractice(null); setRemaining(0); };
  const pledgePractice=(pr)=>{
    onLogPractice({ id:Date.now(), practiceId:pr.id, name:pr.name, date:new Date().toISOString(), duration:null });
  };

  const today=todayStr();
  const todayLog=practiceLog.filter(e=>e.date&&localDate(new Date(e.date))===today);
  const doneIds=new Set(todayLog.map(e=>e.practiceId));

  // Timer stage
  if(timerPhase==="running"||timerPhase==="complete"){
    const pr=PRACTICES.find(p=>p.id===activePractice);
    const pct=timerTotalRef.current>0?(timerTotalRef.current-remaining)/timerTotalRef.current:1;
    const offset=CIRC*(1-pct);
    return (
      <div className="focus-stage">
        <div className="dp-timer__name">{pr.name}</div>
        <div className="dp-timer__desc">{pr.instruction}</div>
        <div className="ring ring--dp">
          <svg viewBox="0 0 100 100">
            <circle className="ring__bg" cx="50" cy="50" r={R}/>
            <circle className="ring__fg" cx="50" cy="50" r={R} strokeDasharray={CIRC} strokeDashoffset={offset}/>
          </svg>
          <div className="ring__inner">
            <div className="ring__timer" style={{fontSize:76}}>{fmt(remaining)}</div>
            <div className="ring__label">{timerPhase==="complete"?"Complete":"Practice"}</div>
          </div>
        </div>
        {timerPhase==="complete"?(
          <div style={{textAlign:"center",display:"flex",flexDirection:"column",alignItems:"center",gap:10}}>
            <div style={{fontSize:13,color:"var(--hf-fg-muted)"}}>Practice recorded for today.</div>
            <button className="btn btn--primary btn--lg" onClick={cancelTimer}><Icon name="check" size={14}/> Done</button>
          </div>
        ):(
          <div style={{display:"flex",gap:10}}>
            <button className="btn btn--ghost btn--lg" onClick={cancelTimer}><Icon name="x" size={14}/> Cancel</button>
          </div>
        )}
      </div>
    );
  }

  // Grouped history (last 14 days, excluding today)
  const historyLog=[...practiceLog].filter(e=>e.date&&localDate(new Date(e.date))!==today).sort((a,b)=>b.date.localeCompare(a.date));
  const histByDay={};
  historyLog.forEach(e=>{
    const d=localDate(new Date(e.date));
    if(!histByDay[d]) histByDay[d]=[];
    histByDay[d].push(e);
  });
  const histDays=Object.keys(histByDay).sort((a,b)=>b.localeCompare(a)).slice(0,7);

  return (
    <div className="page">
      <div style={{marginBottom:32}}>
        <div className="eyebrow">Practice</div>
        <h1 className="h-serif" style={{fontSize:44,margin:"8px 0 0"}}>Daily Practices</h1>
        <p style={{color:"var(--hf-fg-muted)",fontSize:13,marginTop:8,lineHeight:1.6}}>Stoic exercises made actionable. One session at a time.</p>
      </div>

      <div className="dp-grid">
        {PRACTICES.map(pr=>{
          const done=doneIds.has(pr.id);
          return (
            <div key={pr.id} className={"dp-card"+(done?" dp-card--done":"")}>
              <div className="dp-card__head">
                <div>
                  <div className="dp-card__name">{pr.name}</div>
                  <div className="dp-card__time">{pr.time}</div>
                </div>
                <Icon name={pr.icon} size={16}/>
              </div>
              <div className="dp-card__desc">{pr.desc}</div>
              {done?(
                <span className="badge badge--success"><span className="dot"/>Done today</span>
              ):pr.duration?(
                <button className="btn btn--primary" onClick={()=>beginPractice(pr)}>
                  <Icon name="play" size={14}/> Begin · {Math.floor(pr.duration/60)} min
                </button>
              ):(
                <button className="btn btn--secondary" onClick={()=>pledgePractice(pr)}>
                  <Icon name="check" size={14}/> Pledge for today
                </button>
              )}
            </div>
          );
        })}
      </div>

      {todayLog.length>0&&(
        <>
          <h2 className="h-serif" style={{fontSize:22,margin:"0 0 14px"}}>Completed today</h2>
          <div style={{marginBottom:32}}>
            {todayLog.map((e,i)=>(
              <div key={i} className="dp-log-entry">
                <span className="dp-log-entry__check"><Icon name="check" size={14}/></span>
                <span className="dp-log-entry__name">{e.name}</span>
                {e.duration&&<span className="dp-log-entry__dur">{fmtDur(e.duration)}</span>}
                <span className="dp-log-entry__time">{new Date(e.date).toLocaleTimeString("en-US",{hour:"2-digit",minute:"2-digit",hour12:false})}</span>
              </div>
            ))}
          </div>
        </>
      )}

      {histDays.length>0&&(
        <>
          <h2 className="h-serif" style={{fontSize:22,margin:"0 0 14px"}}>Recent history</h2>
          {histDays.map(d=>(
            <div key={d} style={{marginBottom:20}}>
              <div style={{fontSize:11,letterSpacing:".1em",textTransform:"uppercase",color:"var(--hf-fg-muted)",fontWeight:500,marginBottom:8}}>
                {new Date(d+"T12:00:00").toLocaleDateString("en-US",{weekday:"short",month:"short",day:"numeric"})}
              </div>
              {histByDay[d].map((e,i)=>(
                <div key={i} className="dp-log-entry">
                  <span className="dp-log-entry__check"><Icon name="check" size={14}/></span>
                  <span className="dp-log-entry__name">{e.name}</span>
                  {e.duration&&<span className="dp-log-entry__dur">{fmtDur(e.duration)}</span>}
                  <span className="dp-log-entry__time">{new Date(e.date).toLocaleTimeString("en-US",{hour:"2-digit",minute:"2-digit",hour12:false})}</span>
                </div>
              ))}
            </div>
          ))}
        </>
      )}

      {practiceLog.length===0&&todayLog.length===0&&(
        <div style={{color:"var(--hf-fg-muted)",fontSize:14,fontStyle:"italic",paddingTop:8}}>No practices recorded yet. Begin one above.</div>
      )}
    </div>
  );
};

// Textarea that grows with its content — keeps the North Star readable as one block
// instead of a scrolling one-liner.
const AutoTextarea = ({ value, onChange, className, placeholder }) => {
  const ref = useRef(null);
  useEffect(()=>{
    const el=ref.current; if(!el) return;
    el.style.height="auto"; el.style.height=el.scrollHeight+"px";
  },[value]);
  return <textarea ref={ref} rows={1} className={className} placeholder={placeholder} value={value} onChange={e=>onChange(e.target.value)}/>;
};

const Purpose = ({ purpose, setPurpose, sessions }) => {
  const [newTitle, setNewTitle] = useState("");
  const [newHours, setNewHours] = useState("");
  const goals  = purpose.goals || [];
  const active = goals.filter(g=>!g.archived);
  const done   = goals.filter(g=>g.archived);
  const hoursFor = id => sessions.reduce((a,s)=>a+(s.goalId===id?(s.dur||0):0),0)/3600;

  const patch = p => setPurpose(prev=>({...prev,...p}));
  const addGoal = () => {
    const title=newTitle.trim(); if(!title) return;
    const target=Math.min(5000,Math.max(1,parseInt(newHours)||40));
    const g={id:"g"+Date.now(),title,target,archived:false,createdAt:new Date().toISOString()};
    setPurpose(p=>({...p,goals:[...(p.goals||[]),g],activeGoalId:p.activeGoalId||g.id}));
    setNewTitle(""); setNewHours("");
  };
  const updateGoal = (id,p) => setPurpose(prev=>({...prev,goals:prev.goals.map(g=>g.id===id?{...g,...p}:g)}));
  const removeGoal = (id) => setPurpose(prev=>({
    ...prev,
    goals: prev.goals.filter(g=>g.id!==id),
    activeGoalId: prev.activeGoalId===id ? null : prev.activeGoalId,
  }));

  const renderGoal = (g) => {
    const h=hoursFor(g.id), pct=Math.min(100,(h/g.target)*100), isActive=purpose.activeGoalId===g.id;
    return (
      <div className="goal" key={g.id}>
        <div className="goal__head">
          <div className={"goal__title"+(g.archived?" goal__title--dim":"")}>{g.title}</div>
          <div className="goal__nums"><b>{h.toFixed(1)}h</b> / {g.target}h</div>
        </div>
        <div className="goal__bar"><i style={{width:`${pct}%`}}/></div>
        <div className="goal__actions">
          {!g.archived && (isActive
            ? <span className="badge badge--accent"><span className="dot"/>Current focus</span>
            : <button className="btn btn--ghost" style={{padding:"4px 10px",fontSize:12}} onClick={()=>patch({activeGoalId:g.id})}>Make current</button>)}
          <button className="btn btn--ghost" style={{padding:"4px 10px",fontSize:12}}
            onClick={()=>updateGoal(g.id,{archived:!g.archived})}>
            {g.archived?"Reopen":"Archive"}
          </button>
          <button className="btn btn--danger" style={{padding:"4px 10px",fontSize:12}} onClick={()=>removeGoal(g.id)}>Delete</button>
        </div>
      </div>
    );
  };

  return (
    <div className="page">
      <div className="eyebrow">Compass</div>
      <h1 className="h-serif" style={{fontSize:44,margin:"8px 0 10px"}}>Purpose</h1>
      <p style={{fontSize:14,color:"var(--hf-fg-muted)",lineHeight:1.7,margin:"0 0 32px",maxWidth:620}}>
        Everything else in this app measures what you did. This page holds why. It is the only
        thing here you should reread more often than you edit.
      </p>

      <div className="eyebrow" style={{marginBottom:10}}>North Star</div>
      <div className="purpose-star">
        <AutoTextarea className="purpose-star__field" value={purpose.northStar||""}
          onChange={v=>patch({northStar:v})}
          placeholder="In one sentence — what are you actually building your life toward?"/>
      </div>
      <p style={{fontSize:12,color:"var(--hf-fg-subtle)",lineHeight:1.65,margin:"0 0 40px",maxWidth:560}}>
        This line follows you: it sits in the sidebar and above every session you start.
      </p>

      <div className="eyebrow" style={{marginBottom:10}}>Identity</div>
      <div className="card-s" style={{marginBottom:8}}>
        <AutoTextarea className="purpose-identity__field" value={purpose.identity||""}
          onChange={v=>patch({identity:v})}
          placeholder="I am the kind of person who…"/>
      </div>
      <p style={{fontSize:12,color:"var(--hf-fg-subtle)",lineHeight:1.65,margin:"0 0 40px",maxWidth:560}}>
        Habits follow identity, not goals. Write who you are becoming, in the present tense.
      </p>

      <div className="eyebrow" style={{marginBottom:10}}>Goals</div>
      <div className="card-s">
        {active.length===0 && <p style={{fontSize:13,color:"var(--hf-fg-muted)",margin:"4px 0 0",lineHeight:1.7}}>
          No goals yet. Add one and every session you run will count toward it.
        </p>}
        {active.map(renderGoal)}
        <div className="goal-new">
          <input className="input" placeholder="Goal — e.g. Ship the first version of the product"
            value={newTitle} onChange={e=>setNewTitle(e.target.value)}
            onKeyDown={e=>{ if(e.key==="Enter") addGoal(); }}/>
          <input className="input input--num" type="number" min="1" max="5000" placeholder="Hours"
            value={newHours} onChange={e=>setNewHours(e.target.value)}
            onKeyDown={e=>{ if(e.key==="Enter") addGoal(); }}/>
          <button className="btn btn--primary" onClick={addGoal}><Icon name="plus" size={14}/> Add</button>
        </div>
      </div>

      {done.length>0 && (<>
        <div className="eyebrow" style={{margin:"36px 0 10px"}}>Archived</div>
        <div className="card-s">{done.map(renderGoal)}</div>
      </>)}
    </div>
  );
};
