  const activeGoal   = (purpose.goals||[]).find(g=>g.id===activeGoalId) || null;

  // Wall-clock refs — these are never stale in callbacks
  const sessionStartRef     = useRef(null);   // HH:MM display string when Begin pressed
  const focusTsRef          = useRef(0);      // Date.now() when this focus period started
  const focusElapsedRef     = useRef(0);      // seconds elapsed in ALL prior focus periods (handles pause/resume)
  const breakTsRef          = useRef(0);      // Date.now() when break started
  const breakTotalRef       = useRef(5*60);   // total break seconds for current break
  const phaseRef            = useRef("idle"); // always-current phase (for visibilitychange)
  const trackerOnRef        = useRef(true);   // tracker toggle, readable from timer closures
  const periodStartRef      = useRef(null);   // mirror of trackerPeriodStart for closures
  const lastSessionIdRef    = useRef(null);   // id of the session the rating screen belongs to
  const trackerTargetRef    = useRef(getNextHalfHourMs()); // abs ms of next :00/:30
  const trackerFiredRef     = useRef(false);  // prevents double-fire on same interval
  const deferredCheckInRef  = useRef(false);  // a mark passed during a session — ask once it ends
  const sessionStartedAtRef = useRef(null);   // Date the current session actually began
  const viewRef             = useRef("day");  // current view, readable from timer closures
  const targetHitRef        = useRef(false);  // the target chime fires once per session

  // Tracker
  const [trackerEntries,   setTrackerEntries]   = useState(()=>loadLS("hf_tracker",[]));
  const [trackerPrompt,    setTrackerPrompt]    = useState(false);
  const [deferredPrompt,   setDeferredPrompt]   = useState(null);  // {start,end} — asked after a session
  const [quickLog,         setQuickLog]         = useState(false);
  const [trackerCountdown, setTrackerCountdown] = useState(()=>Math.max(0,Math.round((getNextHalfHourMs()-Date.now())/1000)));
  const [trackerPeriodStart, setTrackerPeriodStart] = useState(()=>getLastHalfHourDate());

  /* Persistence */
  usePersist("hf_theme",     theme);
  usePersist("hf_history",   history);
  usePersist("hf_tracker",   trackerEntries);
  usePersist("hf_mits",      mits);
  usePersist("hf_practices", practiceLog);
  usePersist("hf_purpose",   purpose);
  usePersist("hf_rituals",   rituals);
  usePersist("hf_breaks",    breaks);
  usePersist("hf_weekly",    weekly);
  usePersist("hf_warmap",    warmap);
  usePersist("hf_trackerOn", trackerOn);

  /* Storage health — runs after the persistence effects above, every render */
  const [storageWarn, setStorageWarn] = useState(false);
  useEffect(()=>{ if(hasSaveFailed()&&!storageWarn) setStorageWarn(true); });

  /* Recovery — if localStorage came back empty but the IndexedDB mirror still
     holds sessions, offer to restore rather than silently starting from zero. */
  const [recovery, setRecovery] = useState(null);
  useEffect(()=>{
    if(history.length||trackerEntries.length||practiceLog.length) return;
    let cancelled=false;
    IDB.get("hf_history").then(h=>{
      if(!cancelled && Array.isArray(h) && h.length) setRecovery(h.length);
    });
    return ()=>{ cancelled=true; };
  },[]);
  const restoreFromMirror = async () => {
    const [h,t,m,p,pu,r,b,w,wm]=await Promise.all(DATA_KEYS.map(k=>IDB.get(k)));
    if(Array.isArray(h)) setHistory(h);
    if(Array.isArray(t)) setTrackerEntries(t);
    if(m&&typeof m==="object") setMits(m);
    if(Array.isArray(p)) setPracticeLog(p);
    if(pu&&typeof pu==="object") setPurpose(prev=>({...prev,...pu}));
    if(r&&typeof r==="object") setRituals(r);
    if(Array.isArray(b)) setBreaks(b);
    if(w&&typeof w==="object") setWeekly(w);
    if(wm&&typeof wm==="object") setWarmap(wm);
    setRecovery(null);
  };

  /* Theme */
  useEffect(()=>{ document.documentElement.setAttribute("data-theme",theme); },[theme]);

  /* Sound engine */
  useEffect(()=>{ if(sound) SoundEngine.play(sound); else SoundEngine.stop(); },[sound]);

  /* Keep phaseRef always current — used in callbacks/effects that can't take phase as dep */
  useEffect(()=>{ phaseRef.current=phase; },[phase]);
  useEffect(()=>{ trackerOnRef.current=trackerOn; },[trackerOn]);
  useEffect(()=>{
    viewRef.current=view;
    // Landing on the Tracker must show a live number immediately, not a stale one.
    if(view==="tracker") setTrackerCountdown(Math.max(0,Math.round((trackerTargetRef.current-Date.now())/1000)));
  },[view]);
  useEffect(()=>{ periodStartRef.current=trackerPeriodStart; },[trackerPeriodStart]);

  /* Request notification permission once on mount */
  useEffect(()=>{
    if("Notification" in window && Notification.permission==="default") Notification.requestPermission();
  },[]);

  /* Focus / break timer — wall-clock based so background throttling can't drift it */
  useEffect(()=>{
    if(phase!=="focusing"&&phase!=="break") return;
    const tick=setInterval(()=>{
      if(phaseRef.current==="focusing"){
        setSession(s=>{
          const elapsed=focusElapsedRef.current+Math.floor((Date.now()-focusTsRef.current)/1000);
          const rem=Math.max(0,s.total-elapsed);
          const over=Math.max(0,elapsed-s.total);   // keeps counting past the target
          return (rem===s.remaining&&over===(s.over||0))?s:{...s,remaining:rem,over};
        });
      } else if(phaseRef.current==="break"){
        setBreakRem(()=>Math.max(0,breakTotalRef.current-Math.floor((Date.now()-breakTsRef.current)/1000)));
      }
    },500); // 500ms so we recover immediately when tab is refocused
    return ()=>clearInterval(tick);
  },[phase]);

  /* Target reached — the timer is a target, not a guillotine.
     It says so and then keeps counting, so the session records the time the work
     actually took rather than the time you happened to be at the keyboard when
     it ran out. You end it with Done. */
  useEffect(()=>{
    if(phase==="focusing"&&session.remaining===0&&!targetHitRef.current){
      targetHitRef.current=true;
      playChime();
      sendNotif("Hyper Focus · Target reached", task||"Still going? Hit Done when you actually finish.");
    }
  },[session.remaining,phase]);

  /* Break complete */
  useEffect(()=>{
    if(phase==="break"&&breakRem===0){
      playChime();
      sendNotif("Hyper Focus · Break over","Ready for your next session.");
      // Log the break so its kind can later be correlated with the next session
      const bid=newId();
      const bEnd=new Date();
      setBreaks(bs=>[...bs,{id:bid,date:bEnd.toISOString(),
        startTime:formatHHMM(new Date(breakTsRef.current)), endTime:formatHHMM(bEnd),
        dur:breakTotalRef.current,type:null}]);
      setRestAsk({id:bid});
      setTrackerPeriodStart(bEnd);
      trackerTargetRef.current=getNextHalfHourMs();
      setSession(s=>({...s,remaining:s.total,index:s.index+1}));
      setQuote(randQuote());
      setPhase("idle");
    }
  },[breakRem,phase]);

  /* Tracker tick — wall-clock based, fires OS notification when :00/:30 is reached.
     Two exceptions, both deliberate:
     - tracker switched off in Settings → the mark passes silently
     - a session or break is running → NOTHING happens. No prompt, no chime, no
       entry written. The mark is remembered and the question is asked once the
       session is over. Interrupting deep work is the one thing this app must
       never do, and a session is never written into the tracker log: it is
       already on the calendar, drawn from the session history itself. */
  const doTrackerCheck = () => {
    const secs=Math.max(0,Math.round((trackerTargetRef.current-Date.now())/1000));
    /* The countdown is only ever shown on the Tracker page. Setting it every
       second from anywhere else would re-render the entire app — Stats, War Map
       and all — once a second, for a number nobody is looking at. */
    if(viewRef.current==="tracker") setTrackerCountdown(c=>c===secs?c:secs);
    if(secs===0&&!trackerFiredRef.current){
      trackerFiredRef.current=true;
      trackerTargetRef.current=getNextHalfHourMs();
      setTimeout(()=>{ trackerFiredRef.current=false; },4000);
      if(!trackerOnRef.current){
        setTrackerPeriodStart(new Date());
      } else if(phaseRef.current==="focusing"||phaseRef.current==="break"){
        deferredCheckInRef.current=true;   // ask after the session, not now
      } else {
        setTrackerPrompt(true);
        playChime();
        sendNotif("Hyper Focus · Check-in","What have you been working on?");
      }
    }
  };

  /* Called the moment a session or break is over. If a check-in came due while
     it was running, it surfaces now — and only for the untracked stretch BEFORE
     the session started, because the session's own time is already accounted
     for. A gap under five minutes isn't worth a question. */
  const settleAfterSession = () => {
    const now=new Date();
    const gapEnd=sessionStartedAtRef.current;
    const gapStart=periodStartRef.current;
    const pending=deferredCheckInRef.current;
    deferredCheckInRef.current=false;
    sessionStartedAtRef.current=null;
    if(pending && trackerOnRef.current && gapEnd && gapStart && (gapEnd-gapStart)>=5*60000){
      setDeferredPrompt({start:gapStart,end:gapEnd});
    }
    // Either way the clock restarts from the end of the session.
    setTrackerPeriodStart(now);
    trackerTargetRef.current=getNextHalfHourMs();
  };
  const doTrackerCheckRef = useRef(doTrackerCheck);
  doTrackerCheckRef.current = doTrackerCheck;
  useEffect(()=>{
    const doCheck=()=>doTrackerCheckRef.current();
    doCheck(); // check immediately in case page was hidden when it fired
    const t=setInterval(doCheck,1000);
    return ()=>clearInterval(t);
  },[]);

  /* Visibility change — recalculate all timers the instant the tab becomes active */
  useEffect(()=>{
    const onVis=()=>{
      if(document.hidden) return;
      // Focus timer catch-up
      if(phaseRef.current==="focusing"){
        setSession(s=>{
          const elapsed=focusElapsedRef.current+Math.floor((Date.now()-focusTsRef.current)/1000);
          return {...s,remaining:Math.max(0,s.total-elapsed),over:Math.max(0,elapsed-s.total)};
        });
      }
      // Break timer catch-up
      if(phaseRef.current==="break"){
        setBreakRem(Math.max(0,breakTotalRef.current-Math.floor((Date.now()-breakTsRef.current)/1000)));
      }
      // Tracker catch-up — same logic as the interval tick
      doTrackerCheckRef.current();
    };
    document.addEventListener("visibilitychange",onVis);
    return ()=>document.removeEventListener("visibilitychange",onVis);
  },[]);

  /* Document title */
  useEffect(()=>{
    if     (phase==="focusing") document.title=`${session.over>0?"+"+fmt(session.over):fmt(session.remaining)} · Hyper Focus`;
    else if(phase==="break")    document.title=`Break ${fmt(breakRem)} · Hyper Focus`;
    else if(phase==="complete") document.title=`Done · Hyper Focus`;
    else                        document.title="Hyper Focus";
  },[phase,session.remaining,session.over,breakRem]);

  /* Global keys */
  useEffect(()=>{
    const onKey=e=>{
      if((e.metaKey||e.ctrlKey)&&e.key==="k"){e.preventDefault();setCmdk(v=>!v);return;}
      if(e.key==="Escape"){setCmdk(false);setMenuOpen(false);return;}
      /* Space starts and pauses — but ONLY on the session screen, and never when
         a control has focus. preventDefault outside those cases would kill both
         page scrolling and Space-to-activate-a-button. */
      if(e.key===" "&&view==="session"
         &&!["INPUT","TEXTAREA","SELECT","BUTTON","A"].includes(e.target.tagName)
         &&!e.target.isContentEditable){
        // Must go through onBegin/onPause — setting phase directly leaves the
        // wall-clock refs unset and the session completes instantly.
        if(phase==="idle"||phase==="focusing"){
          e.preventDefault();
          if(phase==="idle") onBegin(); else onPause();
        }
      }
    };
    window.addEventListener("keydown",onKey);
    return ()=>window.removeEventListener("keydown",onKey);
  },[phase,view]);

  const onBegin = () => {
    // elapsed before this period = total − current remaining (handles resume after pause)
    focusElapsedRef.current = session.total - session.remaining;
    focusTsRef.current = Date.now();
    sessionStartRef.current = nowTime();
    // Only on a true start, not on resume — the tracker needs the real boundary.
    if(!sessionStartedAtRef.current){ sessionStartedAtRef.current = new Date(); targetHitRef.current=false; }
    // Asking for notification permission the moment the app opens is noise, and
    // Safari refuses it outside a gesture. The first Begin is that gesture.
    if("Notification" in window && Notification.permission==="default"){
      try { Notification.requestPermission(); } catch(e){}
    }
    setPhase("focusing");
  };
  const onPause = () => {
    // freeze elapsed so the resume can pick up exactly where we left off
    focusElapsedRef.current += Math.floor((Date.now()-focusTsRef.current)/1000);
    setPhase("idle");
  };
  const onEnd = () => {
    // Compute how many seconds were actually focused
    // If phase==="focusing" we're mid-period; if "idle" (paused) elapsed is already accumulated
    const elapsed = phase==="focusing"
      ? focusElapsedRef.current + Math.floor((Date.now()-focusTsRef.current)/1000)
      : focusElapsedRef.current;
    focusElapsedRef.current=0; focusTsRef.current=0; targetHitRef.current=false;
    setSession(s=>({...s,remaining:s.total,over:0}));
    if(elapsed>=60){
      // Save with real elapsed duration and show the complete/rating screen
      const id=newId();
      lastSessionIdRef.current=id;
      setLastDur(elapsed);
      setHistory(h=>[...h,{
        id,
        startTime: sessionStartRef.current||nowTime(),
        time:      nowTime(),
        date:      new Date().toISOString(),
        task:      task||"Untitled session.",
        mode:      session.mode,
        dur:       elapsed,          // what it actually took
        target:    session.total,    // what you aimed at
        goalId:    activeGoalId,
        kind,
      }]);
      setPhase("complete");
      settleAfterSession();
    } else {
      // Too short to be worth saving (accidental click)
      sessionStartedAtRef.current=null;
      deferredCheckInRef.current=false;
      setPhase("idle");
    }
  };
  const onStartBreak = () => {
    const mode=MODES.find(m=>m.id===session.mode);
    const dur=mode?.breakDur||5*60;
    breakTotalRef.current=dur; breakTsRef.current=Date.now();
    setBreakRem(dur); setPhase("break");
  };
  const onNewSession = () => {
    focusElapsedRef.current=0; focusTsRef.current=0; targetHitRef.current=false;
    setSession(s=>({...s,remaining:s.total,over:0,index:s.index+1}));
    setQuote(randQuote()); setPhase("idle");
  };
  const onBreathe       = (mins) => { setBreathDuration(mins*60); setView("breath"); };
  // Rate by id, not by position — deleting a row in Today must not shift the target
  const rateSession     = (q)    => { const id=lastSessionIdRef.current; if(id==null) return; setHistory(h=>h.map(s=>s.id===id?{...s,quality:q}:s)); };
  const onMitClick      = (text) => { setTask(text); };
  /* Correct the duration of the session just finished — for when the timer kept
     running after the work stopped. Rewrites the record, not just the display. */
  const onFixDur        = (secs) => {
    const id=lastSessionIdRef.current; if(id==null) return;
    setHistory(h=>h.map(s=>s.id===id?{...s,dur:secs,adjusted:true}:s));
    setLastDur(secs);
  };
  const onRenameSession = (id,newTask) => { setHistory(h=>h.map(s=>s.id===id?{...s,task:newTask}:s)); };
  const onDeleteSession = (id) => { setHistory(h=>h.filter(s=>s.id!==id)); };
  const onAdd5min       = ()     => { setSession(s=>({...s,total:s.total+300,remaining:s.remaining+300})); };
  const onLogPractice   = (entry)=> { setPracticeLog(l=>[...l,entry]); };
  const classifyRest    = (type) => {
    const id=restAsk?.id; if(id==null) return;
    setBreaks(bs=>bs.map(b=>b.id===id?{...b,type}:b));
    setRestAsk(null);
  };
  // Free-range entry from the calendar: any start, any end, on the day being viewed.
  const onAddEntry = (text, startMin, endMin, dayStr) => {
    const base = dayStr ? new Date(dayStr+"T12:00:00") : new Date();
    const mk=(m)=>{ const d=new Date(base); d.setHours(0,0,0,0); d.setMinutes(m); return d; };
    const s=mk(startMin), e=mk(endMin);
    setTrackerEntries(es=>[...es,{
      id:        newId(),
      startTime: formatHHMM(s),
      endTime:   formatHHMM(e),
      date:      e.toISOString(),
      duration:  endMin-startMin,
      text,
      source:    "manual",
    }]);
    // Same rule as the quick log: an entry drawn up to now closes that stretch,
    // so the next check-in must not ask about it again. Past days never count.
    if(e<=new Date()) advancePeriodTo(e);
  };
  const onDeleteEntry = (id) => setTrackerEntries(es=>es.filter(e=>e.id!==id));

  /* The regular check-in: log from the last mark up to now. */
  const logEntry = (text) => {
    const now = new Date();
    writeEntry(text, trackerPeriodStart, now, "checkin");
    setTrackerPeriodStart(now);
    trackerTargetRef.current = getNextHalfHourMs(); // re-align to the true next :00/:30
    setTrackerPrompt(false);
  };

  /* The deferred check-in: log the gap that sat before the session, not up to now. */
  const logDeferred = (text) => {
    if(deferredPrompt) writeEntry(text, deferredPrompt.start, deferredPrompt.end, "checkin");
    setDeferredPrompt(null);
  };

  /* `source` records HOW the entry was captured — quick log, 30-min check-in,
     or drawn by hand on the calendar. The Week reports on it: a week held
     together by quick logs after the fact reads very differently from one
     answered at the marks. Entries written before this existed have no source
     and are counted as "other". */
  const writeEntry = (text, start, end, source) => {
    const mins = Math.max(1, Math.round((end-start)/60000));
    setTrackerEntries(es=>[...es,{
      id:        newId(),
      startTime: formatHHMM(start),
      endTime:   formatHHMM(end),
      date:      end.toISOString(),
      duration:  mins,
      text,
      source,
    }]);
  };

  /* Any entry that reaches up to now also answers the pending check-in for that
     stretch. Move the period forward so the next :00/:30 asks about what is
     still unaccounted for, and nothing gets logged twice: quick-log at 19:05 and
     the 19:30 check-in covers 19:05 — 19:30, not 19:00 — 19:30.
     Never moves backwards, so a long entry cannot rewind the clock. */
  const advancePeriodTo = (when) => {
    setTrackerPeriodStart(prev => (when>prev ? when : prev));
  };

  /* Quick log — the whole point is that it costs one tap. Logs the last N
     minutes, ending now, so a five-minute derail can be captured the moment it
     ends without opening a form or doing arithmetic. */
  const quickLogEntry = (text, mins) => {
    const end = new Date();
    const start = new Date(end.getTime() - mins*60000);
    writeEntry(text, start, end, "quick");
    advancePeriodTo(end);
    setQuickLog(false);
  };

  const exportData = () => {
    const data={version:5,app:"hyperfocus",history,trackerEntries,mits,practiceLog,purpose,rituals,breaks,weekly,warmap,
      settings:{theme,trackerOn},exportedAt:new Date().toISOString()};
    const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");
    a.href=url; a.download=`hyperfocus-${todayStr()}.json`; a.click();
    URL.revokeObjectURL(url);
    saveLS("hf_lastExport", Date.now());
    setLastExport(Date.now());
  };
  const clearData = () => {
    setHistory([]); setTrackerEntries([]); setMits({}); setPracticeLog([]); setRituals({}); setBreaks([]); setWeekly({});
    saveLS("hf_history",[]); saveLS("hf_tracker",[]); saveLS("hf_mits",{}); saveLS("hf_practices",[]);
    saveLS("hf_rituals",{}); saveLS("hf_breaks",[]); saveLS("hf_weekly",{});
    // Purpose is deliberately preserved — clearing your logs should never
    // erase your North Star. Delete it by hand on the Purpose page.
  };

  /* Import — merges a previously exported file. Sessions and tracker entries are
     de-duplicated by id so importing the same backup twice is harmless. */
  const importData = (file) => new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=()=>{
      try {
        const d=JSON.parse(reader.result);
        if(!d || typeof d!=="object" || Array.isArray(d)) throw new Error("Not a Hyper Focus export.");
        /* Shape check before anything is merged. A stray JSON file that happens
           to parse must not be poured into your history. */
        const looksLikeExport = d.version!=null
          && (Array.isArray(d.history) || Array.isArray(d.trackerEntries) || (d.purpose&&typeof d.purpose==="object"));
        if(!looksLikeExport) throw new Error("Not a Hyper Focus export.");
        if(Number(d.version)>5) throw new Error("newer");
        const mergeById=(a,b)=>{
          const seen=new Map();
          [...(a||[]),...(b||[])].forEach(x=>{ if(x&&x.id!=null) seen.set(x.id,x); });
          return [...seen.values()].sort((x,y)=>new Date(x.date||0)-new Date(y.date||0));
        };
        const added=mergeById(history,d.history).length-history.length;
        setHistory(h=>mergeById(h,d.history));
        setTrackerEntries(t=>mergeById(t,d.trackerEntries));
        setPracticeLog(p=>mergeById(p,d.practiceLog));
        if(d.mits && typeof d.mits==="object") setMits(m=>({...m,...d.mits}));
        if(d.rituals && typeof d.rituals==="object") setRituals(r=>({...r,...d.rituals}));
        if(Array.isArray(d.breaks)) setBreaks(b=>mergeById(b,d.breaks));
        if(d.weekly && typeof d.weekly==="object") setWeekly(w=>({...w,...d.weekly}));
        if(d.warmap && typeof d.warmap==="object") setWarmap(w=>({
          ...w, ...d.warmap,
          objectives:{...(w.objectives||{}),...(d.warmap.objectives||{})},
        }));
        if(d.purpose && typeof d.purpose==="object") setPurpose(p=>({
          ...p, ...d.purpose,
          goals: mergeById(p.goals, d.purpose.goals),
        }));
        if(d.settings && typeof d.settings==="object"){
          if(d.settings.theme==="light"||d.settings.theme==="dark") setTheme(d.settings.theme);
          if(typeof d.settings.trackerOn==="boolean") setTrackerOn(d.settings.trackerOn);
        }
        resolve(`Imported. ${added} new session${added===1?"":"s"} added.`);
      } catch(e){
        reject(new Error(e.message==="newer"
          ? "That backup comes from a newer version of Hyper Focus. Update the app first."
          : "Could not read that file — is it a Hyper Focus export?"));
      }
    };
    reader.onerror=()=>reject(new Error("Could not read that file."));
    reader.readAsText(file);
  });

  const cmdAction = id => {
    if     (id==="begin")   { setView("session"); onBegin(); }
    else if(id==="pause")   { if(phase==="focusing") onPause(); }
    else if(id==="breath")  { setView("breath"); }
    else if(id==="preload") { setView("preload"); }
    else if(id==="lognow")  { setTrackerPrompt(true); }
    else if(id==="quicklog"){ setQuickLog(true); }
    else if(["day","week","warmap","purpose","today","stats","sounds","stoic","tracker","practices"].includes(id)) setView(id);
  };

  /* Midnight rollover. Every page derives "today" during render, so a PWA left
     open overnight would keep writing into yesterday. This ticks the date and
     forces the re-render the moment it changes. */
  const [dayStamp, setDayStamp] = useState(()=>todayStr());
  useEffect(()=>{
    const t=setInterval(()=>{ const d=todayStr(); setDayStamp(s=>s===d?s:d); },30000);
    return ()=>clearInterval(t);
  },[]);

  /* Your own most-used labels, newest first — the quick log offers them as chips
     so a recurring derail becomes a single tap. */
  const recentLabels = (()=>{
    const seen=[];
    for(let i=trackerEntries.length-1;i>=0&&seen.length<4;i--){
      const t=trackerEntries[i]?.text?.trim();
      if(t&&!seen.includes(t)) seen.push(t);
    }
    return seen;
  })();

  const today       = dayStamp;
  const todayHistory = history.filter(s=>s.date&&localDate(new Date(s.date))===today);
  const todayMit     = mits[today] || {tasks:["","",""],done:[false,false,false]};

  const crumbs=({day:"The Day",week:"The Week",warmap:"War Map",purpose:"Purpose",session:"Session",today:"Today",stats:"Stats",sounds:"Soundscapes",stoic:"Stoicism",practices:"Daily Practices",settings:"Settings",breath:"Begin",preload:"Preload",tracker:"Tracker"})[view];
  const section=["purpose","day","week","warmap"].includes(view)?"Compass":["sounds","stoic","practices"].includes(view)?"Practice":"Focus";
  const crumbArr=view==="settings"?["Settings"]:[section,crumbs];
  const soundLabel=sound?({rain:"Soft rain",forest:"Old forest",waves:"Shoreline",cafe:"Quiet café",brown:"Brown noise",fire:"Fireplace"})[sound]:null;

  return (
    <div className="app">
      <Rail current={view} onNav={v=>{ setView(v); setMenuOpen(false); }} sounds={soundLabel} theme={theme} northStar={purpose.northStar} open={menuOpen}/>
      {menuOpen && <div className="rail-backdrop" onClick={()=>setMenuOpen(false)}/>}
      <main className="canvas">
        <Topbar crumbs={crumbArr} onCmdk={()=>setCmdk(true)} onTheme={()=>setTheme(t=>t==="light"?"dark":"light")} theme={theme} running={phase==="focusing"} timeStr={session.over>0?"+"+fmt(session.over):fmt(session.remaining)} onMenu={()=>setMenuOpen(true)}/>

        {recovery && (
          <div className="page" style={{paddingBottom:0}}>
            <div className="warn-banner" style={{background:"var(--hf-sand-50)",borderColor:"var(--hf-sand-300)",color:"var(--hf-sand-700)"}}>
              This browser's storage looks empty, but a local backup with <b>{recovery} sessions</b> is still here.
              <div style={{display:"flex",gap:8,marginTop:12}}>
                <button className="btn btn--primary" onClick={restoreFromMirror}>Restore it</button>
                <button className="btn btn--ghost" onClick={()=>setRecovery(null)}>Start fresh</button>
              </div>
            </div>
          </div>
        )}

        {storageWarn && (
          <div className="page" style={{paddingBottom:0}}>
            <div className="warn-banner">
              This browser refused to save — recent changes may be lost when you close the app.
              Private/incognito mode or a full storage quota are the usual causes. Export your data from Settings now.
            </div>
          </div>
        )}

        {view==="session"  && <Session session={session} setSession={setSession} task={task} setTask={setTask} phase={phase} onBegin={onBegin} onPause={onPause} onEnd={onEnd} onFixDur={onFixDur} onAdd5min={onAdd5min} onStartBreak={onStartBreak} onNewSession={onNewSession} breakRemaining={breakRem} quote={quote} mits={todayMit} onBreathe={onBreathe} onRate={rateSession} onMitClick={onMitClick} northStar={purpose.northStar} activeGoal={activeGoal} onOpenPurpose={()=>setView("purpose")}
                                lastDur={lastDur} streak={calcStreak(history)} todaySecs={todayHistory.reduce((a,s)=>a+(s.dur||0),0)}
                                goalHours={activeGoalId?history.reduce((a,s)=>a+(s.goalId===activeGoalId?(s.dur||0):0),0)/3600:0}
                                protocols={purpose.protocols} kind={kind} setKind={setKind} onPreload={(mins)=>{ setPreloadDuration(mins*60); setView("preload"); }}/>}
        {view==="today"    && <Today sessions={todayHistory} streak={calcStreak(history)} onStart={()=>setView("session")} onRename={onRenameSession} onDelete={onDeleteSession}/>}
        {view==="stats"    && <Stats sessions={history} purpose={purpose} breaks={breaks}/>}
        {view==="tracker"  && <Tracker allEntries={trackerEntries} sessions={history} breaks={breaks} countdown={trackerCountdown} enabled={trackerOn} onLogNow={()=>setTrackerPrompt(true)} onAddEntry={onAddEntry} onDeleteEntry={onDeleteEntry}/>}
        {view==="sounds"   && <Soundscapes active={sound} setActive={setSound}/>}
        {view==="stoic"     && <Stoic/>}
        {view==="practices" && <DailyPractices practiceLog={practiceLog} onLogPractice={onLogPractice}/>}
        {view==="breath"    && <Breath duration={breathDuration} onDone={()=>{ setView("session"); onBegin(); }}/>}
        {view==="preload"   && <Preload duration={preloadDuration} onDone={()=>setView("session")}/>}
        {view==="day"      && <TheDay rituals={rituals} setRituals={setRituals} purpose={purpose} mits={mits} setMits={setMits}
                                sessions={todayHistory} practiceLog={practiceLog} streak={calcStreak(history)} onEnterDay={()=>setView("session")}/>}
        {view==="week"     && <TheWeek weekly={weekly} setWeekly={setWeekly} purpose={purpose} sessions={history} rituals={rituals} breaks={breaks} trackerEntries={trackerEntries}/>}
        {view==="warmap"   && <WarMap warmap={warmap} setWarmap={setWarmap} sessions={history} rituals={rituals}/>}
        {view==="purpose"  && <Purpose purpose={purpose} setPurpose={setPurpose} sessions={history}/>}
        {view==="settings" && <Settings theme={theme} setTheme={setTheme} onExport={exportData} onImport={importData} onClearData={clearData}
                                lastExport={lastExport} hasData={history.length>0} trackerOn={trackerOn} setTrackerOn={setTrackerOn}/>}
      </main>
      {restAsk && (
        <div className="tracker-toast">
          <div className="tracker-toast__header">
            <span className="tracker-toast__label">That break</span>
            <button className="iconbtn" onClick={()=>setRestAsk(null)} aria-label="Dismiss"><Icon name="x" size={14}/></button>
          </div>
          <div style={{fontSize:14,lineHeight:1.6,color:"var(--hf-fg-body)"}}>
            Was there input coming in, or not? That — not whether it was pleasant — is what decides
            whether your nervous system actually recovered.
          </div>
          <div className="tracker-toast__actions">
            <button className="btn btn--primary" onClick={()=>classifyRest("real")}>No input — real rest</button>
            <button className="btn btn--secondary" onClick={()=>classifyRest("degenerate")}>Screens, feeds, noise</button>
          </div>
        </div>
      )}
      {trackerPrompt && <TrackerPrompt onSave={logEntry} onSkip={()=>setTrackerPrompt(false)} periodStart={trackerPeriodStart}/>}
      {/* One toast at a time — they share the same corner. */}
      {!trackerPrompt && !restAsk && deferredPrompt && (
        <TrackerPrompt onSave={logDeferred} onSkip={()=>setDeferredPrompt(null)} deferred
          periodStart={deferredPrompt.start} periodEnd={deferredPrompt.end}/>
      )}
      {quickLog && <QuickLog onLog={quickLogEntry} onClose={()=>setQuickLog(false)} recent={recentLabels}/>}

      {/* Always within reach: five minutes lost is exactly the thing you won't
          walk to another page to record. Hidden only during the full-screen
          rituals, where any control at all would break the point of them. */}
      {!["breath","preload"].includes(view) && !quickLog && !trackerPrompt && !deferredPrompt && !restAsk && (
        <button className={"fab"+(phase==="focusing"?" fab--dim":"")}
          onClick={()=>setQuickLog(true)} title="Quick log (log the last few minutes)"
          aria-label="Quick log — record the last few minutes">
          <Icon name="plus" size={22}/>
        </button>
      )}
      {cmdk && <CmdK onClose={()=>setCmdk(false)} onAction={cmdAction}/>}
    </div>
  );
};

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
