/* ── Session ── */
const StarRating = ({ rated, onRate, label="How focused were you?", captions }) => {
  const [hover, setHover] = useState(null);
  const words = captions || ["","1 star","2 stars","3 stars","4 stars","5 stars — Flow"];
  return (
    <div className="star-rate">
      {label&&<div className="star-rate__label">{label}</div>}
      <div className="star-rate__stars">
        {[1,2,3,4,5].map(v=>{
          const filled = hover!=null ? v<=hover : v<=(rated||0);
          return (
            <button key={v}
              className={"star-btn"+(filled?" star-btn--filled":"")}
              onMouseEnter={()=>setHover(v)}
              onMouseLeave={()=>setHover(null)}
              onClick={()=>onRate(v)}
              aria-label={`${v} star${v===1?"":"s"}`} aria-pressed={v<=(rated||0)}>
              <svg width={32} height={32} viewBox="0 0 24 24"
                fill={filled?"currentColor":"none"}
                stroke="currentColor" strokeWidth="1.5"
                strokeLinecap="round" strokeLinejoin="round">
                <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
              </svg>
            </button>
          );
        })}
      </div>
      {rated&&<div style={{marginTop:8,fontSize:11,color:"var(--hf-fg-subtle)",letterSpacing:".06em",textTransform:"uppercase"}}>{words[rated]}</div>}
    </div>
  );
};

const Session = ({ session, setSession, task, setTask, phase, onBegin, onPause, onEnd, onFixDur, onAdd5min, onStartBreak, onNewSession, breakRemaining, quote, mits, onBreathe, onPreload, onRate, onMitClick, northStar, activeGoal, onOpenPurpose, lastDur, streak=0, todaySecs=0, goalHours=0, protocols=[], kind, setKind, onLogBreak }) => {
  const R=46, CIRC=2*Math.PI*R;
  const [editDur, setEditDur] = useState(false);
  const [durVal,  setDurVal]  = useState("");
  const [rated,   setRated]   = useState(null);
  const [fixDur,  setFixDur]  = useState(false);   // correcting the recorded time
  const [fixVal,  setFixVal]  = useState("");
  const isIdle=phase==="idle", isFocusing=phase==="focusing", isBreak=phase==="break";
  const isPaused=isIdle&&session.remaining<session.total;
  const over=session.over||0;                      // seconds past the target
  const isOver=isFocusing&&session.remaining===0&&over>0;
  const applyFix=()=>{
    const m=parseInt(fixVal);
    if(m>=1&&m<=600) onFixDur(m*60);
    setFixDur(false);
  };
  const ringRemaining=isBreak?breakRemaining:session.remaining;
  const ringTotal=isBreak?(MODES.find(m=>m.id===session.mode)?.breakDur||300):session.total;
  const ringPct=ringTotal>0?(ringTotal-ringRemaining)/ringTotal:0;
  const ringOffset=CIRC*(1-ringPct);
  const applyDur=()=>{ const mins=parseInt(durVal); if(mins>=1&&mins<=480) setSession(s=>({...s,total:mins*60,remaining:mins*60})); setEditDur(false); };
  const hasMits = mits && mits.tasks && mits.tasks.some(t=>t);

  // Reset rating when we exit complete phase
  useEffect(()=>{ if(phase!=="complete") setRated(null); },[phase]);

  // The trigger moment: a session ending is the most predictable point at which
  // attention leaks. Show the protocol that was written for exactly this.
  const protoFor = (trigger) => (protocols||[]).filter(p=>p.trigger===trigger)[0] || null;
  const endProto = protoFor("session-end");
  const breakProto = protoFor("break");

  if (phase==="complete") {
    const mode=MODES.find(m=>m.id===session.mode);
    const breakMins=Math.round((mode?.breakDur||300)/60);
    const mins=Math.max(1,Math.round((lastDur||session.total)/60));
    const goalPct=activeGoal&&activeGoal.target ? Math.min(100,(goalHours/activeGoal.target)*100) : null;
    const C=2*Math.PI*22;
    return (
      <div className="focus-stage">
        <div className="session-complete">
          {/* The mark draws itself — a small, deliberate full stop on the session. */}
          <div className="seal">
            <svg viewBox="0 0 64 64">
              <circle className="seal__ring" cx="32" cy="32" r="28" style={{"--len":2*Math.PI*28}}/>
              <circle className="seal__ring seal__ring--2" cx="32" cy="32" r="16" style={{"--len":2*Math.PI*16}}/>
              <circle className="seal__dot" cx="32" cy="32" r="3.5"/>
            </svg>
          </div>

          <div className="rise" style={{animationDelay:"900ms"}}>
            {fixDur ? (
              /* If the timer ran on while you were away, the number is wrong and
                 no amount of good design fixes a wrong number. Correct it here. */
              <div className="fix-dur">
                <input className="input" type="number" min="1" max="600" autoFocus
                  value={fixVal} onChange={e=>setFixVal(e.target.value)}
                  onKeyDown={e=>{ if(e.key==="Enter") applyFix(); if(e.key==="Escape") setFixDur(false); }}
                  style={{width:110,fontFamily:"var(--hf-font-mono)",fontSize:22,textAlign:"center"}}/>
                <span style={{color:"var(--hf-fg-muted)",fontSize:14}}>min</span>
                <button className="btn btn--primary" onClick={applyFix}>Save</button>
                <button className="btn btn--ghost" onClick={()=>setFixDur(false)}>Cancel</button>
              </div>
            ) : (
              <>
                <div className="complete-figure">{mins}<small>min</small></div>
                <div className="session-complete__label" style={{marginTop:14}}>of focus, held.</div>
                {onFixDur&&(
                  <button className="btn btn--ghost" style={{padding:"2px 8px",fontSize:11.5,marginTop:8}}
                    onClick={()=>{ setFixVal(String(mins)); setFixDur(true); }}>
                    Not right? Set the real time
                  </button>
                )}
              </>
            )}
          </div>

          <div className="session-complete__task rise" style={{animationDelay:"1000ms",marginTop:18}}>{task||"Untitled session."}</div>

          <div className="complete-meta rise" style={{animationDelay:"1100ms"}}>
            {streak>0&&<span className="badge badge--accent"><Icon name="zap" size={11}/>Day {streak} of the chain</span>}
            {todaySecs>0&&<span className="badge badge--neutral"><Icon name="timer" size={11}/>{fmtDur(todaySecs)} today</span>}
          </div>

          {activeGoal&&goalPct!=null&&(
            <div className="complete-goal rise" style={{animationDelay:"1200ms"}}>
              <div className="complete-goal__head">
                <span className="complete-goal__name">{activeGoal.title}</span>
                <span className="complete-goal__num">{goalHours.toFixed(1)}h / {activeGoal.target}h</span>
              </div>
              <div className="goal__bar"><i style={{width:`${goalPct}%`}}/></div>
            </div>
          )}

          {endProto&&(
            <div className="rise" style={{animationDelay:"1250ms",marginTop:26}}>
              <div className="proto-card">
                <div className="proto-card__eyebrow">You decided this in advance</div>
                <div className="proto-card__line">If <b>{endProto.when}</b>, then <b>{endProto.then}</b>.</div>
              </div>
            </div>
          )}

          <div className="rise" style={{animationDelay:"1300ms"}}>
            <StarRating rated={rated} onRate={v=>{ setRated(v); onRate(v); }}/>
          </div>

          <div className="rise" style={{animationDelay:"1400ms",display:"flex",gap:10,marginTop:28,flexWrap:"wrap",justifyContent:"center"}}>
            <button className="btn btn--primary btn--lg" onClick={onStartBreak}><Icon name="coffee" size={14}/> Start break · {breakMins}m</button>
            <button className="btn btn--secondary btn--lg" onClick={onNewSession}><Icon name="play" size={14}/> New session</button>
          </div>
        </div>
      </div>
    );
  }

  return (
    <div className={"focus-stage"+(isFocusing?" focus-stage--live":"")+(isBreak?" focus-stage--break focus-stage--live":"")}>
      <div className="focus-meta">
        <span>SESSION <b>{String(session.index).padStart(2,"0")}</b></span>
        <span>·</span>
        <span>MODE <b>{MODES.find(m=>m.id===session.mode)?.label}</b></span>
        <span>·</span>
        <span>TARGET{" "}
          {editDur
            ? <input className="dur-edit" type="number" min="1" max="480" value={durVal} onChange={e=>setDurVal(e.target.value)} onKeyDown={e=>{if(e.key==="Enter"||e.key==="Escape")applyDur();}} onBlur={applyDur} autoFocus/>
            : <b className={isIdle&&!isPaused?"dur-target":""} onClick={()=>{if(isIdle&&!isPaused){setDurVal(String(Math.floor(session.total/60)));setEditDur(true);}}}>{fmt(session.total)}</b>
          }
        </span>
      </div>

      {/* Why you're here, before what you're doing */}
      {isIdle && !isPaused && northStar && <div className="session-star">{northStar}</div>}

      {isIdle&&!isPaused
        ? <input className="focus-task" style={{width:"100%",maxWidth:640}} placeholder="What are you working on?" value={task} onChange={e=>setTask(e.target.value)}/>
        : <div className="focus-task" style={{fontStyle:"normal"}}>{task||"Untitled session."}</div>
      }

      {/* Which goal this session will count toward */}
      {isIdle && !isPaused && (
        <div className="session-goal">
          {activeGoal
            ? <button className="badge badge--accent" onClick={onOpenPurpose} title="Change on the Purpose page">
                <span className="dot"/>Counts toward · {activeGoal.title}
              </button>
            : <button className="badge badge--neutral" onClick={onOpenPurpose}>
                <Icon name="compass" size={12}/> No goal set — this time won't be attributed
              </button>}
        </div>
      )}

      {/* Today's priorities reminder — click to pre-fill task */}
      {isIdle && !isPaused && hasMits && (
        <div className="session-mits">
          {mits.tasks.map((t,i)=>t?(
            <span key={i}
              className={"session-mit session-mit--clickable"+(mits.done[i]?" session-mit--done":"")}
              title="Click to set as task"
              onClick={()=>{ if(!mits.done[i]) onMitClick(t); }}>
              {t}
            </span>
          ):null)}
        </div>
      )}

      <div className={"ring"+(isFocusing?" ring--breathing ring--live":"")}>
        <svg viewBox="0 0 100 100">
          <circle className="ring__bg" cx="50" cy="50" r={R}/>
          <circle className={"ring__fg"+(isBreak?" ring__fg--break":"")} cx="50" cy="50" r={R} strokeDasharray={CIRC} strokeDashoffset={ringOffset}/>
        </svg>
        <div className="ring__inner">
          {/* Past the target the clock turns around and counts up, so what you
              read is the time the work is actually taking. */}
          <div className={"ring__timer"+(isOver?" ring__timer--over":"")}>
            {isOver ? "+"+fmt(over) : fmt(ringRemaining)}
          </div>
          <div className="ring__label">
            {isBreak?"Break":isOver?`Past your ${Math.round(session.total/60)}m target`:isFocusing?"Focusing":isPaused?"Paused":"Ready"}
          </div>
        </div>
      </div>

      <div className="focus-actions">
        {isIdle&&!isPaused&&(
          <>
            <div style={{display:"flex",gap:6}}>
              {MODES.map(m=>(
                <button key={m.id} className={"btn "+(session.mode===m.id?"btn--secondary":"btn--ghost")} style={session.mode===m.id?{borderColor:"var(--hf-sand-400)"}:{}} onClick={()=>setSession(s=>({...s,mode:m.id,total:m.dur,remaining:m.dur}))}>
                  {m.label}
                </button>
              ))}
            </div>
            <button className="btn btn--primary btn--xl" onClick={onBegin}><Icon name="play" size={14}/> Begin</button>
          </>
        )}
        {/* Done is what ends a session, at any point. The timer only ever set
            the target; you decide when the work is finished. */}
        {isFocusing&&(isOver?(<>
          <button className="btn btn--primary btn--xl" onClick={onEnd}><Icon name="check" size={14}/> Done</button>
          <button className="btn btn--ghost btn--lg" onClick={onPause}><Icon name="pause" size={14}/> Pause</button>
        </>):(<>
          <button className="btn btn--secondary btn--lg" onClick={onPause}><Icon name="pause" size={14}/> Pause</button>
          <button className="btn btn--ghost btn--lg" onClick={onAdd5min}><Icon name="plus" size={14}/> +5 min</button>
          <button className="btn btn--ghost btn--lg" onClick={onEnd}><Icon name="check" size={14}/> Done</button>
        </>))}
        {isPaused&&(<>
          <button className="btn btn--primary btn--lg" onClick={onBegin}><Icon name="play" size={14}/> Return</button>
          <button className="btn btn--ghost btn--lg" onClick={onEnd}><Icon name="check" size={14}/> Done</button>
        </>)}
        {isBreak&&<button className="btn btn--ghost btn--lg" onClick={onNewSession}>Skip break</button>}
      </div>

      {/* Real rest is the absence of input — not the presence of pleasure. */}
      {isBreak&&(
        <div style={{display:"flex",flexDirection:"column",alignItems:"center",marginTop:8}}>
          {breakProto&&(
            <div className="proto-card" style={{marginBottom:20}}>
              <div className="proto-card__eyebrow">You decided this in advance</div>
              <div className="proto-card__line">If <b>{breakProto.when}</b>, then <b>{breakProto.then}</b>.</div>
            </div>
          )}
          <div className="rest-list">
            <div className="rest-list__title">Rest that actually rests</div>
            {REAL_REST.map(r=><div className="rest-item" key={r}>{r}</div>)}
          </div>
          <p style={{fontSize:12,color:"var(--hf-fg-subtle)",lineHeight:1.6,maxWidth:340,marginTop:16,fontStyle:"italic"}}>
            The test isn't pleasant versus dull — it's whether input is still coming in.
          </p>
        </div>
      )}

      {/* What kind of mental work this is — a day that is only ever Use burns out */}
      {isIdle && !isPaused && (
        <div style={{marginTop:22,display:"flex",flexDirection:"column",alignItems:"center",gap:7}}>
          <div className="kinds">
            {KINDS.map(k=>(
              <button key={k.id} className={"kind"+(kind===k.id?" kind--on":"")} onClick={()=>setKind(k.id)} title={k.blurb}>{k.label}</button>
            ))}
          </div>
          <div style={{fontSize:11.5,color:"var(--hf-fg-subtle)",lineHeight:1.5,maxWidth:360,textAlign:"center"}}>
            {KINDS.find(k=>k.id===kind)?.blurb}
          </div>
        </div>
      )}

      {/* Pre-focus breath options */}
      {isIdle && !isPaused && (
        <div className="breath-opts">
          <span className="breath-opts__label">Breathe</span>
          {[1,2,3].map(m=>(
            <button key={m} className="breath-opt" onClick={()=>onBreathe(m)}>{m} min</button>
          ))}
        </div>
      )}

      {/* Preload — deliberate nothing before the work (phase 1 of the focus protocol) */}
      {isIdle && !isPaused && (
        <div className="breath-opts">
          <span className="breath-opts__label">Preload</span>
          {[10,15,20].map(m=>(
            <button key={m} className="breath-opt" onClick={()=>onPreload(m)} title="Sit with zero input before the work — closes the stimulation gap">{m} min</button>
          ))}
        </div>
      )}

      {isIdle&&!isPaused&&(
        <div className="session-quote">{quote.text}<cite>— {quote.author}</cite></div>
      )}
    </div>
  );
};

/* ── Today ── */
const Today = ({ sessions, streak=0, onStart, onRename, onDelete }) => {
  const [editId,  setEditId]  = useState(null);
  const [editVal, setEditVal] = useState("");
  const editRef = useRef(null);
  const total   = sessions.reduce((a,s)=>a+s.dur,0);
  const now     = new Date();
  const dayName = now.toLocaleDateString("en-US",{weekday:"long"});
  const dStr    = now.toLocaleDateString("en-US",{month:"long",day:"numeric"});
  const longest = sessions.length?Math.max(...sessions.map(s=>s.dur)):0;

  const startEdit = (s) => {
    setEditId(s.id); setEditVal(s.task);
    setTimeout(()=>editRef.current?.select(),20);
  };
  const commitEdit = () => {
    if(editId&&editVal.trim()) onRename(editId, editVal.trim());
    setEditId(null);
  };

  return (
    <div className="page">
      <div style={{marginBottom:32}}><div className="eyebrow">{dayName} · {dStr}</div><h1 className="h-serif" style={{fontSize:44,margin:"8px 0 0"}}>Today</h1></div>
      <div className="card-s" style={{marginBottom:32}}>
        <div className="kpi-grid">
          <div className="kpi"><div className="kpi__label">Focused</div><div className="kpi__value">{total?fmtDur(total):<span style={{color:"var(--hf-fg-subtle)"}}>—</span>}</div></div>
          <div className="kpi"><div className="kpi__label">Sessions</div><div className="kpi__value">{sessions.length}<small>/ 4</small></div></div>
          <div className="kpi"><div className="kpi__label">Streak</div><div className="kpi__value">{streak?<>{streak}<small>{streak===1?"day":"days"}</small></>:<span style={{color:"var(--hf-fg-subtle)"}}>—</span>}</div></div>
          <div className="kpi"><div className="kpi__label">Longest</div><div className="kpi__value">{longest?fmtDur(longest):<span style={{color:"var(--hf-fg-subtle)"}}>—</span>}</div></div>
        </div>
      </div>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"baseline",marginBottom:12}}>
        <h2 className="h-serif" style={{fontSize:24,margin:0}}>Sessions</h2>
        <button className="btn btn--primary" onClick={onStart}><Icon name="plus" size={14}/> Begin new</button>
      </div>
      <div className="session-list">
        {sessions.length===0&&<div style={{padding:"32px 0",color:"var(--hf-fg-muted)",fontSize:14,fontStyle:"italic"}}>Nothing here yet.</div>}
        {[...sessions].reverse().map((s,i)=>(
          <div key={s.id||i} className="session-row">
            {/* Period: "HH:MM — HH:MM" or just end time for old entries */}
            <span className="session-row__time">
              {s.startTime?`${s.startTime} — ${s.time}`:s.time}
            </span>
            {editId===s.id ? (
              <input ref={editRef} className="session-row__edit"
                value={editVal}
                onChange={e=>setEditVal(e.target.value)}
                onBlur={commitEdit}
                onKeyDown={e=>{ if(e.key==="Enter") commitEdit(); if(e.key==="Escape"){ setEditId(null); } }}
              />
            ) : (
              <span className="session-row__task"
                style={{display:"flex",alignItems:"center",gap:7}}
                title="Click to rename"
                onClick={()=>startEdit(s)}>
                {s.quality&&<span className="quality-stars" title={s.quality+" star"+(s.quality>1?"s":"")}>{"★".repeat(s.quality)}</span>}
                {s.task}
              </span>
            )}
            <span className="badge badge--neutral">{MODES.find(m=>m.id===s.mode)?.label||s.mode}</span>
            <span className="session-row__dur">{fmtDur(s.dur)}</span>
            <button className="iconbtn btn--danger session-row__del" title="Delete session" aria-label={`Delete session: ${s.task||"untitled"}`} onClick={()=>onDelete(s.id)}>
              <Icon name="x" size={13}/>
            </button>
          </div>
        ))}
      </div>
      {sessions.length>0&&<p style={{fontSize:12,color:"var(--hf-fg-subtle)",marginTop:16,fontStyle:"italic"}}>Click a name to rename · hover to delete.</p>}
    </div>
  );
};

/* ── Heatmap ── */
const Heatmap = ({ sessions }) => {
  const dayMap = {};
  sessions.forEach(s=>{ if(s.date){ const d=localDate(new Date(s.date)); dayMap[d]=(dayMap[d]||0)+Math.floor(s.dur/60); } });
  const today = new Date(); today.setHours(12,0,0,0);
  // Build 91 days (13 complete weeks), starting from the Monday 13 weeks ago
  const startDay = new Date(today);
  startDay.setDate(today.getDate() - today.getDay() + 1 - 12*7); // Monday 13 weeks ago
  const cells = []; // array of 91 dates in order
  for(let i=0;i<91;i++){
    const d=new Date(startDay); d.setDate(startDay.getDate()+i);
    const key=localDate(d);
    cells.push({key,mins:dayMap[key]||0,d:new Date(d)});
  }
  // Group into 13 columns of 7
  const weeks=[]; for(let w=0;w<13;w++) weeks.push(cells.slice(w*7,w*7+7));
  const getLevel=(mins)=>{ if(mins===0)return 0; if(mins<20)return 1; if(mins<45)return 2; if(mins<90)return 3; return 4; };
  // Month labels: one per week-column based on which month the Monday falls in
  const monthLabels = weeks.map((wk,i)=>{
    if(i===0) return wk[0].d.toLocaleDateString("en-US",{month:"short"});
    const prev=weeks[i-1][0].d.getMonth();
    const cur=wk[0].d.getMonth();
    return cur!==prev ? wk[0].d.toLocaleDateString("en-US",{month:"short"}) : "";
  });
  const todayStr2 = localDate();
  return (
    <div className="heatmap">
      <div className="heatmap__months">
        {monthLabels.map((label,i)=>(
          <div key={i} style={{width:13+3,flexShrink:0,overflow:"visible"}}>
            <span>{label}</span>
          </div>
        ))}
      </div>
      <div className="heatmap__grid">
        {weeks.map((wk,wi)=>(
          <div key={wi} className="heatmap__col">
            {wk.map((cell,di)=>(
              <div key={di}
                className={"heatmap__cell"+(getLevel(cell.mins)>0?` heatmap__cell--l${getLevel(cell.mins)}`:"")}
                title={`${cell.key}${cell.mins>0?` · ${fmtMins(cell.mins)}`:""}`}
                style={cell.key===todayStr2?{outline:"1.5px solid var(--hf-sand-500)",outlineOffset:"1px"}:{}}
              />
            ))}
          </div>
        ))}
      </div>
      <div style={{display:"flex",gap:6,alignItems:"center",marginTop:10,justifyContent:"flex-end"}}>
        <span style={{fontSize:10,color:"var(--hf-fg-subtle)"}}>Less</span>
        {[0,1,2,3,4].map(l=><div key={l} className={"heatmap__cell"+(l>0?` heatmap__cell--l${l}`:"")} style={{width:11,height:11}}/>)}
        <span style={{fontSize:10,color:"var(--hf-fg-subtle)"}}>More</span>
      </div>
    </div>
  );
};

/* ── calcStreak / insights ── */
const calcStreak = (sessions) => {
  const days=[...new Set(sessions.map(s=>s.date?localDate(new Date(s.date)):null).filter(Boolean))].sort();
  if(!days.length) return 0;
  const today=localDate();
  const yest=new Date(); yest.setDate(yest.getDate()-1);
  const ystStr=localDate(yest);
  if(days[days.length-1]!==today&&days[days.length-1]!==ystStr) return 0;
  let streak=1;
  for(let i=days.length-2;i>=0;i--){
    const diff=Math.round((new Date(days[i+1]+"T12:00:00")-new Date(days[i]+"T12:00:00"))/(86400000));
    if(diff===1) streak++; else break;
  }
  return streak;
};
const getBestDay = (sessions) => {
  const dayNames=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
  const byDay=Array(7).fill(0);
  sessions.forEach(s=>{ if(s.date){ const d=new Date(s.date); byDay[d.getDay()]+=Math.floor(s.dur/60); } });
  const max=Math.max(...byDay);
  if(max===0) return null;
  return dayNames[byDay.indexOf(max)];
};
const getAvgLen = (sessions) => {
  if(!sessions.length) return null;
  return Math.floor(sessions.reduce((a,s)=>a+s.dur,0)/sessions.length/60);
};

/* ── Derived insights ──────────────────────────────────────────────────────
   Everything below reads only data the app already records. Each finding needs
   a minimum sample before it is shown — a "golden hour" drawn from two sessions
   is noise dressed up as advice. */
const MIN_RATED = 3;   // per bucket, before a bucket is allowed to make a claim
const avg = (xs) => xs.reduce((a,b)=>a+b,0)/xs.length;

const DAY_PARTS = [
  { id:"early",     label:"before 9am",       from:5,  to:9  },
  { id:"morning",   label:"the late morning", from:9,  to:12 },
  { id:"afternoon", label:"the afternoon",    from:12, to:17 },
  { id:"evening",   label:"the evening",      from:17, to:21 },
  { id:"night",     label:"late at night",    from:21, to:29 }, // wraps past midnight
];
const partOfDay = (d) => {
  const h=d.getHours();
  return DAY_PARTS.find(p=>(h>=p.from&&h<p.to)||(p.to>24&&(h>=p.from||h<p.to-24))) || DAY_PARTS[4];
};

// When are your best sessions? Compares average quality across parts of the day.
const getGoldenHours = (sessions) => {
  const rated=sessions.filter(s=>s.quality>0&&s.date);
  const buckets={};
  rated.forEach(s=>{
    const p=partOfDay(new Date(s.date));
    (buckets[p.id]=buckets[p.id]||{label:p.label,qs:[]}).qs.push(s.quality);
  });
  const eligible=Object.values(buckets).filter(b=>b.qs.length>=MIN_RATED);
  if(eligible.length<2) return null;
  const scored=eligible.map(b=>({...b,avg:avg(b.qs)})).sort((a,b)=>b.avg-a.avg);
  const best=scored[0], worst=scored[scored.length-1];
  if(best.avg-worst.avg<0.4) return null; // no meaningful spread
  return { best, worst };
};

// Do longer sessions actually serve you, or do they just feel productive?
const getLengthEffect = (sessions) => {
  const rated=sessions.filter(s=>s.quality>0);
  const bands=[
    { label:"under 30 min", test:s=>s.dur<30*60,                  qs:[] },
    { label:"30 to 60 min", test:s=>s.dur>=30*60&&s.dur<=60*60,   qs:[] },
    { label:"over an hour", test:s=>s.dur>60*60,                  qs:[] },
  ];
  rated.forEach(s=>{ const b=bands.find(b=>b.test(s)); if(b) b.qs.push(s.quality); });
  const eligible=bands.filter(b=>b.qs.length>=MIN_RATED);
  if(eligible.length<2) return null;
  const scored=eligible.map(b=>({label:b.label,avg:avg(b.qs),n:b.qs.length})).sort((a,b)=>b.avg-a.avg);
  if(scored[0].avg-scored[scored.length-1].avg<0.4) return null;
  return { best:scored[0], worst:scored[scored.length-1] };
};

// Which timer mode produces your best work?
const getBestMode = (sessions) => {
  const buckets={};
  sessions.filter(s=>s.quality>0).forEach(s=>{ (buckets[s.mode]=buckets[s.mode]||[]).push(s.quality); });
  const eligible=Object.entries(buckets).filter(([,qs])=>qs.length>=MIN_RATED);
  if(eligible.length<2) return null;
  const scored=eligible.map(([m,qs])=>({mode:MODES.find(x=>x.id===m)?.label||m,avg:avg(qs)})).sort((a,b)=>b.avg-a.avg);
  if(scored[0].avg-scored[scored.length-1].avg<0.4) return null;
  return scored[0];
};

// How long since a session you'd call excellent?
const getDaysSinceBest = (sessions) => {
  const best=sessions.filter(s=>s.quality===5&&s.date).sort((a,b)=>new Date(b.date)-new Date(a.date))[0];
  if(!best) return null;
  const days=Math.floor((new Date(localDate()+"T12:00:00")-new Date(localDate(new Date(best.date))+"T12:00:00"))/86400000);
  return { days, task:best.task };
};

// Showing up at all, over the last 30 days.
const getConsistency = (sessions) => {
  const start=new Date(); start.setDate(start.getDate()-29);
  const startKey=localDate(start);
  const days=new Set(sessions.filter(s=>s.date&&localDate(new Date(s.date))>=startKey).map(s=>localDate(new Date(s.date))));
  if(days.size===0) return null;
  return { days:days.size, pct:Math.round((days.size/30)*100) };
};

/* Measuring backwards — the Gain, not the Gap. Compares a recent window against
   the window before it. Everything else in this app measures forward, toward a
   target you have not reached; this is the one place that measures the distance
   already travelled. */
const windowStats = (sessions, fromDaysAgo, toDaysAgo) => {
  const now=new Date();
  const from=new Date(now); from.setDate(now.getDate()-fromDaysAgo); const fromKey=localDate(from);
  const to=new Date(now);   to.setDate(now.getDate()-toDaysAgo);     const toKey=localDate(to);
  const inWin=sessions.filter(s=>{ if(!s.date) return false; const d=localDate(new Date(s.date)); return d>=fromKey&&d<toKey; });
  const rated=inWin.filter(s=>s.quality>0);
  return {
    hours: inWin.reduce((a,s)=>a+(s.dur||0),0)/3600,
    sessions: inWin.length,
    days: new Set(inWin.map(s=>localDate(new Date(s.date)))).size,
    quality: rated.length ? avg(rated.map(s=>s.quality)) : null,
  };
};
const getGain = (sessions, span=30) => {
  const now=windowStats(sessions, span, 0);
  const before=windowStats(sessions, span*2, span);
  if(now.sessions===0&&before.sessions===0) return null;
  return { now, before, span };
};

// Does the kind of break you take change the quality of the session after it?
const getRestEffect = (sessions, breaks) => {
  const typed=(breaks||[]).filter(b=>b.type&&b.date);
  if(typed.length<4) return null;
  const buckets={real:[],degenerate:[]};
  sessions.filter(s=>s.quality>0&&s.date).forEach(s=>{
    const st=new Date(s.date);
    // the most recent classified break that ended before this session, same day
    const prior=typed
      .filter(b=>new Date(b.date)<st&&localDate(new Date(b.date))===localDate(st))
      .sort((a,b)=>new Date(b.date)-new Date(a.date))[0];
    if(prior) buckets[prior.type].push(s.quality);
  });
  if(buckets.real.length<MIN_RATED||buckets.degenerate.length<MIN_RATED) return null;
  const r=avg(buckets.real), d=avg(buckets.degenerate);
  if(Math.abs(r-d)<0.4) return null;
  return { real:r, degenerate:d, nReal:buckets.real.length, nDeg:buckets.degenerate.length };
};

// Hours by kind of mental work — did the day have all three of its moments?
const kindSecs = (sessions) => {
  const out={use:0,fill:0,empty:0};
  sessions.forEach(s=>{ const k=s.kind||"use"; if(out[k]!=null) out[k]+=(s.dur||0); });
  return out;
};

// Hours actually spent per goal.
const getGoalHours = (sessions, goals=[]) => goals
  .filter(g=>!g.archived)
  .map(g=>({ ...g, hours:sessions.reduce((a,s)=>a+(s.goalId===g.id?(s.dur||0):0),0)/3600 }))
  .filter(g=>g.hours>0)
  .sort((a,b)=>b.hours-a.hours);

/* ── Stats ── */
const Stats = ({ sessions, purpose={}, breaks=[] }) => {
  const [period, setPeriod] = useState("week");
  const [gainSpan, setGainSpan] = useState(30);
  const today   = todayStr();
  const ws      = getWeekStart();
  const monthPfx= localDate().slice(0,7);
  const filtered = sessions.filter(s=>{
    if(!s.date) return false;
    const d=localDate(new Date(s.date));
    if(period==="today") return d===today;
    if(period==="week")  return d>=ws;
    if(period==="month") return d.startsWith(monthPfx);
    return true;
  });
  // `dur` can be missing on very old or hand-edited records — a bare + would
  // turn every total on this page into NaN.
  const totalSecs=filtered.reduce((a,s)=>a+(s.dur||0),0);
  const modeMap={};
  filtered.forEach(s=>{ modeMap[s.mode]=(modeMap[s.mode]||0)+(s.dur||0); });
  const todayDayIdx=(new Date().getDay()+6)%7;
  const days=["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
  const weekMins=Array(7).fill(0);
  const wsDate=new Date(ws+"T00:00:00");
  sessions.filter(s=>s.date&&localDate(new Date(s.date))>=ws).forEach(s=>{
    const sLocal=localDate(new Date(s.date));
    const diff=Math.floor((new Date(sLocal+"T00:00:00")-wsDate)/86400000);
    if(diff>=0&&diff<7) weekMins[diff]+=Math.floor((s.dur||0)/60);
  });
  const maxMins=Math.max(...weekMins,1);
  const showChart=period==="week"||period==="today";
  const byMonth={};
  sessions.forEach(s=>{ if(s.date){ const m=localDate(new Date(s.date)).slice(0,7); byMonth[m]=(byMonth[m]||0)+(s.dur||0); } });

  const streak   = calcStreak(sessions);
  const bestDay  = getBestDay(sessions);
  const avgLen   = getAvgLen(sessions);
  const flowSessions = sessions.filter(s=>s.quality>=4).length;

  /* Every finding below walks the full history. Without this they would be
     recomputed on each keystroke and each tick — a dozen passes over a year of
     sessions, for numbers that only change when the sessions do. */
  const derived = React.useMemo(()=>({
    golden:      getGoldenHours(sessions),
    lengthFx:    getLengthEffect(sessions),
    bestMode:    getBestMode(sessions),
    sinceBest:   getDaysSinceBest(sessions),
    consistency: getConsistency(sessions),
    goalHours:   getGoalHours(sessions, purpose.goals),
    ratedCount:  sessions.filter(s=>s.quality>0).length,
    restFx:      getRestEffect(sessions, breaks),
  }),[sessions,breaks,purpose.goals]);
  const {golden,lengthFx,bestMode,sinceBest,consistency,goalHours,ratedCount,restFx}=derived;
  const gain = React.useMemo(()=>getGain(sessions,gainSpan),[sessions,gainSpan]);

  const findings = [
    golden && { icon:"sun", text:<>Your sharpest work happens <b>{golden.best.label}</b> — {golden.best.avg.toFixed(1)}★ on average, against {golden.worst.avg.toFixed(1)}★ {golden.worst.label}.</>,
      note:"Protect that window before you give it to anything else." },
    lengthFx && { icon:"timer", text:<>Sessions <b>{lengthFx.best.label}</b> rate highest at {lengthFx.best.avg.toFixed(1)}★; {lengthFx.worst.label} sits at {lengthFx.worst.avg.toFixed(1)}★.</>,
      note:lengthFx.best.label==="over an hour" ? "Long stretches are working for you — defend them." : "Longer is not automatically deeper." },
    bestMode && { icon:"target", text:<><b>{bestMode.mode}</b> is your strongest mode, averaging {bestMode.avg.toFixed(1)}★.</> },
    restFx && { icon:"coffee",
      text:<>Sessions after <b>real rest</b> average {restFx.real.toFixed(1)}★; after screens, {restFx.degenerate.toFixed(1)}★.</>,
      note:restFx.real>restFx.degenerate
        ? "Emptying the input actually restores you. The scroll only felt like a break."
        : "Unusual — worth watching before you trust it." },
    consistency && { icon:"calendar", text:<>You showed up on <b>{consistency.days} of the last 30 days</b> — {consistency.pct}%.</>,
      note:consistency.pct>=70 ? "That is the number that compounds." : "Frequency beats intensity. A short session still keeps the chain alive." },
    sinceBest && { icon:"star",
      text:sinceBest.days===0
        ? <>You logged a <b>5★ session today</b>. Note what made it possible.</>
        : <>It has been <b>{sinceBest.days} {sinceBest.days===1?"day":"days"}</b> since a 5★ session.</>,
      note:sinceBest.days===0?null:`The last one: "${sinceBest.task}"` },
  ].filter(Boolean);

  return (
    <div className="page">
      <div style={{marginBottom:16}}><div className="eyebrow">{new Date().toLocaleDateString("en-US",{month:"long",year:"numeric"})}</div><h1 className="h-serif" style={{fontSize:44,margin:"8px 0 0"}}>Stats</h1></div>
      {/* Insights */}
      {sessions.length>0&&(
        <div className="insights">
          {streak>0&&<span className="insight-chip"><Icon name="zap" size={11}/><b>{streak}-day</b> streak</span>}
          {bestDay&&<span className="insight-chip"><Icon name="calendar" size={11}/>Best day: <b>{bestDay}</b></span>}
          {avgLen&&<span className="insight-chip"><Icon name="timer" size={11}/>Avg session: <b>{avgLen}m</b></span>}
          {flowSessions>0&&<span className="insight-chip"><Icon name="star" size={11}/><b>{flowSessions}</b> {flowSessions===1?"session":"sessions"} rated 4-5★</span>}
        </div>
      )}
      {/* ── The Gain — measured backwards, deliberately placed before anything
             that measures forward. ── */}
      {gain&&(
        <div style={{marginBottom:28}}>
          <div style={{display:"flex",alignItems:"baseline",justifyContent:"space-between",gap:14,flexWrap:"wrap",margin:"28px 0 4px"}}>
            <h2 className="h-serif" style={{fontSize:24,margin:0}}>How far you've come</h2>
            <div className="stats-periods" style={{margin:0}}>
              {[30,90].map(s=>(
                <button key={s} className={"stats-period"+(gainSpan===s?" stats-period--active":"")} onClick={()=>setGainSpan(s)}>{s} days</button>
              ))}
            </div>
          </div>
          <p style={{fontSize:12.5,color:"var(--hf-fg-muted)",lineHeight:1.65,margin:"0 0 14px",maxWidth:620}}>
            The previous {gainSpan} days against the {gainSpan} before them. Everything below this
            measures you against where you want to be; this measures you against where you were.
          </p>
          <div className="card-s">
            <div className="gain-grid">
              {[
                { label:"Hours focused", then:gain.before.hours.toFixed(1)+"h", now:gain.now.hours.toFixed(1)+"h", d:gain.now.hours-gain.before.hours, fmt:v=>v.toFixed(1)+"h" },
                { label:"Sessions",      then:gain.before.sessions,             now:gain.now.sessions,             d:gain.now.sessions-gain.before.sessions, fmt:v=>String(v) },
                { label:"Days shown up", then:gain.before.days,                 now:gain.now.days,                 d:gain.now.days-gain.before.days, fmt:v=>String(v) },
                { label:"Avg quality",   then:gain.before.quality?gain.before.quality.toFixed(1)+"★":"—",
                                         now:gain.now.quality?gain.now.quality.toFixed(1)+"★":"—",
                                         d:(gain.now.quality&&gain.before.quality)?gain.now.quality-gain.before.quality:0, fmt:v=>v.toFixed(1)+"★" },
              ].map(g=>(
                <div className="gain" key={g.label}>
                  <div className="gain__label">{g.label}</div>
                  <div className="gain__row">
                    <span className="gain__then">{g.then}</span>
                    <span className="gain__arrow">→</span>
                    <span className="gain__now">{g.now}</span>
                  </div>
                  <div className={"gain__delta "+(g.d>0?"gain__delta--up":"gain__delta--flat")}>
                    {g.d>0?`+${g.fmt(g.d)} more than before`:g.d<0?`${g.fmt(g.d)} vs before`:"level"}
                  </div>
                </div>
              ))}
            </div>
            <p style={{fontSize:13,color:"var(--hf-fg-body)",lineHeight:1.7,margin:"20px 0 0",paddingTop:18,borderTop:"1px solid var(--hf-border)",fontStyle:"italic"}}>
              What do you know today that you didn't know {gainSpan} days ago?
            </p>
          </div>
        </div>
      )}

      {/* ── What the data says ── */}
      {sessions.length>0&&(
        <div style={{marginBottom:28}}>
          <h2 className="h-serif" style={{fontSize:24,margin:"28px 0 4px"}}>What the data says</h2>
          <p style={{fontSize:12.5,color:"var(--hf-fg-muted)",lineHeight:1.65,margin:"0 0 14px"}}>
            Drawn from your own sessions. Findings appear once there is enough rated data to mean something.
          </p>
          <div className="card-s">
            {findings.length>0
              ? findings.map((f,i)=>(
                  <div className="finding" key={i}>
                    <span className="finding__icon"><Icon name={f.icon} size={16}/></span>
                    <div className="finding__text">{f.text}{f.note&&<span className="finding__note">{f.note}</span>}</div>
                  </div>
                ))
              : <p style={{fontSize:13,color:"var(--hf-fg-muted)",margin:0,lineHeight:1.7}}>
                  Nothing conclusive yet. You have rated <b>{ratedCount}</b> {ratedCount===1?"session":"sessions"} —
                  rate a few more at the end of each session and patterns start showing up here.
                </p>}
          </div>
        </div>
      )}

      {/* ── Where the hours went ── */}
      {goalHours.length>0&&(
        <div style={{marginBottom:28}}>
          <h2 className="h-serif" style={{fontSize:24,margin:"0 0 4px"}}>Where the hours went</h2>
          <p style={{fontSize:12.5,color:"var(--hf-fg-muted)",lineHeight:1.65,margin:"0 0 14px"}}>
            Time attributed to each goal, all time.
          </p>
          <div className="card-s">
            {goalHours.map(g=>(
              <div className="goal-line" key={g.id}>
                <span className="goal-line__name">{g.title}</span>
                <span className="goal-line__h"><b>{g.hours.toFixed(1)}h</b> / {g.target}h</span>
              </div>
            ))}
          </div>
        </div>
      )}

      <div className="stats-periods">
        {[{id:"today",label:"Today"},{id:"week",label:"This week"},{id:"month",label:"This month"},{id:"all",label:"All time"}].map(p=>(
          <button key={p.id} className={"stats-period"+(period===p.id?" stats-period--active":"")} onClick={()=>setPeriod(p.id)}>{p.label}</button>
        ))}
      </div>
      <div className="card-s" style={{marginBottom:24}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"baseline",marginBottom:24}}>
          <div>
            <div className="eyebrow">Total focused</div>
            <div style={{fontFamily:"var(--hf-font-mono)",fontSize:52,fontWeight:300,letterSpacing:"-0.02em",lineHeight:1,marginTop:8}}>
              {totalSecs?fmtDur(totalSecs):<span style={{color:"var(--hf-fg-subtle)"}}>—</span>}
            </div>
          </div>
          <div style={{display:"flex",gap:32,textAlign:"right"}}>
            <div><div className="eyebrow">Sessions</div><div style={{fontFamily:"var(--hf-font-mono)",fontSize:22,fontWeight:400,marginTop:8,color:"var(--hf-fg-body)"}}>{filtered.length}</div></div>
            <div><div className="eyebrow">Avg length</div><div style={{fontFamily:"var(--hf-font-mono)",fontSize:22,fontWeight:400,marginTop:8,color:"var(--hf-fg-body)"}}>{filtered.length?fmtDur(Math.floor(totalSecs/filtered.length)):"—"}</div></div>
          </div>
        </div>
        {showChart&&(totalSecs===0?(
          <div style={{height:160,display:"flex",alignItems:"center",justifyContent:"center",color:"var(--hf-fg-subtle)",fontSize:13,fontStyle:"italic"}}>Nothing recorded yet.</div>
        ):(
          <>
            <div className="chart">
              {weekMins.map((m,i)=>(
                <div key={i} className={"chart__bar"+(i===todayDayIdx?" chart__bar--today":i>todayDayIdx?" chart__bar--dim":"")} style={{height:`${(m/maxMins)*100}%`}}/>
              ))}
            </div>
            <div className="chart__labels">{days.map(d=><span key={d}>{d}</span>)}</div>
          </>

/* ── Breath ── */
const Breath = ({ onDone, duration=60 }) => {
  const seq=["Inhale","Hold","Exhale","Hold"];
  const [i, setI] = useState(0);
  const [remaining, setRemaining] = useState(duration);
  useEffect(()=>{
    const t=setInterval(()=>setI(v=>(v+1)%seq.length),3500);
    const end=setTimeout(onDone, duration*1000);
    return ()=>{ clearInterval(t); clearTimeout(end); };
  },[duration]);
  useEffect(()=>{
    const t=setInterval(()=>setRemaining(r=>Math.max(0,r-1)),1000);
    return ()=>clearInterval(t);
  },[]);
  const mins=Math.floor(remaining/60), secs=remaining%60;
  const timeStr=mins>0?`${mins}:${String(secs).padStart(2,"0")}`:`${secs}s`;
  return (
    <div className="breath-stage">
      <div className="breath-prompt">Take a breath.</div>
      <div className="breath-circle"><div className="breath-dot"/></div>
      <div className="breath-cue">{seq[i]}</div>
      <div style={{fontFamily:"var(--hf-font-mono)",fontSize:14,color:"var(--hf-fg-muted)"}}>{timeStr}</div>
      <button className="btn btn--ghost" onClick={onDone}>Skip</button>
    </div>
  );
};

/* ── Preload ──────────────────────────────────────────────────────────────
   Phase 1 of the vault's focus protocol: 10-20 minutes of deliberate nothing
   before the work, so the work becomes the most stimulating option available.
   The screen is empty on purpose. Boredom is the mechanism, not a bug. */
const Preload = ({ onDone, duration=600 }) => {
  const [remaining, setRemaining] = useState(duration);
  const startRef = useRef(Date.now());
  useEffect(()=>{
    const t=setInterval(()=>{
      const left=duration-Math.floor((Date.now()-startRef.current)/1000);
      setRemaining(Math.max(0,left));
      if(left<=0){ clearInterval(t); playChime(); onDone(); }
    },500);
    return ()=>clearInterval(t);
  },[duration]);
  const mins=Math.floor(remaining/60), secs=remaining%60;
  return (
    <div className="breath-stage">
      <div className="breath-prompt">Sit with nothing.</div>
      <p style={{fontSize:13,color:"var(--hf-fg-muted)",maxWidth:380,textAlign:"center",lineHeight:1.7,margin:0}}>
        No phone, no music, no input. Let it get boring — you are creating the
        state where the work is the most interesting thing in the room.
      </p>
      <div style={{fontFamily:"var(--hf-font-mono)",fontWeight:300,fontSize:64,letterSpacing:"-0.02em",color:"var(--hf-fg)"}}>
        {mins}:{String(secs).padStart(2,"0")}
      </div>
      <button className="btn btn--ghost" onClick={onDone}>Skip</button>
    </div>
  );
};
